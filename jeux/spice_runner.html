<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Spice Runner — Hub Jeux</title>
<link rel="stylesheet" href="../style.css">
<style>
:root {
    --bg: #0a0402;
    --gold: #cda434;
    --text: #f5deb3;
    --muted: #7c5e2a;
}
html, body {
    overflow: hidden; height: 100%; margin: 0;
    touch-action: none; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
}
body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
}
#game-wrapper {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
}
canvas {
    border: 1px solid #3d2b16; border-radius: 8px;
    box-shadow: 0 0 60px rgba(205,164,52,0.08), 0 0 120px rgba(180,120,30,0.04);
    cursor: pointer; display: block;
}
.game-header {
    display: flex; align-items: center; gap: 14px;
    width: 100%; max-width: 800px; padding: 10px 16px; box-sizing: border-box;
    background: rgba(0,0,0,0.4); border: 1px solid #3d2b16; border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.35);
}
.game-header .back-link {
    color: var(--gold); text-decoration: none; font-weight: bold; font-size: 0.82em;
    border: 1px solid #7c5e2a; border-radius: 4px; padding: 6px 14px;
    background: linear-gradient(180deg, #2a1a0b, #1a0f05);
    transition: all 0.2s; white-space: nowrap;
}
.game-header .back-link:hover { background: var(--gold); color: #000; border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
.game-header .game-title {
    font-size: 1.15em; font-weight: bold; color: var(--gold);
    text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px rgba(205,164,52,0.3);
}
.score-live { font-size: 1.25em; color: #ffcc00; font-weight: bold; margin-left: auto; }

#leaderboard {
    position: absolute; right: -240px; top: 0; width: 220px;
    background: rgba(10,5,2,0.92); border: 1px solid #3d2b16;
    border-radius: 8px; padding: 16px 14px; font-size: 0.78em;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
#leaderboard h3 {
    margin: 0 0 12px; color: var(--gold); font-size: 0.95em;
    text-align: center; text-transform: uppercase; letter-spacing: 2px;
}
#lb-list { list-style: none; padding: 0; margin: 0; }
#lb-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; border-bottom: 1px solid rgba(61,43,22,0.4);
}
#lb-list li .rank { color: var(--muted); width: 26px; font-size: 0.9em; }
#lb-list li .name { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#lb-list li .pts { color: #ffcc00; font-weight: bold; min-width: 44px; text-align: right; }
#lb-list li.me .name { color: var(--gold); }
.controls-hint { font-size: 0.72em; color: var(--muted); text-align: center; opacity: 0.7; }

/* Responsive */
@media (max-width: 900px) {
    #leaderboard { position: static; width: 90vw; max-width: 500px; margin-top: 6px; }
}
@media (max-width: 820px) {
    canvas { width: 95vw !important; height: auto !important; }
}
</style>
</head>
<body>
<script src="../auth-guard.js"></script>
<div id="game-wrapper">
    <div class="game-header">
        <a href="hub.html" class="back-link">&larr; Hub Jeux</a>
        <span class="game-title">🏃 Spice Runner</span>
        <span class="score-live" id="score-display">0</span>
    </div>
    <canvas id="game" width="800" height="350"></canvas>
    <div class="controls-hint" id="controls-hint">
        [Espace / Clic] Sauter &nbsp;&bull;&nbsp; [&darr;] Glisser &nbsp;&bull;&nbsp; Double-saut en l'air
    </div>
    <div id="leaderboard">
        <h3>🏆 Classement</h3>
        <ul id="lb-list"><li style="color:var(--muted)">Chargement…</li></ul>
    </div>
</div>

<script>
;(function () {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 350;
const GAME_ID = 'spice_runner';

// ──────────────────────────────────────────────
//  CONSTANTES PHYSIQUES
// ──────────────────────────────────────────────
const TARGET_FPS = 60, FRAME_DUR = 1000 / TARGET_FPS;
const GROUND_Y = H - 50;
// Gravité asymétrique, poussée franchement pour que ça se sente : montée
// lente qui flotte nettement au sommet (~18 ticks), chute rapide et nerveuse
// (~10 ticks) — au lieu d'une parabole symétrique. Hauteur de saut ~64px,
// inchangée par rapport à l'ancien réglage, seule la forme de l'arc bouge.
const GRAVITY_UP = 0.4, GRAVITY_DOWN = 1.3;
const JUMP_FORCE = -7.2, DOUBLE_JUMP = -6.5;
const JUMP_BUFFER_FRAMES = 6; // fenêtre de tolérance : un saut pressé juste avant
                               // l'atterrissage se déclenche quand même au sol
const SLIDE_DURATION = 35;
const BASE_SPEED = 3.5, MAX_SPEED = 8, SPEED_ACCEL = 0.0008;
const PLAYER_W = 28, PLAYER_H = 48, PLAYER_H_SLIDE = 22, PLAYER_X = 100;
const HIT_PAD = 6;
const PIPE_W = 48, GAP = 175;

// ──────────────────────────────────────────────
//  PALETTE JOUR / NUIT (avec interpolation)
// ──────────────────────────────────────────────
const DAY = {
    skyTop: '#4a2010', skyHigh: '#8b3a18', skyMid: '#c06028', skyLow: '#e0a040', skyHorizon: '#f0c878',
    mountain: '#3a1e10', mountainLight: '#5a3020',
    duneFar: '#9a6a38', duneMid: '#b88545', duneNear: '#c99850',
    ground: '#d2a64a', groundDark: '#a07828',
};
const NIGHT = {
    skyTop: '#0a0a1e', skyHigh: '#181835', skyMid: '#252545', skyLow: '#353560', skyHorizon: '#505080',
    mountain: '#151028', mountainLight: '#251838',
    duneFar: '#2a2040', duneMid: '#3a3050', duneNear: '#453858',
    ground: '#3a3055', groundDark: '#282045',
};
const PAL_COMMON = {
    sun: '#fff5d0', rock: '#4a3018', rockLight: '#6b4a2a', rockShadow: '#2a1808',
    playerBody: '#2e1a0c', playerCape: '#4a3020', playerSkin: '#c49a6c', eyes: '#4488cc',
    spice: '#ffd700', gold: '#ffcc00', red: '#c44', white: '#f5deb3',
};

function lerpColor(a, b, t) {
    const pa = parseInt, ha = a.slice(1), hb = b.slice(1);
    const r = Math.round(pa(ha.substr(0,2),16)*(1-t) + pa(hb.substr(0,2),16)*t);
    const g = Math.round(pa(ha.substr(2,2),16)*(1-t) + pa(hb.substr(2,2),16)*t);
    const bl= Math.round(pa(ha.substr(4,2),16)*(1-t) + pa(hb.substr(4,2),16)*t);
    return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}
function cc(key) { return lerpColor(DAY[key], NIGHT[key], nightPhase); }

// ──────────────────────────────────────────────
//  AUDIO (optimisé)
// ──────────────────────────────────────────────
let audioCtx = null;
function audCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}
function tone(freq, dur, vol=0.07, type='sine') {
    try {
        const a = audCtx(), t = a.currentTime;
        const o = a.createOscillator(), g = a.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        o.frequency.exponentialRampToValueAtTime(freq*0.5, t+dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t+dur);
        o.connect(g); g.connect(a.destination);
        o.start(t); o.stop(t+dur);
    } catch(e){}
}
function sndJump()      { tone(280, 0.1, 0.1, 'triangle'); setTimeout(()=>tone(480, 0.06, 0.08), 30); }
function sndDoubleJump() { tone(420, 0.1, 0.1, 'sine'); setTimeout(()=>tone(700, 0.08, 0.08), 40); }
function sndSlide()     { tone(150, 0.08, 0.05, 'sawtooth'); }
function sndSpice()     { tone(880, 0.06, 0.08); setTimeout(()=>tone(1100, 0.06, 0.06), 40); }
function sndCloseCall() { tone(600, 0.06, 0.06, 'sawtooth'); }
function sndMilestone() {
    [523, 659, 784, 1047].forEach((f,i) => setTimeout(()=>tone(f,0.12,0.08), i*70));
}
function sndCrash() {
    try {
        const a = audCtx(), t = a.currentTime;
        const len = a.sampleRate * 0.25;
        const buf = a.createBuffer(1, len, a.sampleRate);
        const d = buf.getChannelData(0);
        for (let i=0; i<len; i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len,2.5);
        const src = a.createBufferSource(), g = a.createGain();
        src.buffer = buf; g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.25);
        src.connect(g); g.connect(a.destination); src.start(t);
        tone(70, 0.2, 0.15, 'sine');
    } catch(e){}
}
function sndPowerup()   { [660,880,1100].forEach((f,i)=>setTimeout(()=>tone(f,0.08,0.1), i*60)); }
function sndDrone()     { tone(100, 0.25, 0.04, 'sawtooth'); }
function sndWarning()   { for (let i=0; i<3; i++) tone(800, 0.06, 0.06, 'square', i*0.12); }
function sndBoost()     { tone(200, 0.2, 0.08, 'sawtooth'); }

// ──────────────────────────────────────────────
//  ÉTAT GLOBAL
// ──────────────────────────────────────────────
let player, obstacles, spiceItems, powerups, dustTrail, floatingTexts;
let distance, spiceCount, combo, comboTimer, bestScore, gameState, frameCount;
let gameSpeed, startTime, scoreSecret;
let shakeTimer = 0, shakeIntensity = 0;
let milestone = 0, nightPhase = 0;
let magnetTimer = 0, boostTimer = 0;
let finalScore = 0, finalDist = 0, finalSpice = 0;
let lastTime = 0, accumulator = 0;
let missiles = [];
let stars = [], mountains = [], duneFarPts = [], duneMidPts = [], duneNearPts = [];
let nextObstacle = 0;
let jumpBufferTimer = 0;

// ──────────────────────────────────────────────
//  INIT / RESET
// ──────────────────────────────────────────────
function initStars() {
    stars = [];
    for (let i=0; i<50; i++) {
        stars.push({
            x: Math.random()*W, y: Math.random()*(GROUND_Y-80),
            r: 0.4+Math.random()*1.2, twinkle: Math.random()*Math.PI*2,
            speed: 0.01+Math.random()*0.03,
        });
    }
}
function generateTerrain() {
    mountains = [];
    const mountainCount = 14;
    const spacing = (W + 200) / mountainCount;
    for (let i = 0; i < mountainCount; i++) {
        mountains.push({
            x: i * spacing - 100,
            w: 70 + Math.random() * 100,
            h: 40 + Math.random() * 60
        });
    }

    const createDunePoints = (n, baseY) => {
        const arr = [];
        const sp = (W + 200) / n;
        for (let i = 0; i <= n; i++) {
            arr.push({
                x: i * sp - 100,
                baseY: baseY - Math.random() * 25
            });
        }
        return arr;
    };
    duneFarPts = createDunePoints(14, GROUND_Y - 30);
    duneMidPts = createDunePoints(16, GROUND_Y - 15);
    duneNearPts = createDunePoints(18, GROUND_Y - 5);
}

function reset() {
    player = {
        x: PLAYER_X, y: GROUND_Y-PLAYER_H, vy: 0, w: PLAYER_W, h: PLAYER_H,
        grounded: true, canDoubleJump: true, sliding: false, slideTimer: 0,
        runFrame: 0, runTimer: 0, shield: false, shieldTimer: 0,
    };
    obstacles = []; spiceItems = []; powerups = []; dustTrail = []; floatingTexts = []; missiles = [];
    distance = 0; spiceCount = 0; combo = 0; comboTimer = 0; frameCount = 0;
    gameSpeed = BASE_SPEED; nextObstacle = 80; milestone = 0;
    shakeTimer = 0; magnetTimer = 0; boostTimer = 0; nightPhase = 0;
    finalScore = 0; finalDist = 0; finalSpice = 0; jumpBufferTimer = 0;
    startTime = Date.now();
    generateTerrain();
    updateScoreDisplay();
}
function totalScore() { return Math.floor(distance/10) + spiceCount*5; }
function updateScoreDisplay() { document.getElementById('score-display').textContent = totalScore(); }

// ──────────────────────────────────────────────
//  PARTICULES & TEXTES
// ──────────────────────────────────────────────
function spawnDust(x, y, count) {
    for (let i=0; i<count; i++) {
        dustTrail.push({
            x, y: y-Math.random()*4,
            vx: -Math.random()*2-1, vy: -Math.random()*2,
            life: 18+Math.random()*15, maxLife: 33,
            size: 1.5+Math.random()*2.5, hue: 35+Math.random()*15,
        });
    }
}
function addFloatingText(text, x, y, color) {
    floatingTexts.push({ text, x, y, vy: -1.5, life: 45, color, alpha: 1 });
}

// ──────────────────────────────────────────────
//  JEU : OBSTACLES & CO
// ──────────────────────────────────────────────
function distMeters() { return Math.floor(distance/10); }

function spawnObstacle() {
    const dm = distMeters();
    const minGap = Math.max(55, 100 - dm*0.25);
    nextObstacle = frameCount + minGap + Math.random()*45;
    let r = Math.random();
    const hasDrones = dm >= 450, hasMissiles = dm >= 900;

    if (hasMissiles && r < 0.08) { spawnMissile(); return; }
    if (hasDrones && r < 0.18) {
        const bands = [GROUND_Y-28, GROUND_Y-55, GROUND_Y-90];
        obstacles.push({
            type: 'drone', x: W+40, y: bands[Math.floor(Math.random()*3)],
            w: 40, h: 18, phase: 0, passed: false, closeCalled: false,
        });
        if (Math.random()<0.3) sndDrone();
        return;
    }
    // Rock cluster
    if (dm >= 250 && r < 0.25) {
        let cx = W+30;
        const count = 2 + (Math.random()<0.3?1:0);
        for (let i=0; i<count; i++) {
            const w = 18+Math.random()*18, h = 22+Math.random()*22;
            obstacles.push({ type:'rock', x:cx, y:GROUND_Y-h, w, h, passed:false, closeCalled:false });
            cx += w+8+Math.random()*10;
        }
        return;
    }
    // Obstacle unique
    let type, w, h, y;
    if (r < 0.4) {
        type = 'rock'; w = 22+Math.random()*22; h = 28+Math.random()*28; y = GROUND_Y-h;
    } else if (r < 0.58) {
        type = 'overhang'; w = 55+Math.random()*25; h = 18;
        y = GROUND_Y-PLAYER_H_SLIDE-16-Math.random()*8;
    } else if (r < 0.76) {
        type = 'crevasse'; w = 35+Math.random()*28; h = 50; y = GROUND_Y;
    } else {
        type = 'worm'; w = 30; h = 50+Math.random()*35; y = GROUND_Y-h;
    }
    obstacles.push({ type, x:W+30, y, w, h, phase:Math.random()*Math.PI*2, passed:false, closeCalled:false });
}

function spawnMissile() {
    const y = 30+Math.random()*(GROUND_Y-80);
    missiles.push({ x:W+200, y, w:35, h:10, warning:90, speed:gameSpeed*2.5+3 });
    sndWarning();
}

function spawnSpice() {
    if (Math.random()>0.45) return;
    const count = 3+Math.floor(Math.random()*5);
    const baseY = GROUND_Y-50-Math.random()*55;
    const pattern = Math.random()<0.5?'line':'arc';
    for (let i=0; i<count; i++) {
        const sx = W+40+i*28;
        const sy = pattern==='line'?baseY:baseY-Math.sin(i/count*Math.PI)*40;
        spiceItems.push({ x:sx, y:sy, collected:false, sparkle:Math.random()*Math.PI*2 });
    }
}

function spawnPowerup() {
    if (Math.random()>0.12) return;
    const types = ['shield','magnet','boost'];
    const pu = types[Math.floor(Math.random()*types.length)];
    powerups.push({ type:pu, x:W+60, y:GROUND_Y-60-Math.random()*50, collected:false, phase:Math.random()*Math.PI*2 });
}

// ──────────────────────────────────────────────
//  ACTIONS JOUEUR
// ──────────────────────────────────────────────
function playerJump() {
    if (gameState!=='playing') return;
    if (player.sliding) return;
    if (player.grounded) {
        player.vy=JUMP_FORCE; player.grounded=false; player.canDoubleJump=true;
        sndJump(); spawnDust(player.x+player.w/2, GROUND_Y, 6);
        jumpBufferTimer = 0;
    } else if (player.canDoubleJump) {
        player.vy=DOUBLE_JUMP; player.canDoubleJump=false;
        sndDoubleJump(); spawnDust(player.x+player.w/2, player.y+player.h, 4);
    } else {
        // Saut pressé trop tôt (juste avant l'atterrissage) : on le mémorise
        // pour qu'il se déclenche automatiquement dès que le joueur touche le sol.
        jumpBufferTimer = JUMP_BUFFER_FRAMES;
    }
}
function playerSlide() {
    if (gameState!=='playing' || !player.grounded || player.sliding) return;
    player.sliding=true; player.slideTimer=SLIDE_DURATION;
    player.h=PLAYER_H_SLIDE; player.y=GROUND_Y-PLAYER_H_SLIDE;
    sndSlide();
}
function isOverhangAbove() {
    const px1=player.x-2, px2=player.x+player.w+2;
    const headY=GROUND_Y-PLAYER_H;
    for (const ob of obstacles) {
        if (ob.type!=='overhang') continue;
        if (ob.x<px2 && ob.x+ob.w>px1 && ob.y<headY+PLAYER_H && ob.y+ob.h+10>headY) return true;
    }
    return false;
}
function playerStopSlide() {
    if (!player.sliding) return;
    if (isOverhangAbove()) { player.slideTimer=5; return; }
    player.sliding=false; player.h=PLAYER_H; player.y=GROUND_Y-PLAYER_H; player.slideTimer=0;
}

// ──────────────────────────────────────────────
//  COLLISIONS
// ──────────────────────────────────────────────
function playerBox() {
    return { x:player.x+HIT_PAD, y:player.y+HIT_PAD, w:player.w-HIT_PAD*2, h:player.h-HIT_PAD*2 };
}
function boxOverlap(a,b) { return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function checkCollisions() {
    if (boostTimer>0) return false;
    const pb = playerBox();
    for (const ob of obstacles) {
        let obBox;
        if (ob.type==='crevasse') {
            if (player.grounded && pb.x+pb.w>ob.x+6 && pb.x<ob.x+ob.w-6) return true;
            continue;
        } else if (ob.type==='worm') {
            obBox = { x:ob.x+ob.w/2-10, y:ob.y, w:20, h:ob.h };
        } else if (ob.type==='drone') {
            obBox = { x:ob.x+4, y:ob.y+2, w:ob.w-8, h:ob.h-4 };
        } else if (ob.type==='overhang') {
            obBox = { x:ob.x+4, y:ob.y-2, w:ob.w-8, h:ob.h+2 };
        } else {
            obBox = { x:ob.x+3, y:ob.y+3, w:ob.w-6, h:ob.h-3 };
        }
        if (boxOverlap(pb, obBox)) {
            if (player.shield) {
                player.shield=false; player.shieldTimer=0; ob.passed=true;
                addFloatingText('BOUCLIER !', player.x, player.y-10, '#4488CC');
                shakeTimer=5; shakeIntensity=3;
                continue;
            }
            return true;
        }
        if (!ob.passed && !ob.closeCalled) {
            const m=14;
            const cb = { x:obBox.x-m, y:obBox.y-m, w:obBox.w+m*2, h:obBox.h+m*2 };
            if (boxOverlap(pb, cb) && !boxOverlap(pb, obBox)) ob.closeCalled=true;
        }
    }
    for (const m of missiles) {
        if (m.warning>0) continue;
        const mb = { x:m.x, y:m.y, w:m.w, h:m.h };
        if (boxOverlap(pb, mb)) {
            if (player.shield) {
                player.shield=false; player.shieldTimer=0;
                addFloatingText('BOUCLIER !', player.x, player.y-10, '#4488CC');
                shakeTimer=5; shakeIntensity=3; m.x=-200;
                continue;
            }
            return true;
        }
    }
    return false;
}

// ──────────────────────────────────────────────
//  MISE À JOUR DU TERRAIN (appelée dans tick)
// ──────────────────────────────────────────────
function updateLayer(points, speedFactor, layerWidth) {
    const vel = (gameState === 'playing' ? gameSpeed : BASE_SPEED) * speedFactor;
    for (let p of points) p.x -= vel;
    while (points.length > 0 && points[0].x < -150) {
        const first = points.shift();
        const last = points[points.length - 1];
        const newX = last.x + layerWidth / (points.length + 1);
        first.x = newX;
        first.baseY = GROUND_Y - 5 - Math.random() * 20;
        points.push(first);
    }
}

function updateTerrain() {
    const mountainSpacing = (W + 200) / mountains.length;
    updateLayer(mountains, 0.15, mountains.length * mountainSpacing);
    if (duneFarPts.length > 0) updateLayer(duneFarPts, 0.25, duneFarPts.length * ((W + 200) / (duneFarPts.length - 1)));
    if (duneMidPts.length > 0) updateLayer(duneMidPts, 0.5,  duneMidPts.length * ((W + 200) / (duneMidPts.length - 1)));
    if (duneNearPts.length > 0) updateLayer(duneNearPts, 0.8, duneNearPts.length * ((W + 200) / (duneNearPts.length - 1)));
}

// ──────────────────────────────────────────────
//  TICK (physique à 60 fps)
// ──────────────────────────────────────────────
function tick() {
    if (gameState === 'dead') { frameCount++; return; }
    if (gameState !== 'playing') return;
    frameCount++;

    const baseSpd = Math.min(MAX_SPEED, BASE_SPEED + frameCount * SPEED_ACCEL);
    gameSpeed = boostTimer > 0 ? Math.min(MAX_SPEED * 1.3, baseSpd + 3) : baseSpd;
    distance += gameSpeed;

    // Cycle jour/nuit
    const cycle = (distance % 14000) / 14000;
    if (cycle < 0.4) nightPhase = 0;
    else if (cycle < 0.5) nightPhase = (cycle - 0.4) / 0.1;
    else if (cycle < 0.9) nightPhase = 1;
    else nightPhase = 1 - (cycle - 0.9) / 0.1;

    const dm = distMeters(), nextMs = (milestone + 1) * 500;
    if (dm >= nextMs) { milestone++; sndMilestone(); addFloatingText(nextMs + ' m !', W/2, H/2-30, PAL_COMMON.gold); }

    // Physique joueur (gravité asymétrique : plus légère en montée, plus lourde en chute)
    if (!player.grounded) {
        player.vy += (player.vy < 0 ? GRAVITY_UP : GRAVITY_DOWN);
        player.y += player.vy;
        if (player.y >= GROUND_Y - player.h) {
            player.y = GROUND_Y - player.h; player.vy = 0;
            player.grounded = true; player.canDoubleJump = true;
            spawnDust(player.x + player.w/2, GROUND_Y, 3);
            if (jumpBufferTimer > 0) { jumpBufferTimer = 0; playerJump(); }
        }
    }
    if (jumpBufferTimer > 0) jumpBufferTimer--;
    if (player.sliding) {
        player.slideTimer--;
        if (player.slideTimer <= 0) playerStopSlide();
    }
    if (player.shield && player.shieldTimer > 0) { player.shieldTimer--; if (player.shieldTimer <= 0) player.shield = false; }
    if (magnetTimer > 0) magnetTimer--;
    if (boostTimer > 0) boostTimer--;
    if (comboTimer > 0) comboTimer--; else combo = 0;

    // Mise à jour du décor (avant le déplacement des obstacles)
    updateTerrain();

    // Spawn
    if (frameCount >= nextObstacle) { spawnObstacle(); spawnSpice(); spawnPowerup(); }

    // Déplacer obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        const ob = obstacles[i];
        const spd = ob.type === 'drone' ? gameSpeed * 1.15 : gameSpeed;
        ob.x -= spd;
        if (!ob.passed && ob.x + ob.w < player.x) {
            ob.passed = true;
            if (ob.closeCalled) {
                combo++; comboTimer = 120;
                const bonus = 5 * combo; spiceCount += bonus;
                addFloatingText('CLOSE CALL +' + bonus, player.x + 30, player.y - 20, '#FF8800');
                sndCloseCall();
            }
        }
        if (ob.x < -120) obstacles.splice(i, 1);
    }
    // Missiles
    for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i];
        if (m.warning > 0) { m.warning--; continue; }
        m.x -= m.speed;
        if (m.x < -100) missiles.splice(i, 1);
    }
    // Épice & aimant
    const pcx = player.x + player.w/2, pcy = player.y + player.h/2;
    const magnetRange = magnetTimer > 0 ? 150 : 0;
    for (let i = spiceItems.length - 1; i >= 0; i--) {
        const sp = spiceItems[i];
        sp.x -= gameSpeed;
        if (!sp.collected) {
            const dx = sp.x - pcx, dy = sp.y - pcy;
            const dist2 = dx*dx + dy*dy;
            if (magnetRange > 0 && dist2 < magnetRange * magnetRange) {
                sp.x -= dx * 0.08; sp.y -= dy * 0.08;
            }
            if (dist2 < 450) {
                sp.collected = true; spiceCount++; sndSpice();
                addFloatingText('+1', sp.x, sp.y - 10, PAL_COMMON.spice);
            }
        }
        if (sp.x < -20) spiceItems.splice(i, 1);
    }
    // Power-ups
    for (let i = powerups.length - 1; i >= 0; i--) {
        const pu = powerups[i];
        pu.x -= gameSpeed;
        if (!pu.collected) {
            const dx = pu.x - pcx, dy = pu.y - pcy;
            if (dx*dx + dy*dy < 500) {
                pu.collected = true; sndPowerup();
                if (pu.type === 'shield') { player.shield = true; player.shieldTimer = 600; addFloatingText('BOUCLIER !', pu.x, pu.y - 15, '#66AAFF'); }
                else if (pu.type === 'magnet') { magnetTimer = 300; addFloatingText('AIMANT !', pu.x, pu.y - 15, '#CC66FF'); }
                else if (pu.type === 'boost') { boostTimer = 180; sndBoost(); addFloatingText('BOOST !', pu.x, pu.y - 15, '#FFCC00'); }
            }
        }
        if (pu.x < -30) powerups.splice(i, 1);
    }

    if (checkCollisions()) {
        gameState = 'dead'; frameCount = 0; sndCrash();
        shakeTimer = 12; shakeIntensity = 8;
        finalScore = totalScore(); finalDist = distMeters(); finalSpice = spiceCount;
        if (finalScore > bestScore) { bestScore = finalScore; localStorage.setItem('spice_best', String(finalScore)); }
        submitScore(finalScore);
    } else {
        updateScoreDisplay();
    }
}

// ──────────────────────────────────────────────
//  DESSIN
// ──────────────────────────────────────────────
function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    grad.addColorStop(0, cc('skyTop'));
    grad.addColorStop(0.3, cc('skyHigh'));
    grad.addColorStop(0.6, cc('skyMid'));
    grad.addColorStop(0.85, cc('skyLow'));
    grad.addColorStop(1, cc('skyHorizon'));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, GROUND_Y);

    if (nightPhase > 0.3) {
        const alpha = (nightPhase - 0.3) * 1.4;
        ctx.fillStyle = `rgba(255,255,220,${alpha})`;
        for (const s of stars) {
            s.twinkle += s.speed;
            const twinkle = 0.4 + Math.abs(Math.sin(s.twinkle)) * 0.6;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r * twinkle, 0, Math.PI*2);
            ctx.fill();
        }
    }
    // Soleil
    const sunAlpha = 1 - nightPhase;
    if (sunAlpha > 0.1) {
        const sx = 650, sy = 60;
        const glow = ctx.createRadialGradient(sx, sy, 8, sx, sy, 80);
        glow.addColorStop(0, `rgba(255,240,200,${0.9*sunAlpha})`);
        glow.addColorStop(0.4, `rgba(255,200,100,${0.4*sunAlpha})`);
        glow.addColorStop(1, 'rgba(255,100,20,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(sx, sy, 80, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = PAL_COMMON.sun;
        ctx.beginPath(); ctx.arc(sx, sy, 16, 0, Math.PI*2); ctx.fill();
    }
    // Lune
    if (nightPhase > 0.5) {
        const ma = (nightPhase - 0.5) * 2;
        const lx = 180, ly = 50;
        ctx.fillStyle = `rgba(200,210,230,${ma*0.2})`;
        ctx.beginPath(); ctx.arc(lx, ly, 35, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = `rgba(220,225,240,${ma})`;
        ctx.beginPath(); ctx.arc(lx, ly, 18, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = cc('skyTop');
        ctx.beginPath(); ctx.arc(lx+8, ly-4, 16, 0, Math.PI*2); ctx.fill();
    }
    // Brume de chaleur
    ctx.strokeStyle = `rgba(255,220,160,${0.06*(1-nightPhase)})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
        const yy = GROUND_Y - 60 + i * 12;
        ctx.beginPath();
        for (let x = 0; x < W; x += 6) {
            const dy = Math.sin((x + frameCount*0.8 + i*100) * 0.02) * 2;
            if (x === 0) ctx.moveTo(x, yy + dy); else ctx.lineTo(x, yy + dy);
        }
        ctx.stroke();
    }
}

function drawMountains() {
    ctx.fillStyle = cc('mountain');
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y - 20);
    for (const m of mountains) {
        ctx.lineTo(m.x + m.w * 0.3, GROUND_Y - 20 - m.h);
        ctx.lineTo(m.x + m.w * 0.5, GROUND_Y - 20 - m.h * 0.85);
        ctx.lineTo(m.x + m.w * 0.7, GROUND_Y - 20 - m.h * 0.95);
        ctx.lineTo(m.x + m.w, GROUND_Y - 20);
    }
    ctx.lineTo(W + 60, GROUND_Y - 20);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = cc('mountainLight');
    ctx.beginPath();
    for (const m of mountains) {
        ctx.moveTo(m.x, GROUND_Y - 20);
        ctx.lineTo(m.x + m.w * 0.3, GROUND_Y - 20 - m.h);
        ctx.lineTo(m.x + m.w * 0.5, GROUND_Y - 20 - m.h * 0.85);
        ctx.lineTo(m.x + m.w * 0.4, GROUND_Y - 20);
    }
    ctx.closePath();
    ctx.fill();
}

function drawDuneLayer(points) {
    if (points.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y - 5);
    for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i];
        const p1 = points[i + 1];
        const cx = (p0.x + p1.x) / 2;
        const cy = (p0.baseY + p1.baseY) / 2 - 3;
        ctx.quadraticCurveTo(p0.x, p0.baseY, cx, cy);
        ctx.quadraticCurveTo(p1.x, p1.baseY, p1.x, p1.baseY);
    }
    ctx.lineTo(W + 60, GROUND_Y - 5);
    ctx.closePath();
    ctx.fill();
}

function drawGround() {
    ctx.fillStyle = cc('ground');
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    ctx.fillStyle = cc('groundDark');
    ctx.fillRect(0, GROUND_Y, W, 3);
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    for (let i = 0; i < 30; i++) {
        const gx = ((i * 37 + frameCount * gameSpeed * 0.5) % (W + 20)) - 10;
        ctx.fillRect(gx, GROUND_Y + 8 + (i * 7) % 25, 2, 1);
    }
}

function drawObstacle(ob) {
    if (ob.type === 'rock') {
        const grad = ctx.createLinearGradient(ob.x, ob.y, ob.x+ob.w, ob.y+ob.h);
        grad.addColorStop(0, PAL_COMMON.rockLight);
        grad.addColorStop(0.5, PAL_COMMON.rock);
        grad.addColorStop(1, PAL_COMMON.rockShadow);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(ob.x, ob.y+ob.h);
        ctx.lineTo(ob.x+ob.w*0.1, ob.y+ob.h*0.2);
        ctx.lineTo(ob.x+ob.w*0.4, ob.y);
        ctx.lineTo(ob.x+ob.w*0.7, ob.y+ob.h*0.15);
        ctx.lineTo(ob.x+ob.w, ob.y+ob.h*0.35);
        ctx.lineTo(ob.x+ob.w-2, ob.y+ob.h);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,220,160,0.1)';
        ctx.beginPath();
        ctx.moveTo(ob.x+ob.w*0.1, ob.y+ob.h*0.2);
        ctx.lineTo(ob.x+ob.w*0.4, ob.y);
        ctx.lineTo(ob.x+ob.w*0.45, ob.y+ob.h*0.5);
        ctx.lineTo(ob.x, ob.y+ob.h);
        ctx.closePath(); ctx.fill();
    } else if (ob.type === 'overhang') {
        ctx.fillStyle = PAL_COMMON.rock;
        ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
        for (let i = 0; i < 4; i++) {
            const sx = ob.x + 8 + i * (ob.w - 16) / 3;
            ctx.beginPath();
            ctx.moveTo(sx-4, ob.y+ob.h); ctx.lineTo(sx, ob.y+ob.h+6); ctx.lineTo(sx+4, ob.y+ob.h);
            ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = PAL_COMMON.rockLight; ctx.fillRect(ob.x, ob.y, ob.w, 4);
        ctx.fillStyle = PAL_COMMON.rockShadow;
        ctx.fillRect(ob.x-4, ob.y, 6, GROUND_Y-ob.y);
        ctx.fillRect(ob.x+ob.w-2, ob.y, 6, GROUND_Y-ob.y);
    } else if (ob.type === 'crevasse') {
        ctx.fillStyle = '#1a0f05'; ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
        ctx.fillStyle = cc('groundDark');
        ctx.beginPath();
        ctx.moveTo(ob.x, ob.y); ctx.lineTo(ob.x+4, ob.y+8); ctx.lineTo(ob.x-2, ob.y+15);
        ctx.lineTo(ob.x+3, ob.y+ob.h); ctx.lineTo(ob.x-5, ob.y+ob.h); ctx.lineTo(ob.x-5, ob.y);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(ob.x+ob.w, ob.y); ctx.lineTo(ob.x+ob.w-3, ob.y+10); ctx.lineTo(ob.x+ob.w+2, ob.y+20);
        ctx.lineTo(ob.x+ob.w-1, ob.y+ob.h); ctx.lineTo(ob.x+ob.w+5, ob.y+ob.h); ctx.lineTo(ob.x+ob.w+5, ob.y);
        ctx.closePath(); ctx.fill();
    } else if (ob.type === 'worm') {
        ob.phase += 0.06;
        const segs = 7;
        for (let i = segs-1; i >= 0; i--) {
            const sx = ob.x + ob.w/2 + Math.sin(ob.phase + i*0.7)*9;
            const sy = ob.y + ob.h - i*(ob.h/segs);
            const r = 7 - i*0.5;
            const grd = ctx.createRadialGradient(sx-2, sy-2, r*0.2, sx, sy, r);
            grd.addColorStop(0, '#a07040');
            grd.addColorStop(1, '#4a2a10');
            ctx.fillStyle = grd;
            ctx.beginPath(); ctx.arc(sx, sy, Math.max(2, r), 0, Math.PI*2); ctx.fill();
        }
        const mx = ob.x + ob.w/2 + Math.sin(ob.phase + (segs-1)*0.7)*9, my = ob.y;
        ctx.fillStyle = '#c44';
        ctx.beginPath(); ctx.arc(mx, my, 5, 0, Math.PI*2); ctx.fill();
    } else if (ob.type === 'drone') {
        ob.phase += 0.15;
        const cx = ob.x + ob.w/2, cy = ob.y + ob.h/2;
        ctx.fillStyle = '#2a1818';
        ctx.beginPath(); ctx.ellipse(cx, cy, ob.w/2, ob.h/2, 0, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#4a2828'; ctx.lineWidth = 2;
        const rot = Math.sin(ob.phase)*0.3;
        ctx.save(); ctx.translate(cx, ob.y-2);
        ctx.rotate(rot);
        ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.stroke();
        ctx.restore();
        ctx.save(); ctx.translate(cx, ob.y-6);
        ctx.rotate(-rot);
        ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke();
        ctx.restore();
        ctx.fillStyle = '#ff0000';
        ctx.beginPath(); ctx.arc(cx+5, cy-2, 3, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ff6666';
        ctx.beginPath(); ctx.arc(cx+5, cy-2, 1.5, 0, Math.PI*2); ctx.fill();
    }
}

function drawMissile(m) {
    if (m.warning > 0) {
        if (Math.floor(m.warning/5) % 2) {
            ctx.strokeStyle = 'rgba(255,0,0,0.5)'; ctx.lineWidth = 2;
            ctx.setLineDash([8, 6]);
            ctx.beginPath(); ctx.moveTo(0, m.y + m.h/2); ctx.lineTo(W, m.y + m.h/2); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#ff0000'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'right';
            ctx.fillText('⚠', W - 10, m.y + m.h/2 + 6);
        }
        return;
    }
    ctx.fillStyle = '#8b0000';
    ctx.beginPath();
    ctx.moveTo(m.x + m.w, m.y + m.h/2);
    ctx.lineTo(m.x + m.w*0.7, m.y);
    ctx.lineTo(m.x, m.y + 2);
    ctx.lineTo(m.x, m.y + m.h - 2);
    ctx.lineTo(m.x + m.w*0.7, m.y + m.h);
    ctx.closePath(); ctx.fill();
    const fLen = 8 + Math.random()*8;
    ctx.fillStyle = 'rgba(255,150,0,0.8)';
    ctx.beginPath();
    ctx.moveTo(m.x, m.y + 2); ctx.lineTo(m.x - fLen, m.y + m.h/2); ctx.lineTo(m.x, m.y + m.h - 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,100,0.6)';
    ctx.beginPath();
    ctx.moveTo(m.x, m.y + 3); ctx.lineTo(m.x - fLen*0.6, m.y + m.h/2); ctx.lineTo(m.x, m.y + m.h - 3);
    ctx.closePath(); ctx.fill();
}

function drawSpiceItem(sp) {
    if (sp.collected) return;
    sp.sparkle += 0.08;
    const glow = 0.45 + Math.sin(sp.sparkle) * 0.35;
    ctx.save();
    ctx.shadowBlur = 14; ctx.shadowColor = PAL_COMMON.spice;
    const halo = ctx.createRadialGradient(sp.x, sp.y, 2, sp.x, sp.y, 12);
    halo.addColorStop(0, `rgba(255,230,150,${glow*0.7})`);
    halo.addColorStop(1, 'rgba(255,200,50,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fffef5';
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y - 7); ctx.lineTo(sp.x + 5, sp.y);
    ctx.lineTo(sp.x, sp.y + 7); ctx.lineTo(sp.x - 5, sp.y);
    ctx.closePath(); ctx.fill();
    ctx.restore();
}

function drawPowerup(pu) {
    if (pu.collected) return;
    pu.phase += 0.06;
    const py = pu.y + Math.sin(pu.phase)*4;
    const icons = { shield: '🛡️', magnet: '🧲', boost: '⚡' };
    ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText(icons[pu.type], pu.x, py);
    ctx.textBaseline = 'alphabetic';
}

function drawPlayer() {
    const p = player, bx = p.x, by = p.y;
    if (boostTimer > 0) {
        ctx.fillStyle = `rgba(255,200,50,${0.15 + Math.sin(frameCount*0.3)*0.1})`;
        ctx.beginPath(); ctx.arc(bx + p.w/2, by + p.h/2, p.h/2 + 10, 0, Math.PI*2); ctx.fill();
    }
    if (p.shield) {
        ctx.strokeStyle = `rgba(100,180,255,${0.35 + Math.sin(frameCount*0.2)*0.15})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(bx + p.w/2, by + p.h/2, p.h/2 + 6, 0, Math.PI*2); ctx.stroke();
    }
    if (magnetTimer > 0) {
        ctx.strokeStyle = `rgba(200,100,255,${0.3 + Math.sin(frameCount*0.15)*0.15})`;
        ctx.lineWidth = 1;
        const mr = 30 + Math.sin(frameCount*0.1)*5;
        ctx.beginPath(); ctx.arc(bx + p.w/2, by + p.h/2, mr, 0, Math.PI*2); ctx.stroke();
    }

    if (p.sliding) {
        ctx.fillStyle = PAL_COMMON.playerBody;
        ctx.fillRect(bx - 4, by + 4, p.w + 8, p.h - 4);
        ctx.beginPath(); ctx.arc(bx + p.w + 2, by + 6, 7, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = PAL_COMMON.playerCape;
        ctx.beginPath();
        ctx.moveTo(bx - 4, by + 4); ctx.lineTo(bx - 14, by + 2); ctx.lineTo(bx - 8, by + p.h); ctx.lineTo(bx - 4, by + p.h);
        ctx.closePath(); ctx.fill();
    } else {
        p.runTimer++;
        if (p.runTimer > 5) { p.runTimer = 0; p.runFrame = (p.runFrame + 1) % 4; }
        const legOff = p.grounded ? [[-3,0,3,0],[0,-3,-3,3],[3,0,-3,0],[0,3,0,-3]][p.runFrame] : [2,-2,-2,2];
        ctx.strokeStyle = PAL_COMMON.playerBody; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(bx + 8, by + 32); ctx.lineTo(bx + 6 + legOff[0], by + p.h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx + 18, by + 32); ctx.lineTo(bx + 20 + legOff[2], by + p.h); ctx.stroke();
        ctx.fillStyle = PAL_COMMON.playerBody;
        ctx.fillRect(bx + 4, by + 14, 18, 20);
        ctx.fillStyle = PAL_COMMON.playerCape;
        ctx.beginPath();
        ctx.moveTo(bx + 4, by + 16); ctx.lineTo(bx - 6, by + 20 + Math.sin(frameCount*0.15)*3);
        ctx.lineTo(bx - 2, by + 34); ctx.lineTo(bx + 4, by + 34);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = PAL_COMMON.playerBody;
        ctx.beginPath(); ctx.arc(bx + 14, by + 10, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = PAL_COMMON.eyes;
        ctx.beginPath(); ctx.arc(bx + 18, by + 8, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#66aaee';
        ctx.beginPath(); ctx.arc(bx + 18, by + 8, 1.2, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = PAL_COMMON.playerBody; ctx.lineWidth = 3;
        const arm = p.grounded ? Math.sin(frameCount*0.25)*6 : -5;
        ctx.beginPath(); ctx.moveTo(bx + 10, by + 18); ctx.lineTo(bx + 4 + arm, by + 28); ctx.stroke();
    }
}

function drawDustTrail() {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (let i = dustTrail.length - 1; i >= 0; i--) {
        const d = dustTrail[i];
        d.x += d.vx - gameSpeed*0.3; d.y += d.vy; d.vy += 0.05; d.life--;
        if (d.life <= 0) { dustTrail.splice(i, 1); continue; }
        const alpha = (d.life / d.maxLife) * 0.6;
        ctx.fillStyle = `hsla(${d.hue},60%,65%,${alpha})`;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.size * alpha, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
    if (gameState === 'playing' && player.grounded && frameCount % 3 === 0) {
        dustTrail.push({
            x: player.x + 5, y: GROUND_Y - 1, vx: -Math.random()*1.5, vy: -Math.random(),
            life: 14 + Math.random()*10, maxLife: 24, size: 1.5 + Math.random()*2, hue: 35 + Math.random()*15,
        });
    }
}

function drawFloatingTexts() {
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy; ft.life--; ft.alpha = Math.min(1, ft.life / 15);
        if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
        ctx.save(); ctx.globalAlpha = ft.alpha;
        ctx.font = 'bold 15px "Segoe UI", sans-serif'; ctx.textAlign = 'center';
        ctx.fillStyle = ft.color;
        ctx.shadowBlur = 6; ctx.shadowColor = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
    }
}

function drawHUD() {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(6, 6, 95, 50);
    ctx.strokeStyle = 'rgba(255,200,100,0.2)'; ctx.lineWidth = 1; ctx.strokeRect(6, 6, 95, 50);
    ctx.font = '12px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255,220,180,0.85)'; ctx.fillText('📏 ' + distMeters() + ' m', 14, 26);
    ctx.fillStyle = PAL_COMMON.spice; ctx.fillText('✦ ' + spiceCount, 14, 44);
    if (combo > 1) { ctx.fillStyle = PAL_COMMON.gold; ctx.fillText('x' + combo + ' COMBO', 14, 60); }
    const sp = Math.min(1, (gameSpeed - BASE_SPEED) / (MAX_SPEED - BASE_SPEED));
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(W - 90, 10, 70, 7);
    const speedColor = sp < 0.4 ? PAL_COMMON.gold : sp < 0.7 ? '#e8a030' : PAL_COMMON.red;
    ctx.fillStyle = speedColor; ctx.fillRect(W - 90, 10, 70 * sp, 7);
    ctx.strokeStyle = 'rgba(255,200,100,0.25)'; ctx.strokeRect(W - 90, 10, 70, 7);
    ctx.font = '9px sans-serif'; ctx.fillStyle = 'rgba(255,220,180,0.5)'; ctx.textAlign = 'right';
    ctx.fillText('VITESSE', W - 16, 8);
    ctx.restore();
}

function drawMenu() {
    ctx.fillStyle = 'rgba(8,3,1,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.textAlign = 'center';
    ctx.font = 'bold 30px "Segoe UI", sans-serif'; ctx.fillStyle = PAL_COMMON.gold;
    ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(205,164,52,0.4)';
    ctx.fillText('SPICE RUNNER', W / 2, H / 2 - 55);
    ctx.shadowBlur = 0;
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#a89060';
    ctx.fillText('Traverse le désert d\'Arrakis, collecte l\'épice', W / 2, H / 2 - 25);
    ctx.fillText('et esquive les dangers du désert profond', W / 2, H / 2 - 8);
    ctx.font = 'bold 16px "Segoe UI", sans-serif'; ctx.fillStyle = PAL_COMMON.white;
    ctx.fillText('🖱️ Clique ou [ESPACE] pour commencer', W / 2, H / 2 + 25);
    if (bestScore > 0) {
        ctx.font = '13px sans-serif'; ctx.fillStyle = '#7c5e2a';
        ctx.fillText('🏆 Meilleur : ' + bestScore, W / 2, H / 2 + 52);
    }
    ctx.restore();
}

function drawDead() {
    ctx.fillStyle = 'rgba(8,3,1,0.65)'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.textAlign = 'center';
    ctx.font = 'bold 28px "Segoe UI", sans-serif'; ctx.fillStyle = PAL_COMMON.red;
    ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(200,40,40,0.5)';
    ctx.fillText('PERDU !', W / 2, H / 2 - 60);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 42px "Segoe UI", sans-serif'; ctx.fillStyle = PAL_COMMON.gold;
    ctx.fillText(finalScore, W / 2, H / 2 - 14);
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#a89060';
    ctx.fillText(finalDist + ' m  ·  ' + finalSpice + ' épice', W / 2, H / 2 + 12);
    if (bestScore > 0) ctx.fillText('🏆 Record : ' + bestScore, W / 2, H / 2 + 34);
    ctx.font = 'bold 15px "Segoe UI", sans-serif'; ctx.fillStyle = PAL_COMMON.white;
    ctx.fillText('🖱️ Clique pour rejouer', W / 2, H / 2 + 60);
    ctx.restore();
}

// ──────────────────────────────────────────────
//  BOUCLE PRINCIPALE
// ──────────────────────────────────────────────
function draw() {
    ctx.save();
    if (shakeTimer > 0) { shakeTimer--; ctx.translate((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity); }
    drawSky();
    drawMountains();
    ctx.fillStyle = cc('duneFar');   drawDuneLayer(duneFarPts);
    ctx.fillStyle = cc('duneMid');   drawDuneLayer(duneMidPts);
    ctx.fillStyle = cc('duneNear');  drawDuneLayer(duneNearPts);
    drawGround();
    for (const ob of obstacles) drawObstacle(ob);
    for (const m of missiles) drawMissile(m);
    for (const sp of spiceItems) drawSpiceItem(sp);
    for (const pu of powerups) drawPowerup(pu);
    drawDustTrail();
    if (gameState === 'playing' || gameState === 'dead') drawPlayer();
    drawFloatingTexts();
    if (gameState === 'playing') drawHUD();
    if (gameState === 'menu') drawMenu();
    if (gameState === 'dead') drawDead();
    // Vignette
    const vignette = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.7);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(6,3,1,0.35)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
}

function loop(now) {
    requestAnimationFrame(loop);
    if (!lastTime) { lastTime = now; return; }
    const dt = Math.min(now - lastTime, 100);
    lastTime = now;
    accumulator += dt;
    while (accumulator >= FRAME_DUR) { tick(); accumulator -= FRAME_DUR; }
    draw();
}

// ──────────────────────────────────────────────
//  INPUT
// ──────────────────────────────────────────────
let slideHeld = false;
function handleAction(action) {
    if (gameState === 'menu') { gameState = 'playing'; reset(); playerJump(); if (!scoreSecret) fetchSecret(); return; }
    if (gameState === 'dead') { if (frameCount > 40) { gameState = 'menu'; reset(); } return; }
    if (action === 'jump') playerJump();
    if (action === 'slide') playerSlide();
}
canvas.addEventListener('pointerdown', e => { e.preventDefault(); handleAction('jump'); });
document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); handleAction('jump'); }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); if (!slideHeld) { slideHeld = true; handleAction('slide'); } }
});
document.addEventListener('keyup', e => {
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { slideHeld = false; playerStopSlide(); }
});

// ──────────────────────────────────────────────
//  API SCORES
// ──────────────────────────────────────────────
async function submitScore(s) {
    if (!scoreSecret) await fetchSecret();
    if (!scoreSecret) return;
    const dur = Math.floor((Date.now() - startTime) / 1000);
    const hash = await sha256(GAME_ID + s + dur + scoreSecret);
    try {
        const r = await fetch('scores_api.php', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'submit', game: GAME_ID, score: s, duration: dur, hash })
        });
        const j = await r.json();
        if (!j.ok) console.warn('[spice_runner] score non enregistré côté serveur :', j.error || 'raison inconnue');
        if (j.ok && j.new_personal) { bestScore = s; localStorage.setItem('spice_best', String(s)); }
        loadLeaderboard();
    } catch (e) {}
}
async function sha256(msg) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function fetchSecret() {
    try {
        const r = await fetch('scores_api.php', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'token', game: GAME_ID })
        });
        const j = await r.json();
        if (j.ok) scoreSecret = j.secret;
    } catch (e) {}
}
async function loadLeaderboard() {
    try {
        const r = await fetch('scores_api.php?action=leaderboard&game=' + GAME_ID + '&limit=10', { credentials: 'same-origin' });
        const j = await r.json();
        if (!j.ok) return;
        const me = localStorage.getItem('user') || '';
        const ul = document.getElementById('lb-list');
        if (!j.leaderboard.length) { ul.innerHTML = '<li style="color:var(--muted)">Aucun score</li>'; return; }
        ul.innerHTML = j.leaderboard.map((e, i) => {
            const medals = ['🥇', '🥈', '🥉'];
            const rank = medals[i] || (i + 1);
            const isMe = e.player === me;
            return `<li class="${isMe ? 'me' : ''}"><span class="rank">${rank}</span><span class="name">${esc(e.player)}</span><span class="pts">${e.score}</span></li>`;
        }).join('');
    } catch (e) {}
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }

// ──────────────────────────────────────────────
//  INITIALISATION
// ──────────────────────────────────────────────
bestScore = parseInt(localStorage.getItem('spice_best') || '0', 10);
gameState = 'menu';
reset();
loadLeaderboard();
fetchSecret();
initStars();
requestAnimationFrame(loop);
})();
</script>
