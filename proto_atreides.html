<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proto Snapping Atréides — sockets du jeu</title>
  <!-- Three.js via importmap ES modules (même version que base_planner) -->
  <script type="importmap">
  {
    "imports": {
      "three":         "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root { --gold:#cda434; --bg:#0d0805; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:#e8ddc8;
                font-family:system-ui,Segoe UI,sans-serif; overflow:hidden; }
    #app { display:flex; height:100vh; }
    #sidebar { width:240px; flex:0 0 240px; background:#160f08; border-right:1px solid #3a2a12;
               display:flex; flex-direction:column; }
    #sidebar h1 { font-size:13px; letter-spacing:.5px; color:var(--gold); margin:0; padding:12px 14px;
                  border-bottom:1px solid #3a2a12; text-transform:uppercase; }
    #cats { display:flex; flex-wrap:wrap; gap:4px; padding:8px 10px; border-bottom:1px solid #2a1d0e; }
    .cat { font-size:11px; padding:3px 8px; border-radius:10px; background:#241809; color:#c7b48a;
           cursor:pointer; border:1px solid transparent; }
    .cat.active { background:var(--gold); color:#1a1206; font-weight:600; }
    #list { flex:1; overflow-y:auto; padding:6px; }
    .piece { display:flex; align-items:center; gap:8px; padding:7px 9px; margin:2px 0; border-radius:6px;
             cursor:pointer; font-size:12px; border:1px solid transparent; }
    .piece:hover { background:#241809; }
    .piece.active { background:#2d6b2d33; border-color:#2d6b2d; }
    .piece .sw { width:12px; height:12px; border-radius:3px; flex:0 0 12px; background:#2d6b2d; }
    .piece .nm { flex:1; line-height:1.15; }
    .piece .sk { font-size:10px; color:#8a7a55; }
    #stage { flex:1; position:relative; }
    canvas { display:block; }
    #hud { position:absolute; top:10px; left:10px; font-size:12px; background:#160f08cc;
           border:1px solid #3a2a12; border-radius:8px; padding:10px 12px; max-width:360px; line-height:1.5; }
    #hud b { color:var(--gold); }
    kbd { background:#2a1d0e; border:1px solid #4b3010; border-radius:4px; padding:1px 5px; font-size:11px; }
    #status { position:absolute; bottom:10px; left:10px; font-size:12px; background:#160f08cc;
              border:1px solid #3a2a12; border-radius:8px; padding:8px 12px; }
    #status .ok { color:#6fcf76; } #status .grid { color:var(--gold); } #status .no { color:#cc6b6b; }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>Atréides — sockets jeu</h1>
      <div id="cats"></div>
      <div id="list"></div>
    </aside>
    <div id="stage">
      <div id="hud">
        <div><b>Proto snapping par sockets</b></div>
        <div>1. Clique une pièce à gauche · 2. déplace la souris · 3. clic gauche pour poser.</div>
        <div><kbd>R</kbd> rotation · <kbd>Échap</kbd>/clic droit annuler · <kbd>Suppr</kbd> tout effacer</div>
        <div>Molette = zoom · clic droit glissé = orbite</div>
      </div>
      <div id="status">Choisis une pièce…</div>
    </div>
  </div>
  <script type="module" src="proto_atreides.js"></script>
</body>
</html>
