<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script>
    /* Déjà connecté → on saute l'écran de login et on file droit au menu.
       (Le garde du menu revalide la session côté serveur — appartenance à la
       guilde — et renvoie ici en nettoyant le localStorage si elle a expiré,
       donc aucune boucle possible.) */
    if (localStorage.getItem('user')) location.replace('menu.html');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison des Havres Gris – Accueil</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* === OVERLAY LOGIN === */
    #login-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    #login-overlay.visible {
      display: block;
    }
    #login-overlay #loginBox {
      animation: floatIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>

<body>
  <div id="intro-screen">
    <img src="guilde.png" alt="La Maison des Havres Gris">
    <div id="intro-content">
      <img src="enter_arrakis.png" id="enterButton" onclick="showLogin()" alt="Entrer sur Arrakis">
    </div>
  </div>

  <!-- Modale login flottante -->
  <div id="login-overlay">
    <div id="loginBox">
      <img src="images/logoguilde.png" alt="Les Havres Gris" style="width:150px;display:block;margin:0 auto 12px;filter:drop-shadow(0 0 16px rgba(205,164,52,0.5));">
      <h2>Connexion</h2>
      <p style="color:#9a8050;font-size:0.88em;text-align:center;margin:0 0 18px;line-height:1.5;">
        L'accès au portail est réservé aux membres de la guilde.<br>Connecte-toi avec ton compte Discord.
      </p>
      <a id="discordLoginBtn" href="discord_login.php"
         style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;
                padding:14px;background:#5865F2;border:none;border-radius:6px;color:#fff;font-size:0.98em;
                font-weight:bold;letter-spacing:0.5px;text-decoration:none;transition:background .2s;"
         onmouseover="this.style.background='#4752c4'" onmouseout="this.style.background='#5865F2'">
        <svg width="22" height="22" viewBox="0 0 127.14 96.36" fill="#fff" aria-hidden="true"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
        Se connecter avec Discord
      </a>
      <div id="loginError" class="login-error"></div>
      <!-- Accès par mot de passe retiré de l'accueil ; conservé sur la page discrète sietch-tabr.html -->
    </div>
  </div>

<script>
  function showLogin() {
    document.getElementById("login-overlay").classList.add("visible");
  }

  async function login() {
    const userField = document.getElementById("username");
    const passField = document.getElementById("password");
    const errorBox  = document.getElementById("loginError");
    const btn       = document.getElementById("loginBtn");

    const userVal = userField.value.trim();
    const passVal = passField.value.trim();

    errorBox.textContent = "";

    if (!userVal || !passVal) {
      errorBox.textContent = "Veuillez remplir tous les champs.";
      shakeBox();
      return;
    }

    btn.disabled = true;
    btn.textContent = "Vérification...";

    try {
      const response = await fetch('auth.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: userVal, password: passVal })
      });

      if (response.status === 404) {
        throw new Error("Le service d'authentification (auth.php) est introuvable.");
      }

      const result = await response.json();

      if (result.ok) {
        localStorage.setItem("user", result.user);
        localStorage.setItem("role", result.role);
        window.location.href = "menu.html";
      } else {
        errorBox.textContent = result.error || "Identifiants incorrects.";
        shakeBox();
        resetBtn();
      }
    } catch(e) {
      console.error(e);
      errorBox.textContent = "Erreur technique : " + e.message;
      resetBtn();
    }
  }

  function resetBtn() {
    const btn = document.getElementById("loginBtn");
    btn.disabled = false;
    btn.textContent = "Se connecter";
  }

  function shakeBox() {
    const box = document.getElementById('loginBox');
    box.style.animation = "none";
    box.offsetHeight;
    box.style.animation = "shake 0.4s ease-in-out";
    setTimeout(() => box.style.animation = "", 400);
  }

  function handleKeyPress(e) {
    if (e.key === "Enter") login();
  }

  // Fermer l'overlay en cliquant en dehors de la boîte
  document.getElementById("login-overlay").addEventListener("click", function(e) {
    if (e.target === this) this.classList.remove("visible");
  });

  // Ouvre la modale automatiquement si l'URL contient #login
  if (window.location.hash === '#login') {
    showLogin();
    history.replaceState(null, '', window.location.pathname);
  }
</script>
</body>
</html>
