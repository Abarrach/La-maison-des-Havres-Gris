<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Muad'Dib Rescue — Hub Jeux</title>
<link rel="stylesheet" href="../style.css">
<style>
:root {
    --bg: #080301;
    --gold: #e1ad45;
    --text: #f7e5c2;
    --muted: #9a7543;
    --panel: rgba(19, 9, 3, 0.9);
}
html, body {
    overflow: hidden; height: 100%; margin: 0;
    touch-action: none; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
}
body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
        radial-gradient(circle at 50% 30%, rgba(124,62,18,.18), transparent 38%),
        linear-gradient(145deg, #120704, var(--bg) 62%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
}
#game-wrapper {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
}
canvas {
    border: 1px solid #6f4821; border-radius: 12px;
    box-shadow: 0 18px 55px rgba(0,0,0,.72), 0 0 70px rgba(205,164,52,.1), inset 0 0 0 1px rgba(255,221,155,.07);
    cursor: pointer; display: block;
}
.game-header {
    display: flex; align-items: center; gap: 14px;
    width: 100%; max-width: 800px; padding: 10px 16px; box-sizing: border-box;
    background: linear-gradient(180deg, rgba(35,17,6,.96), rgba(12,6,2,.96));
    border: 1px solid #6f4821; border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.7);
}
.game-header .back-link {
    color: var(--gold); text-decoration: none; font-weight: bold; font-size: 0.82em;
    border: 1px solid #7c5e2a; border-radius: 4px; padding: 6px 14px;
    background: linear-gradient(180deg, #2a1a0b, #1a0f05);
    transition: all 0.2s; white-space: nowrap;
}
.game-header .back-link:hover { background: var(--gold); color: #000; border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
.game-header .game-title {
    font-size: 1.15em; font-weight: bold; color: var(--gold);
    text-transform: uppercase; letter-spacing: 1.6px; text-shadow: 0 0 14px rgba(225,173,69,.32);
}
.score-live { font-size: 1.25em; color: #ffcc00; font-weight: bold; margin-left: auto; }

#leaderboard {
    position: absolute; right: -240px; top: 0; width: 220px;
    background: linear-gradient(160deg, rgba(31,15,5,.96), rgba(8,4,2,.96)); border: 1px solid #60401f;
    border-radius: 10px; padding: 16px 14px; font-size: 0.78em;
    box-shadow: 0 14px 35px rgba(0,0,0,.45), inset 0 0 25px rgba(208,143,47,.035);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
#leaderboard h3 {
    margin: 0 0 12px; color: var(--gold); font-size: 0.95em;
    text-align: center; text-transform: uppercase; letter-spacing: 2px;
}
#lb-list { list-style: none; padding: 0; margin: 0; }
#lb-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; border-bottom: 1px solid rgba(61,43,22,0.4);
}
#lb-list li .rank { color: var(--muted); width: 26px; font-size: 0.9em; }
#lb-list li .name { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#lb-list li .pts { color: #ffcc00; font-weight: bold; min-width: 44px; text-align: right; }
#lb-list li.me .name { color: var(--gold); }
.controls-hint { font-size: 0.72em; color: var(--muted); text-align: center; opacity: 0.7; }

@media (max-width: 900px) {
    #leaderboard { position: static; width: 90vw; max-width: 500px; margin-top: 6px; }
}
@media (max-width: 820px) {
    canvas { width: 95vw !important; height: auto !important; }
}
</style>
</head>
<body>
<script src="../auth-guard.js"></script>
<div id="game-wrapper">
    <div class="game-header">
        <a href="hub.html" class="back-link">&larr; Hub Jeux</a>
        <span class="game-title">🐭 Muad'Dib Rescue</span>
        <span class="score-live" id="score-display">0</span>
    </div>
    <canvas id="game" width="800" height="400"></canvas>
    <div class="controls-hint">
        [Clic] Sauve le Muad'Dib avant qu'il ne disparaisse &nbsp;&bull;&nbsp; Évite les scorpions
    </div>
    <div id="leaderboard">
        <h3>🗓️ Cette semaine</h3>
        <ul id="lb-list"><li style="color:var(--muted)">Chargement…</li></ul>
    </div>
</div>

<script>
;(function () {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 400;
const GAME_ID = 'muaddib_rescue';

// ──────────────────────────────────────────────
//  CONSTANTES
// ──────────────────────────────────────────────
const TARGET_FPS = 60, FRAME_DUR = 1000 / TARGET_FPS;
const COLS = 4, ROWS = 3;
const MARGIN_X = 110, TOP_Y = 160, BOT_Y = 355;
const HOLE_R = 34;
const MAX_LIVES = 4;
const CLOSE_MARGIN = 10;

const C = {
    skyTop: '#24100c', skyMid: '#81401f', skyLow: '#d9973f',
    sand: '#c58a40', sandDark: '#75451f', sandLine: '#e0ad62',
    mound: '#a86d31', moundLight: '#d29a50', moundDark: '#593319', hole: '#130904',
    mouseBody: '#c89455', mouseLight: '#efd09a', mouseDark: '#765033', mouseEar: '#dba27f', mouseNose: '#3b2118',
    scorpion: '#24100b', scorpionLight: '#7f351d',
    gold: '#ffcc00', red: '#c44', white: '#f5deb3',
};

// Étoiles fixes : aucun scintillement aléatoire brutal d'une image à l'autre.
const STARS = Array.from({length: 38}, (_, i) => ({
    x: (i * 137 + 31) % W,
    y: 14 + ((i * 67) % 112),
    r: .35 + (i % 4) * .22,
    a: .18 + (i % 5) * .08,
}));

// Sprites externes avec repli automatique vers le dessin Canvas procédural.
// Le jeu reste donc jouable même si un asset est encore en cours de chargement.
const SPRITES = {
    mouse: new Image(),
    scorpion: new Image(),
};
SPRITES.mouse.decoding = 'async';
SPRITES.scorpion.decoding = 'async';
SPRITES.mouse.src = 'img/muaddib_rescue_mouse.png';
SPRITES.scorpion.src = 'img/muaddib_rescue_scorpion.png';
function spriteReady(image) { return image.complete && image.naturalWidth > 0; }

// ──────────────────────────────────────────────
//  AUDIO
// ──────────────────────────────────────────────
let audioCtx = null;
function audCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}
function tone(freq, dur, vol = 0.08, type = 'sine') {
    try {
        const a = audCtx(), t = a.currentTime;
        const o = a.createOscillator(), g = a.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        o.frequency.exponentialRampToValueAtTime(freq * 0.6, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(a.destination);
        o.start(t); o.stop(t + dur);
    } catch (e) {}
}
function sndPop()    { tone(500, 0.05, 0.05, 'triangle'); }
function sndSave()   { tone(880, 0.07, 0.09); setTimeout(() => tone(1180, 0.08, 0.08), 50); }
function sndCombo()  { [880, 1100, 1320, 1760].forEach((f, i) => setTimeout(() => tone(f, 0.09, 0.07), i * 55)); }
function sndMiss()   { tone(260, 0.18, 0.07, 'sawtooth'); }
function sndDecoy()  { tone(150, 0.2, 0.09, 'square'); setTimeout(() => tone(110, 0.2, 0.07, 'square'), 60); }
function sndPowerup(){ [660, 880, 1100, 1320].forEach((f, i) => setTimeout(() => tone(f, 0.08, 0.09), i * 50)); }
function sndGameOver() { [400, 350, 300, 200].forEach((f, i) => setTimeout(() => tone(f, 0.2, 0.06, 'sawtooth'), i * 150)); }
// Son du mode caché — jamais expliqué à l'écran (juste plus marqué qu'avant).
function sndKill() {
    try {
        const a = audCtx(), t = a.currentTime;
        const len = a.sampleRate * 0.22;
        const buf = a.createBuffer(1, len, a.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 1.4);
        const src = a.createBufferSource(), g = a.createGain();
        src.buffer = buf; g.gain.setValueAtTime(0.34, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.22);
        src.connect(g); g.connect(a.destination); src.start(t);
        tone(80, 0.22, 0.2, 'sine');
        tone(45, 0.3, 0.14, 'sawtooth');
    } catch(e){}
}

// ──────────────────────────────────────────────
//  ÉTAT
// ──────────────────────────────────────────────
let holes = [];
let particles = [], floatingTexts = [], hearts = [], skulls = [], bloodStains = [];
let score, savedCount, missedCount, combo, comboTimer, lives, gameState, frameCount;
let bestScore, startTime, scoreSecret;
let nextSpawn = 0;
let shakeTimer = 0, shakeIntensity = 0;
let goreFlash = 0;

// Mode caché : jamais mentionné dans l'UI, l'aide ou le menu. F10 pendant une
// partie inverse le sens du clic (sauver -> tuer). Toute partie où il a été
// activé au moins une fois est silencieusement exclue de la soumission de
// score, pour ne jamais pouvoir fausser le classement.
let hardcoreMode = false, hardcoreEverUsed = false;

function initHoles() {
    holes = [];
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const x = MARGIN_X + (W - MARGIN_X * 2) * (c / (COLS - 1));
            const y = TOP_Y + (BOT_Y - TOP_Y) * (r / (ROWS - 1));
            holes.push({ x, y, state: 'idle', type: null, timer: 0, popDur: 1, phase: Math.random()*Math.PI*2 });
        }
    }
}

function reset() {
    initHoles();
    particles = []; floatingTexts = []; hearts = []; skulls = []; bloodStains = [];
    score = 0; savedCount = 0; missedCount = 0; combo = 0; comboTimer = 0;
    lives = MAX_LIVES; frameCount = 0; nextSpawn = 40;
    shakeTimer = 0; goreFlash = 0;
    hardcoreMode = false; hardcoreEverUsed = false;
    startTime = Date.now();
    updateScoreDisplay();
}
function updateScoreDisplay() { document.getElementById('score-display').textContent = score; }

// ──────────────────────────────────────────────
//  DIFFICULTÉ (progressive avec le nombre de sauvetages)
// ──────────────────────────────────────────────
function popDurationTicks()  { return Math.max(42, 84 - savedCount * 0.9); }
function spawnIntervalTicks(){ return Math.max(20, 46 - savedCount * 0.55); }
function maxActiveHoles()    { return Math.min(4, 1 + Math.floor(savedCount / 14)); }
function decoyChance()       { return Math.min(0.25, Math.max(0, (savedCount - 10) * 0.01)); }
function powerupChance()     { return savedCount >= 10 ? 0.04 : 0; }

// ──────────────────────────────────────────────
//  PARTICULES / TEXTES
// ──────────────────────────────────────────────
function spawnSand(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x + (Math.random()-0.5)*14, y: y + (Math.random()-0.5)*8,
            vx: (Math.random()-0.5)*3, vy: -Math.random()*2.5,
            life: 20 + Math.random()*16, maxLife: 36,
            size: 1.5 + Math.random()*2.5, color: color || 'rgba(210,180,120,',
        });
    }
}
function addFloatingText(text, x, y, color) {
    floatingTexts.push({ text, x, y, vy: -1.4, life: 45, color, alpha: 1 });
}
function spawnHeart(x, y) {
    hearts.push({ x, y, vy: -0.45, drift: (Math.random()-0.5)*0.3, life: 110, maxLife: 110 });
}
function spawnSkull(x, y) {
    skulls.push({ x, y, vy: -0.55, drift: (Math.random()-0.5)*0.5, wobble: Math.random()*Math.PI*2, life: 100 });
}

function addBloodStain(x, y) {
    // Trace au sol brève (~4s) : un rappel visuel du coup, pas une mare qui
    // s'incruste sur toute la durée d'un run hardcore.
    const spots = Array.from({length: 4 + Math.floor(Math.random()*3)}, () => ({
        x: (Math.random()-.5)*38,
        y: (Math.random()-.5)*11,
        r: 1 + Math.random()*2.4,
    }));
    bloodStains.push({
        x: x + (Math.random()-.5)*6, y: y + 8,
        rx: 9 + Math.random()*6, ry: 2.6 + Math.random()*2,
        rotation: (Math.random()-.5)*.2, life: 260, spots,
    });
    if (bloodStains.length > 6) bloodStains.shift();
}

function spawnGore(x, y) {
    // Volontairement plus léger que l'essai précédent (moins de particules,
    // pas d'os) : un impact visible, pas une scène de carnage.
    for (let i=0; i<18; i++) {
        const life = 24 + Math.random()*18;
        const kind = i%6 === 0 ? 'chunk' : 'blood';
        particles.push({
            kind,
            x: x + (Math.random()-.5)*13, y: y - 10 + (Math.random()-.5)*10,
            vx: (Math.random()-.5)*5, vy: -1-Math.random()*3.6,
            gravity: .14 + Math.random()*.07,
            life, maxLife: life,
            size: kind === 'blood' ? 1.5+Math.random()*2.6 : 2+Math.random()*2.2,
            rotation: Math.random()*Math.PI*2,
            spin: (Math.random()-.5)*.32,
            color: kind === 'chunk' ? '#5a0b0b' : (Math.random()>.45 ? '#a70d12' : '#7a0509'),
        });
    }
}

// ──────────────────────────────────────────────
//  SPAWN
// ──────────────────────────────────────────────
function spawnSomething() {
    const idle = holes.filter(h => h.state === 'idle');
    const active = holes.length - idle.length;
    if (!idle.length || active >= maxActiveHoles()) return;
    const hole = idle[Math.floor(Math.random() * idle.length)];

    let type = 'mouse';
    const r = Math.random();
    if (powerupChance() > 0 && r < powerupChance()) type = 'powerup';
    else if (r < powerupChance() + decoyChance()) type = 'decoy';

    hole.state = 'up';
    hole.type = type;
    hole.popDur = popDurationTicks();
    hole.timer = hole.popDur;
    hole.closeCalled = false;
    sndPop();
}

// ──────────────────────────────────────────────
//  CLIC
// ──────────────────────────────────────────────
function handleSave(hole) {
    if (hardcoreMode) {
        sndKill();
        shakeTimer = 13; shakeIntensity = 8; goreFlash = 10;
        spawnGore(hole.x, hole.y - 4);
        addBloodStain(hole.x, hole.y);
        spawnSkull(hole.x + (Math.random()-0.5)*12, hole.y - 26);
        addFloatingText('CRAC', hole.x + (Math.random()-.5)*8, hole.y - 48, '#8c1010');
        hole.state = 'idle';
        return;
    }
    combo++; comboTimer = 90;
    const bonus = 10 * Math.min(combo, 5);
    // Bonus de réflexe : sauver tôt (proche de l'apparition) rapporte un peu
    // plus que sauver à la toute dernière seconde — même sauvetage, mais la
    // rapidité est récompensée.
    const speedFrac = hole.timer / Math.max(1, hole.popDur);
    const speedBonus = Math.round(8 * Math.max(0, speedFrac));
    score += bonus + speedBonus; savedCount++;
    addFloatingText('+' + (bonus + speedBonus), hole.x, hole.y - 30, C.gold);
    if (speedBonus >= 5) addFloatingText('⚡ réflexe !', hole.x, hole.y - 46, '#88ddff');
    spawnHeart(hole.x + (Math.random()-0.5)*10, hole.y - 20);
    if (combo >= 3) sndCombo(); else sndSave();
    spawnSand(hole.x, hole.y - 10, 8, 'rgba(255,230,150,');
    hole.state = 'idle';
    updateScoreDisplay();
}

function onCanvasClick(cx, cy) {
    if (gameState === 'menu') { gameState = 'playing'; reset(); if (!scoreSecret) fetchSecret(); return; }
    if (gameState === 'dead') { if (frameCount > 30) { gameState = 'menu'; } return; }

    for (const hole of holes) {
        if (hole.state !== 'up') continue;
        const dx = cx - hole.x, dy = cy - (hole.y - 8);
        const circularHit = dx*dx + dy*dy <= (HOLE_R+6) * (HOLE_R+6);
        // Les sprites dépassent volontairement du rayon historique du terrier :
        // toute leur silhouette visible doit rester cliquable, oreilles et queue comprises.
        const spriteImage = hole.type === 'mouse' ? SPRITES.mouse : (hole.type === 'decoy' ? SPRITES.scorpion : null);
        const spriteHit = spriteImage && spriteReady(spriteImage)
            && Math.abs(dx) <= (hole.type === 'mouse' ? 34 : 38)
            && cy >= hole.y - (hole.type === 'mouse' ? 68 : 72)
            && cy <= hole.y + 22;
        if (!circularHit && !spriteHit) continue;

        if (hole.type === 'mouse') {
            handleSave(hole);
        } else if (hole.type === 'decoy') {
            lives--; combo = 0; sndDecoy();
            addFloatingText('AÏE !', hole.x, hole.y - 30, C.red);
            spawnSand(hole.x, hole.y - 10, 10, 'rgba(180,80,40,');
            hole.state = 'idle';
            if (lives <= 0) return triggerGameOver();
        } else if (hole.type === 'powerup') {
            sndPowerup();
            addFloatingText('FILET !', hole.x, hole.y - 30, C.gold);
            hole.state = 'idle';
            for (const h of holes) {
                if (h.state === 'up' && h.type === 'mouse') handleSave(h);
            }
        }
        return;
    }
}

// ──────────────────────────────────────────────
//  GAME OVER
// ──────────────────────────────────────────────
function triggerGameOver() {
    gameState = 'dead'; frameCount = 0;
    sndGameOver();
    if (score > bestScore) { bestScore = score; localStorage.setItem('muaddib_best', String(score)); }
    // Une partie où le mode caché a été activé n'est jamais soumise au classement.
    if (score > 0 && !hardcoreEverUsed) submitScore(score);
}

// ──────────────────────────────────────────────
//  TICK
// ──────────────────────────────────────────────
function tick() {
    if (gameState === 'dead') { frameCount++; return; }
    if (gameState !== 'playing') return;
    frameCount++;

    if (comboTimer > 0) comboTimer--; else combo = 0;

    if (frameCount >= nextSpawn) {
        spawnSomething();
        nextSpawn = frameCount + spawnIntervalTicks() + Math.floor(Math.random()*10);
    }

    for (const hole of holes) {
        if (hole.state !== 'up') continue;
        hole.timer--;
        if (hole.timer <= 0) {
            if (hole.type === 'mouse') {
                missedCount++; lives--; combo = 0; sndMiss();
                addFloatingText('perdu…', hole.x, hole.y - 30, '#a89060');
                spawnSand(hole.x, hole.y - 6, 6, 'rgba(140,110,80,');
                hole.state = 'idle';
                if (lives <= 0) { triggerGameOver(); return; }
            } else {
                hole.state = 'idle';
            }
        }
    }
}

// ──────────────────────────────────────────────
//  AMBIANCE : dunes animées + rafales de sable occasionnelles
//  (tournent en continu, indépendamment de l'état de la partie)
// ──────────────────────────────────────────────
let ambientFrame = 0;
let duneFarPts = [], duneNearPts = [];
function initDunes() {
    duneFarPts = []; duneNearPts = [];
    const nf = 12, nn = 10;
    for (let i = 0; i <= nf; i++) duneFarPts.push({ x: i*(W+120)/nf - 60, y: 366 - Math.random()*30 });
    for (let i = 0; i <= nn; i++) duneNearPts.push({ x: i*(W+160)/nn - 80, y: 394 - Math.random()*24 });
}
function scrollDunes(pts, speed, wrapWidth) {
    for (const p of pts) p.x -= speed;
    if (pts[0].x < -100) {
        const first = pts.shift();
        const last = pts[pts.length-1];
        first.x = last.x + wrapWidth/pts.length;
        pts.push(first);
    }
}
function drawDuneLayer(pts, color, ridgeColor) {
    if (pts.length < 2) return;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-60, H);
    for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i], p1 = pts[i+1];
        const cx = (p0.x+p1.x)/2, cy = (p0.y+p1.y)/2 - 4;
        ctx.quadraticCurveTo(p0.x, p0.y, cx, cy);
        ctx.quadraticCurveTo(p1.x, p1.y, p1.x, p1.y);
    }
    ctx.lineTo(W+60, H);
    ctx.closePath(); ctx.fill();

    // Crête éclairée : accentue le relief et rend le défilement plus visible.
    if (ridgeColor) {
        ctx.strokeStyle = ridgeColor; ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[i], p1 = pts[i+1];
            const cx = (p0.x+p1.x)/2, cy = (p0.y+p1.y)/2 - 4;
            if (i === 0) ctx.moveTo(p0.x, p0.y);
            ctx.quadraticCurveTo(p0.x, p0.y, cx, cy);
            ctx.quadraticCurveTo(p1.x, p1.y, p1.x, p1.y);
        }
        ctx.stroke();
    }
}

let gustTimer = 500, gustActive = 0, gustParticles = [];
function sndGust() {
    try {
        const a = audCtx(), t = a.currentTime;
        const len = a.sampleRate * 0.9;
        const buf = a.createBuffer(1, len, a.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * 0.14 * Math.sin(i/len*Math.PI);
        const src = a.createBufferSource(), g = a.createGain();
        src.buffer = buf; g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.9);
        const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = 1;
        src.connect(bp); bp.connect(g); g.connect(a.destination); src.start(t);
    } catch (e) {}
}
function updateAmbient() {
    ambientFrame++;
    scrollDunes(duneFarPts, 0.18, (W+120));
    scrollDunes(duneNearPts, 0.35, (W+160));

    if (gustActive > 0) {
        gustActive--;
        if (Math.random() < 0.7) {
            gustParticles.push({
                x: -20, y: Math.random()*H*0.9,
                vx: 5 + Math.random()*4, vy: (Math.random()-0.5)*1.2,
                size: 1 + Math.random()*2.5, alpha: 0.12 + Math.random()*0.22,
            });
        }
        if (gustActive <= 0) gustTimer = 900 + Math.floor(Math.random()*700);
    } else {
        gustTimer--;
        if (gustTimer <= 0) { gustActive = 140; sndGust(); }
    }
    for (let i = gustParticles.length - 1; i >= 0; i--) {
        const p = gustParticles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x > W + 20) gustParticles.splice(i, 1);
    }
}
function drawGust() {
    if (gustActive <= 0 && !gustParticles.length) return;
    ctx.save();
    if (gustActive > 0) { ctx.fillStyle = 'rgba(200,160,100,0.06)'; ctx.fillRect(0, 0, W, H); }
    for (const p of gustParticles) {
        ctx.fillStyle = `rgba(220,190,140,${p.alpha})`;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size*2.4, p.size, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
}

function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, C.skyTop); grad.addColorStop(0.35, C.skyMid); grad.addColorStop(0.7, C.skyLow); grad.addColorStop(1, C.sand);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    drawSkyDetails();
    drawSun();
    drawDuneLayer(duneFarPts, 'rgba(110,70,30,0.65)', 'rgba(230,190,130,0.18)');
    drawDuneLayer(duneNearPts, 'rgba(80,48,18,0.85)', 'rgba(240,205,150,0.28)');

    ctx.strokeStyle = 'rgba(255,220,160,0.05)'; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
        const yy = 90 + i * 14;
        ctx.beginPath();
        for (let x = 0; x < W; x += 8) {
            const dy = Math.sin((x + ambientFrame*0.6 + i*90) * 0.02) * 2;
            if (x === 0) ctx.moveTo(x, yy+dy); else ctx.lineTo(x, yy+dy);
        }
        ctx.stroke();
    }

    // Filaments d'épice au ras du sable.
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < 11; i++) {
        const x = (i * 89 + ambientFrame * .09) % (W + 80) - 40;
        const y = 300 + (i * 37 % 88);
        const a = .08 + .07 * (1 + Math.sin(ambientFrame*.025+i)) / 2;
        ctx.fillStyle = `rgba(255,174,62,${a})`;
        ctx.beginPath(); ctx.ellipse(x, y, 8 + i%3*4, 1.2, -.12, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
}

    ctx.fillStyle = mound;

function drawMouse(hole) {
    const t = Math.max(0, Math.min(1, hole.timer / Math.max(1,hole.popDur)));
    const popIn = Math.min(1, (hole.popDur - hole.timer) / 6);
    const lift = Math.min(popIn, 1) * 22 * Math.min(1, t*3);
    const cx = hole.x, cy = hole.y - lift;
    const breathe = Math.sin(frameCount*.16 + hole.x*.02);
    const look = Math.sin(frameCount*.025 + hole.y) > .55 ? 1.5 : 0;

    if (spriteReady(SPRITES.mouse)) {
        const spriteH = 58 + breathe * .65;
        const spriteW = spriteH * SPRITES.mouse.naturalWidth / SPRITES.mouse.naturalHeight;
        const footY = hole.y + 13 - lift * .62;
        ctx.save();
        ctx.beginPath(); ctx.rect(hole.x-HOLE_R-14, hole.y-100, (HOLE_R+14)*2, 114); ctx.clip();
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        ctx.translate(cx, footY);
        ctx.rotate(Math.sin(frameCount*.055 + hole.x) * .018);
        ctx.drawImage(SPRITES.mouse, -spriteW/2, -spriteH, spriteW, spriteH);
        ctx.restore();
    } else {
    ctx.save();
    ctx.beginPath(); ctx.rect(hole.x-HOLE_R-14, hole.y-100, (HOLE_R+14)*2, 114); ctx.clip();

    // Queue longue et fines pattes : silhouette de gerboise / souris du désert.
    ctx.strokeStyle = C.mouseDark; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx+10, cy+17); ctx.bezierCurveTo(cx+30,cy+18, cx+31,cy+4, cx+24,cy+1); ctx.stroke();
    ctx.strokeStyle = C.mouseBody; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx-7,cy+24); ctx.lineTo(cx-12,cy+31); ctx.moveTo(cx+7,cy+24); ctx.lineTo(cx+13,cy+31); ctx.stroke();

    const bodyGrad = ctx.createLinearGradient(cx-15, cy, cx+16, cy+25);
    bodyGrad.addColorStop(0, C.mouseLight); bodyGrad.addColorStop(.45, C.mouseBody); bodyGrad.addColorStop(1, C.mouseDark);
    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.ellipse(cx, cy+15, 14.5+breathe*.3, 18, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(246,219,174,.7)';
    ctx.beginPath(); ctx.ellipse(cx-2, cy+18, 7, 10, .1, 0, Math.PI*2); ctx.fill();

    // Grandes oreilles thermorégulatrices, marque visuelle du Muad'Dib animal.
    ctx.fillStyle = C.mouseEar;
    ctx.beginPath(); ctx.ellipse(cx-10.5, cy-8, 7.2, 12, -.34, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+10.5, cy-8, 7.2, 12, .34, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(104,48,40,.36)';
    ctx.beginPath(); ctx.ellipse(cx-10.5, cy-8, 4.2, 8, -.34, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+10.5, cy-8, 4.2, 8, .34, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.ellipse(cx, cy+1, 13.5, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = C.mouseLight;
    ctx.beginPath(); ctx.ellipse(cx, cy+7, 7.5, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = C.mouseNose;
    ctx.beginPath(); ctx.moveTo(cx-2.4,cy+6); ctx.quadraticCurveTo(cx,cy+9.5,cx+2.4,cy+6); ctx.closePath(); ctx.fill();
    // Grands yeux noirs brillants, lisibles même sur mobile.
    ctx.fillStyle = '#120b08';
    ctx.beginPath(); ctx.ellipse(cx-5.2+look, cy, 3.3, 3.8, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+5.2+look, cy, 3.3, 3.8, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff6df';
    ctx.beginPath(); ctx.arc(cx-6+look, cy-1.3, 1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+4.4+look, cy-1.3, 1, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(40,25,12,0.6)'; ctx.lineWidth = 1;
    [-1,1].forEach(side => {
        for (let i=0;i<3;i++) {
            ctx.beginPath();
            ctx.moveTo(cx+side*8, cy+5+i*1.5);
            ctx.lineTo(cx+side*16, cy+3+i*2.5);
            ctx.stroke();
        }
    });
    // Petites pattes agrippées au bord du terrier.
    ctx.fillStyle = C.mouseLight;
    ctx.beginPath(); ctx.ellipse(cx-9,cy+25,4.5,2.4,-.15,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+9,cy+25,4.5,2.4,.15,0,Math.PI*2); ctx.fill();
    ctx.restore();
    }

    // barre de temps restant
    if (t < 1) {
        const barY = hole.y + 21;
        ctx.fillStyle = 'rgba(0,0,0,0.48)';
        ctx.beginPath(); ctx.roundRect(hole.x-20, barY, 40, 5, 2.5); ctx.fill();
        ctx.fillStyle = t > 0.4 ? '#8ee08e' : (t > 0.2 ? '#e0c05a' : '#e05a5a');

    }
}

function drawDecoy(hole) {
    const popIn = Math.min(1, (hole.popDur - hole.timer) / 6);
    const lift = popIn * 16;
    const cx = hole.x, cy = hole.y - lift;
    if (spriteReady(SPRITES.scorpion)) {
        const pulse = Math.sin(frameCount*.13 + hole.x*.04);
        const spriteW = 61 + pulse * 1.2;
        const spriteH = spriteW * SPRITES.scorpion.naturalHeight / SPRITES.scorpion.naturalWidth;
        const groundY = hole.y + 13 - lift;
        ctx.save();
        ctx.beginPath(); ctx.rect(hole.x-HOLE_R-14, hole.y-100, (HOLE_R+14)*2, 114); ctx.clip();
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        ctx.shadowColor = 'rgba(202,43,18,.48)'; ctx.shadowBlur = 9 + pulse*2;
        ctx.translate(cx, groundY);
        ctx.rotate(Math.sin(frameCount*.09 + hole.y) * .025);
        ctx.drawImage(SPRITES.scorpion, -spriteW/2, -spriteH, spriteW, spriteH);
        ctx.restore();
        return;
    }
    ctx.save();
    ctx.beginPath(); ctx.rect(hole.x-HOLE_R-14, hole.y-100, (HOLE_R+14)*2, 114); ctx.clip();
    ctx.shadowColor = 'rgba(185,42,18,.42)'; ctx.shadowBlur = 8;
    ctx.strokeStyle = C.scorpionLight; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (const side of [-1,1]) {
        for (let i=0;i<3;i++) {
            ctx.beginPath(); ctx.moveTo(cx+side*(5+i*2),cy+7+i*3);
            ctx.lineTo(cx+side*(15+i*2),cy+4+i*5); ctx.lineTo(cx+side*(20+i*3),cy+8+i*5); ctx.stroke();
        }
        ctx.beginPath(); ctx.moveTo(cx+side*7,cy+5); ctx.quadraticCurveTo(cx+side*17,cy-2,cx+side*22,cy+1); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx+side*24,cy+1,4,side<0?-.6:Math.PI-.6,side<0?1.1:Math.PI+1.1); ctx.stroke();
    }
    ctx.fillStyle = C.scorpion;
    ctx.beginPath(); ctx.ellipse(cx, cy+10, 12, 9, 0, 0, Math.PI*2); ctx.fill();
    for (let i=0;i<3;i++) { ctx.beginPath(); ctx.ellipse(cx,cy+2-i*5,7-i,5,0,0,Math.PI*2); ctx.fill(); }
    ctx.strokeStyle = C.scorpionLight; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx+5, cy-1); ctx.bezierCurveTo(cx+19, cy-7, cx+17, cy-22, cx+8, cy-24);
    ctx.stroke();
    ctx.fillStyle = '#e64b2f';
    ctx.beginPath(); ctx.moveTo(cx+8,cy-28); ctx.lineTo(cx+12,cy-22); ctx.lineTo(cx+5,cy-23); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff593b';
    ctx.beginPath(); ctx.arc(cx-4, cy+3, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+4, cy+3, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.restore();
}

function drawPowerup(hole) {
    const popIn = Math.min(1, (hole.popDur - hole.timer) / 6);
    const lift = popIn * 20;
    hole.phase += 0.08;
    ctx.save();
    ctx.beginPath(); ctx.rect(hole.x-HOLE_R-14, hole.y-100, (HOLE_R+14)*2, 114); ctx.clip();
    const py = hole.y-lift+Math.sin(hole.phase)*2;
    ctx.shadowColor = '#ffd46a'; ctx.shadowBlur = 12;
    ctx.strokeStyle = '#f2d69d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(hole.x,py,14,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(242,214,157,.72)'; ctx.lineWidth = 1;
    for (let i=-8;i<=8;i+=5) { ctx.beginPath(); ctx.moveTo(hole.x-12,py+i); ctx.lineTo(hole.x+12,py+i); ctx.stroke(); }
    for (let i=-8;i<=8;i+=5) { ctx.beginPath(); ctx.moveTo(hole.x+i,py-12); ctx.lineTo(hole.x+i,py+12); ctx.stroke(); }
    ctx.strokeStyle = '#8d5b25'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(hole.x+10,py+10); ctx.lineTo(hole.x+21,py+24); ctx.stroke();
    ctx.restore();
}

function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += p.gravity ?? 0.08; p.life--;
        if (p.spin) p.rotation += p.spin;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        if (p.kind) {
            const alpha = Math.min(1, p.life/12);
            ctx.save(); ctx.globalAlpha = alpha; ctx.translate(p.x,p.y); ctx.rotate(p.rotation);
            if (p.kind === 'blood') {
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.ellipse(0,0,p.size*.72,p.size*1.65,0,0,Math.PI*2); ctx.fill();
            } else {
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.moveTo(-p.size,-p.size*.4); ctx.lineTo(p.size*.7,-p.size); ctx.lineTo(p.size,p.size*.8); ctx.lineTo(-p.size*.5,p.size); ctx.closePath(); ctx.fill();
            }
            ctx.restore();
            continue;
        }
        ctx.fillStyle = p.color + (p.life/p.maxLife) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    }
}

function drawBloodStains() {
    for (let i=bloodStains.length-1; i>=0; i--) {
        const stain = bloodStains[i];
        stain.life--;
        if (stain.life <= 0) { bloodStains.splice(i,1); continue; }
        const alpha = Math.min(.78, stain.life/180*.78);
        ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = 'multiply';
        const pool = ctx.createRadialGradient(stain.x-3,stain.y-1,1,stain.x,stain.y,stain.rx);
        pool.addColorStop(0,'#6d0609'); pool.addColorStop(.58,'#410305'); pool.addColorStop(1,'rgba(38,0,2,0)');
        ctx.fillStyle = pool;
        ctx.beginPath(); ctx.ellipse(stain.x,stain.y,stain.rx,stain.ry,stain.rotation,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#590508';
        for (const spot of stain.spots) {
            ctx.beginPath(); ctx.ellipse(stain.x+spot.x,stain.y+spot.y,spot.r,spot.r*.55,stain.rotation,0,Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }
}

function drawGoreOverlay() {
    // Simple pulse rouge au moment du coup, pas de teinte permanente tant que
    // le mode caché reste actif (ça fatiguait l'écran sans rien ajouter).
    if (goreFlash <= 0) return;
    ctx.save();
    const a = goreFlash / 10;
    ctx.fillStyle = `rgba(140,0,5,${a*.12})`;
    ctx.fillRect(0, 0, W, H);

}
function drawFloatingTexts() {
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy; ft.life--; ft.alpha = Math.min(1, ft.life/15);
        if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
        ctx.save(); ctx.globalAlpha = ft.alpha;
        ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
        ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();

}
function drawHearts() {
    for (let i = hearts.length - 1; i >= 0; i--) {
        const h = hearts[i];
        h.y += h.vy; h.x += h.drift; h.life--;
        if (h.life <= 0) { hearts.splice(i, 1); continue; }
        const alpha = Math.min(1, h.life / 30);

        ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('❤️', h.x, h.y);

}

function drawSkulls() {
    for (let i = skulls.length - 1; i >= 0; i--) {
        const s = skulls[i];
        s.wobble += 0.16;
        s.y += s.vy; s.x += s.drift + Math.sin(s.wobble)*0.5; s.life--;
        if (s.life <= 0) { skulls.splice(i, 1); continue; }
        const alpha = Math.min(1, s.life / 30);
        ctx.save(); ctx.globalAlpha = alpha;
        ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('💀', s.x, s.y);
        ctx.restore();
    }
}

function drawHUD() {

    ctx.font = 'italic 12px sans-serif'; ctx.fillStyle = '#e0a8b8';
    ctx.fillText('— La Quête de Lorhelyne —', W/2, 66);

    ctx.font = '12.5px sans-serif'; ctx.fillStyle = '#c9b088';
    MENU_RULES.forEach((line, i) => {
        ctx.fillText('• ' + line, W/2, 96 + i*22);
    });

    const rulesBottom = 96 + MENU_RULES.length*22;
    ctx.font = 'italic 11px sans-serif'; ctx.fillStyle = '#6a5230';
    MENU_MYSTERY.forEach((line, i) => {
        ctx.fillText(line, W/2, rulesBottom + 16 + i*15);
    });
    const mysteryBottom = rulesBottom + 16 + MENU_MYSTERY.length*15;

    ctx.font = 'bold 17px sans-serif'; ctx.fillStyle = C.white;
    ctx.fillText('Clique pour commencer', W/2, mysteryBottom + 26);
    if (bestScore > 0) { ctx.font = '13px sans-serif'; ctx.fillStyle = '#7c5e2a'; ctx.fillText('Meilleur score : ' + bestScore, W/2, mysteryBottom + 50); }

    // Second indice, encore plus discret que la ligne Lorhelyne : se lit comme
    // une cote d'archive anodine (coin du parchemin), mais donne la touche
    // elle-même à qui prend la peine de la lire.
    ctx.font = 'italic 9px sans-serif'; ctx.fillStyle = 'rgba(154,117,67,0.4)';
    ctx.textAlign = 'right';
    ctx.fillText('archives — réf. F10', 628, 350);
    ctx.restore();
}

function drawDead() {
    ctx.fillStyle = 'rgba(10,5,2,0.72)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(35,16,5,.9)'; ctx.beginPath(); ctx.roundRect(W/2-170,H/2-104,340,218,16); ctx.fill();
    ctx.strokeStyle = 'rgba(225,173,69,.35)'; ctx.stroke();
    ctx.save(); ctx.textAlign = 'center';
    ctx.font = 'bold 26px sans-serif'; ctx.fillStyle = C.red;
    ctx.fillText('Trop en danger…', W/2, H/2-55);
    ctx.font = 'bold 40px sans-serif'; ctx.fillStyle = C.gold; ctx.fillText(score, W/2, H/2-10);
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#a89060';
    ctx.fillText(savedCount + ' sauvés · ' + missedCount + ' perdus', W/2, H/2+15);
    if (bestScore > 0) ctx.fillText('Record : ' + bestScore, W/2, H/2+38);
    ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = C.white;
    ctx.fillText('Clique pour rejouer', W/2, H/2+70);
    ctx.restore();
}

function draw() {
    updateAmbient();
    ctx.save();
    if (shakeTimer > 0) { shakeTimer--; ctx.translate((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity); }
    drawBackground();
    drawBloodStains();
    for (const hole of holes) {
        drawHole(hole);
        if (hole.state === 'up') {
            if (hole.type === 'mouse') drawMouse(hole);
            else if (hole.type === 'decoy') drawDecoy(hole);
            else if (hole.type === 'powerup') drawPowerup(hole);
        }
    }
    drawParticles();
    drawFloatingTexts();
    drawHearts();
    drawSkulls();
    drawGust();
    drawGoreOverlay();
    if (gameState === 'playing') drawHUD();
    if (gameState === 'menu') drawMenu();
    if (gameState === 'dead') drawDead();
    const vignette = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.7);
    vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(6,3,1,0.35)');
    ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
    ctx.restore();
}

// ──────────────────────────────────────────────
//  BOUCLE
// ──────────────────────────────────────────────
let lastTime = 0, accumulator = 0;
function loop(now) {
    requestAnimationFrame(loop);
    if (!lastTime) { lastTime = now; return; }
    const dt = Math.min(now - lastTime, 100);
    lastTime = now;
    accumulator += dt;
    while (accumulator >= FRAME_DUR) { tick(); accumulator -= FRAME_DUR; }
    draw();
}

// ──────────────────────────────────────────────
//  INPUT
// ──────────────────────────────────────────────
canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width, scaleY = H / rect.height;
    onCanvasClick((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
});
document.addEventListener('keydown', e => {
    if (e.code === 'F10') {
        e.preventDefault();
        hardcoreMode = !hardcoreMode;
        if (hardcoreMode) hardcoreEverUsed = true;
    }
});

// ──────────────────────────────────────────────
//  API SCORES
// ──────────────────────────────────────────────
async function submitScore(s) {
    if (!scoreSecret) await fetchSecret();
    if (!scoreSecret) return;
    const dur = Math.floor((Date.now() - startTime) / 1000);
    const hash = await sha256(GAME_ID + s + dur + scoreSecret);
    try {
        const r = await fetch('scores_api.php', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'submit', game: GAME_ID, score: s, duration: dur, hash })
        });
        const j = await r.json();
        if (!j.ok) console.warn('[muaddib_rescue] score non enregistré côté serveur :', j.error || 'raison inconnue');
        if (j.ok && j.new_personal) { bestScore = s; localStorage.setItem('muaddib_best', String(s)); }
        loadLeaderboard();
    } catch (e) {}
}
async function sha256(msg) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function fetchSecret() {
    try {
        const r = await fetch('scores_api.php', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'token', game: GAME_ID })
        });
        const j = await r.json();
        if (j.ok) scoreSecret = j.secret;
    } catch (e) {}
}
async function loadLeaderboard() {
    try {
        const r = await fetch('scores_api.php?action=leaderboard&game=' + GAME_ID + '&limit=10&scope=weekly', { credentials: 'same-origin' });
        const j = await r.json();
        if (!j.ok) return;
        const me = localStorage.getItem('user') || '';
        const ul = document.getElementById('lb-list');
        if (!j.leaderboard.length) { ul.innerHTML = '<li style="color:var(--muted)">Aucun score cette semaine</li>'; return; }
        ul.innerHTML = j.leaderboard.map((e, i) => {
            const medals = ['🥇','🥈','🥉'];
            const rank = medals[i] || (i + 1);
            const isMe = e.player === me;
            return `<li class="${isMe?'me':''}"><span class="rank">${rank}</span><span class="name">${esc(e.player)}</span><span class="pts">${e.score}</span></li>`;
        }).join('');
    } catch (e) {}
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ──────────────────────────────────────────────
//  INIT
// ──────────────────────────────────────────────
bestScore = parseInt(localStorage.getItem('muaddib_best') || '0', 10);
gameState = 'menu';
initDunes();
reset();
loadLeaderboard();
fetchSecret();
requestAnimationFrame(loop);
})();
</script>
