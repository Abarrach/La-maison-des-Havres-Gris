<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Worm Rider — Hub Jeux</title>
<link rel="stylesheet" href="../style.css">
<style>
:root {
    --bg: #0a0402;
    --gold: #cda434;
    --text: #f5deb3;
    --muted: #7c5e2a;
}
html, body {
    overflow: hidden; height: 100%; margin: 0;
    touch-action: none; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
}
body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
}
#game-wrapper {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
}
canvas {
    border: 1px solid #3d2b16; border-radius: 8px;
    box-shadow: 0 0 60px rgba(205,164,52,0.08), 0 0 120px rgba(180,120,30,0.04);
    cursor: crosshair; display: block;
}
.game-header {
    display: flex; align-items: center; gap: 14px;
    width: 100%; max-width: 800px; padding: 10px 16px; box-sizing: border-box;
    background: rgba(0,0,0,0.4); border: 1px solid #3d2b16; border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.35);
}
.game-header .back-link {
    color: var(--gold); text-decoration: none; font-weight: bold; font-size: 0.82em;
    border: 1px solid #7c5e2a; border-radius: 4px; padding: 6px 14px;
    background: linear-gradient(180deg, #2a1a0b, #1a0f05);
    transition: all 0.2s; white-space: nowrap;
}
.game-header .back-link:hover { background: var(--gold); color: #000; border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
.game-header .game-title {
    font-size: 1.15em; font-weight: bold; color: var(--gold);
    text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px rgba(205,164,52,0.3);
}
.score-live { font-size: 1.25em; color: #ffcc00; font-weight: bold; margin-left: auto; }

#leaderboard {
    position: absolute; right: -240px; top: 0; width: 220px;
    background: rgba(10,5,2,0.92); border: 1px solid #3d2b16;
    border-radius: 8px; padding: 16px 14px; font-size: 0.78em;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
#leaderboard h3 {
    margin: 0 0 12px; color: var(--gold); font-size: 0.95em;
    text-align: center; text-transform: uppercase; letter-spacing: 2px;
}
#lb-list { list-style: none; padding: 0; margin: 0; }
#lb-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; border-bottom: 1px solid rgba(61,43,22,0.4);
}
#lb-list li .rank { color: var(--muted); width: 26px; font-size: 0.9em; }
#lb-list li .name { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#lb-list li .pts { color: #ffcc00; font-weight: bold; min-width: 44px; text-align: right; }
#lb-list li.me .name { color: var(--gold); }
.controls-hint { font-size: 0.72em; color: var(--muted); text-align: center; opacity: 0.7; }

/* Responsive */
@media (max-width: 900px) {

@media (max-width: 820px) {
    canvas { width: 95vw !important; height: auto !important; }
}

<script>
(function () {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 400;
const GAME_ID = 'worm_rider';

// ---- Delta-time ----
const TARGET_FPS = 60, FRAME_DUR = 1000 / TARGET_FPS;
let lastTime = 0, accumulator = 0;

// ---- État ----
let worm, obstacles, spiceItems, particles, floatingTexts;
let distance, distanceScore, spiceCount, bestScore, gameState, frameCount;
let gameSpeed, startTime, scoreSecret;
let shakeTimer = 0, shakeIntensity = 0;
let milestone = 0, finalScore = 0;
let targetY = H / 2; // position cible souris/clavier
let mouseActive = false;
let boosting = false, boostWanted = false, boostMeter = 100;
let combo = 0, comboTimer = 0, closeCallBonus = 0;
let atmosphereFlash = 0;
let hitFlash = 0;       // flash rouge bref à l'impact (game feel)
let deadSince = 0;      // frames écoulées depuis la mort, pour le fondu d'entrée de l'écran de fin

// ---- Physique ----
const HEAD_X           = 200;   // position X fixe de la tête à l'écran
const WORM_SPACING     = 8;     // corps compact, proche de l'échelle du ver d'origine
const WORM_SEGMENTS_BASE = 10;   // longueur de départ
const WORM_SEGMENTS_MAX  = Math.floor((HEAD_X + 20) / WORM_SPACING);
const SPICE_PER_GROWTH   = 2;    // +1 anneau tous les N épices
// L'épice ne rapporte plus un score fixe isolé de la croissance qu'elle
// impose : ailleurs (Snake, Slither.io, Temple Run…), taille/risque et score
// montent toujours ENSEMBLE. Ici, chaque épice augmente un MULTIPLICATEUR
// appliqué en continu aux points de distance — grandir devient un vrai pari
// qui rapporte tant qu'on survit, pas juste un risque gratuit pour +5 ponctuels.
const SPICE_MULT_PER_UNIT = 0.05; // +5 % de multiplicateur de distance par épice
const SPICE_FLAT_BONUS    = 2;    // petit bonus immédiat au ramassage, en plus du multiplicateur
const WORM_HEAD_R     = 16;
const WORM_SEG_R      = 13;
const WORM_TAIL_R     = 6;
// Amplitude de l'ondulation vivante superposée à la trajectoire réelle (identique
// au ressenti "vague fluide" de la version d'origine — pas un hack de raideur,
// juste un frémissement pour que le ver ne semble jamais figé à l'arrêt.
const WORM_WAVE_AMPLITUDE = 0.8;
const HEAD_SMOOTH     = 0.16;
const BASE_SPEED      = 3;
const MAX_SPEED       = 7;
const SPEED_ACCEL     = 0.0006;
const MARGIN_TOP      = 30;
const MARGIN_BOT      = 30;
const HIT_PAD         = 8;

// ---- Boost (risque/récompense) ----
const BOOST_MULT      = 1.9;
const BOOST_MIN_USE   = 15;   // seuil mini de jauge pour déclencher un boost
const BOOST_DRAIN     = 1.3;  // /tick pendant le boost
const BOOST_REGEN     = 0.45; // /tick au repos

// ---- Close call (esquive serrée) ----
const CLOSE_CALL_MARGIN = 16;

// ---- Sprite premium : tête de Shai-Hulud + cavalier ----
// Un seul bloc rigide pour la tête ne peut PAS à la fois (a) rester assez
// épais pour ne pas paraître minuscule, (b) rester assez court pour ne pas
// être recouvert/recouvrir les plaques voisines, ET (c) suivre la vraie
// courbe pendant un virage/plongeon — ces 3 contraintes se contredisent
// pour un bloc unique (déjà tenté 2 fois, cf. historique).
// Solution : DÉCOUPER le sprite de tête en HEAD_SLICES tranches verticales
// (comme les plaques du corps), chacune positionnée et tournée EXACTEMENT
// comme un anneau (segAngle, position réelle) — la tête peut alors se
// courber avec le reste du ver, sans compression et sans trou, à taille
// native (pas d'étirement non uniforme).
const RIDER_SPRITE_W = 633, RIDER_SPRITE_H = 360;
const RIDER_SOURCE_X = 68;
const HEAD_SLICES = 4;                              // anneaux couverts par une tranche de tête (0 = museau)
const HEAD_SCALE = (WORM_HEAD_R * 2) / RIDER_SPRITE_H; // échelle uniforme (pas de déformation) calée sur l'épaisseur voulue
const riderSprite = new Image();
let riderSpriteReady = false;
riderSprite.onload = function () { riderSpriteReady = true; };
riderSprite.src = 'img/worm_rider_mount.webp';
const BODY_SPRITE_W = 151, BODY_SPRITE_H = 320;
const bodySegmentSprite = new Image();
let bodySegmentReady = false;
bodySegmentSprite.onload = function () { bodySegmentReady = true; };
bodySegmentSprite.src = 'img/worm_body_segment.webp';

// ---- Couleurs ----
const C = {
    skyTop: '#2b110d', skyMid: '#8d3d1e', skyBot: '#e29a43',
    sand: '#D9A94F', sandDark: '#8D5925', sandLine: '#B87932',
    wormBody: '#75502c', wormLight: '#b0783e', wormDark: '#352111',
    wormMouth: '#C44', wormTeeth: '#DEB887',
    rock: '#4A3520', rockLight: '#6B5030',
    spice: '#FFD700', gold: '#FFCC00', red: '#C44', white: '#F5DEB3',
};

// ============================================================
//  SONS
// ============================================================
let audioCtx = null;
function aud() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }

function sndRumble() {
    const a = aud(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(40, t); o.frequency.exponentialRampToValueAtTime(25, t + 0.15);
    g.gain.setValueAtTime(0.04, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.15);
}
function sndSpice() {
    const a = aud(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1100, t+0.04); o.frequency.setValueAtTime(1320, t+0.08);
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.15);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.15);
}
function sndMilestone() {
    const a = aud(), t = a.currentTime;
    [523, 659, 784, 1047].forEach((f, i) => {
        const o = a.createOscillator(), g = a.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(f, t+i*0.08);
        g.gain.setValueAtTime(0.08, t+i*0.08); g.gain.exponentialRampToValueAtTime(0.001, t+i*0.08+0.15);
        o.connect(g); g.connect(a.destination); o.start(t+i*0.08); o.stop(t+i*0.08+0.15);
    });
}
function sndCrash() {
    const a = aud(), t = a.currentTime;
    const buf = a.createBuffer(1, a.sampleRate * 0.3, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const src = a.createBufferSource(), g = a.createGain();
    src.buffer = buf; g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.3);
    src.connect(g); g.connect(a.destination); src.start(t);
    const o = a.createOscillator(), g2 = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(100, t); o.frequency.exponentialRampToValueAtTime(30, t+0.25);
    g2.gain.setValueAtTime(0.15, t); g2.gain.exponentialRampToValueAtTime(0.001, t+0.25);
    o.connect(g2); g2.connect(a.destination); o.start(t); o.stop(t+0.25);
}
function sndDive() {
    const a = aud(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(80, t+0.2);
    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.25);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.25);
}
function sndBoost() {
    const a = aud(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(650, t+0.2);
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.3);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.3);
}
function sndCloseCall() {
    const a = aud(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(600, t); o.frequency.exponentialRampToValueAtTime(900, t+0.06);
    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.1);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.1);
}

// ============================================================
//  PARALLAX
// ============================================================
let bgDunes = [], bgMesas = [], airGrains = [];
function generateBg() {
    bgDunes = [
        { speed: .12, base: 326, amp: 22, color: '#7b3f20', points: [] },
        { speed: .28, base: 350, amp: 28, color: '#a65d2b', points: [] },
        { speed: .52, base: 374, amp: 18, color: '#c8873d', points: [] },
    ];
    for (let layerIndex = 0; layerIndex < bgDunes.length; layerIndex++) {
        const layer = bgDunes[layerIndex];
        for (let i = 0; i < 16; i++) {
            layer.points.push({ x: i * 62 - 70, y: layer.base - Math.sin(i * 1.13 + layerIndex) * layer.amp * (.45 + Math.random() * .55) });
        }
    }
    bgMesas = Array.from({ length: 11 }, function (_, i) {
        return { x: i * 105 - 80, w: 75 + Math.random() * 70, h: 45 + Math.random() * 105, top: .28 + Math.random() * .35, shade: Math.random() };
    });
    airGrains = Array.from({ length: 85 }, function () {
        return { x: Math.random() * W, y: 35 + Math.random() * (H - 75), size: .4 + Math.random() * 1.5, speed: .25 + Math.random() * 1.2, alpha: .04 + Math.random() * .16 };
    });
}

// ============================================================
//  WORM — physique de chaîne fluide (historique de trajectoire)
// ============================================================
// La tête ne bouge jamais en X à l'écran (c'est le monde qui défile vers
// elle) — donc chaque anneau garde un décalage X fixe derrière la tête,
// exactement comme le reste du décor. Seul le Y doit "suivre avec retard" :
// on garde un historique du Y de la tête indexé par la distance de
// défilement du jeu (et non le déplacement réel de la tête, qui est
// presque nul), et chaque anneau relit le Y d'il y a i*WORM_SPACING de
// distance parcourue. Ça retrace l'ondulation réelle sans jamais se tasser
// — c'est ce mécanisme, PAS un ressort/amorti, qui donne le mouvement
// organique. Ne jamais réintroduire de lissage/écrêtage supplémentaire sur
// worm.segs[i] ici : ça a déjà été tenté et c'est précisément ce qui rend
// le ver raide (double amortissement avec le rendu).
const TRAIL_STEP = 2; // unités de distance entre deux points enregistrés
const TRAIL_MAX_LEN = Math.ceil((WORM_SEGMENTS_MAX * WORM_SPACING + 20) / TRAIL_STEP);
let trail = [];

function seedTrail(y) {
    trail = [];
    for (let i = 0; i < TRAIL_MAX_LEN; i++) trail.push({ d: -i * TRAIL_STEP, y });
}
function pushTrail(d, y) {
    const last = trail[0];
    if (!last || d - last.d >= TRAIL_STEP) trail.unshift({ d, y });
    if (trail.length > TRAIL_MAX_LEN) trail.length = TRAIL_MAX_LEN;
}
function yAtTravelDistance(targetD) {
    if (!trail.length) return worm.headY;
    if (targetD >= trail[0].d) return trail[0].y;
    for (let i = 0; i < trail.length - 1; i++) {
        const a = trail[i], b = trail[i + 1]; // a.d > b.d (plus récent -> plus ancien)
        if (targetD <= a.d && targetD >= b.d) {
            const span = a.d - b.d || 1;
            const t = (targetD - b.d) / span;
            return b.y + (a.y - b.y) * t;
        }
    }
    return trail[trail.length - 1].y;
}

function createWorm() {
    const segs = [];
    for (let i = 0; i < WORM_SEGMENTS_BASE; i++) {
        segs.push({ x: HEAD_X - i * WORM_SPACING, y: H / 2 });
    }
    seedTrail(H / 2);
    return { segs, headY: H / 2, invincible: 0 };
}

function segRadius(i) {
    if (i === 0) return WORM_HEAD_R;
    const total = worm.segs.length;
    const t = total > 1 ? i / (total - 1) : 0;
    return WORM_SEG_R * (1 - t * 0.55) + WORM_TAIL_R * t;
}

// Le ver grandit avec l'épice collectée : un corps plus long est plus dur
// à faufiler dans les passages, ça remplace la difficulté qui manquait.
function maybeGrowWorm() {
    const targetLen = Math.min(WORM_SEGMENTS_MAX, WORM_SEGMENTS_BASE + Math.floor(spiceCount / SPICE_PER_GROWTH));
    while (worm.segs.length < targetLen) {
        const tail = worm.segs[worm.segs.length - 1];
        worm.segs.push({ x: tail.x, y: tail.y });
    }
}

// ============================================================
//  OBSTACLES
// ============================================================
let nextObstacle = 0;

function spawnObstacle() {
    const minGap = Math.max(38, 100 - distance / 220);
    nextObstacle = frameCount + minGap + Math.random() * 40;

    const dm = Math.floor(distance / 10);
    const r = Math.random();

    if (r < 0.45) {
        // Rochers avec passage (haut ou bas)
        const gapSize = Math.max(80, 140 - dm * 0.07);
        const gapY = MARGIN_TOP + gapSize / 2 + Math.random() * (H - MARGIN_TOP - MARGIN_BOT - gapSize);
        obstacles.push({
            type: 'pillars', x: W + 20,
            gapY, gapSize,
            w: 35 + Math.random() * 15,
            seed: Math.random() * 1000,
            passed: false, closeCalled: false,
        });
    } else if (r < 0.7) {
        // Rocher isolé (position aléatoire)
        const ry = MARGIN_TOP + 30 + Math.random() * (H - MARGIN_TOP - MARGIN_BOT - 60);
        const rw = 30 + Math.random() * 25;
        const rh = 30 + Math.random() * 25;
        obstacles.push({
            type: 'rock', x: W + 20,
            y: ry - rh / 2, w: rw, h: rh,
            seed: Math.random() * 1000,
            passed: false, closeCalled: false,
        });
    } else if (r < 0.85 && dm > 300) {
        // Thoptère Harkonnen (se déplace aussi verticalement)
        obstacles.push({
            type: 'thopter', x: W + 40,
            y: MARGIN_TOP + 30 + Math.random() * (H - MARGIN_TOP - MARGIN_BOT - 60),
            w: 40, h: 18,
            vy: (Math.random() < 0.5 ? 1 : -1) * (0.5 + Math.random()),
            phase: Math.random() * Math.PI * 2,
            seed: Math.random() * 1000,
            passed: false, closeCalled: false,
        });
    } else {
        // Geyser de sable (colonne montante depuis le bas)
        const gw = 20 + Math.random() * 15;
        const gh = 80 + Math.random() * 100;
        obstacles.push({
            type: 'geyser', x: W + 20,
            y: H - gh, w: gw, h: gh,
            passed: false, closeCalled: false, phase: Math.random() * Math.PI * 2, seed: Math.random() * 1000,
        });
    }
}

function spawnSpice() {
    if (Math.random() > 0.5) return;
    const count = 3 + Math.floor(Math.random() * 5);
    const baseY = MARGIN_TOP + 40 + Math.random() * (H - MARGIN_TOP - MARGIN_BOT - 80);
    const pattern = Math.random();
    for (let i = 0; i < count; i++) {
        let sx = W + 50 + i * 26;
        let sy;
        if (pattern < 0.33) sy = baseY; // ligne
        else if (pattern < 0.66) sy = baseY - Math.sin(i / count * Math.PI) * 50; // arc
        else sy = baseY + (Math.random() - 0.5) * 60; // dispersé
        spiceItems.push({ x: sx, y: sy, collected: false, sparkle: Math.random() * Math.PI * 2 });
    }
}

// ============================================================
//  PARTICLES
// ============================================================
function spawnSand(x, y, count) {
    for (let i = 0; i < count; i++)
        particles.push({
            x: x + (Math.random()-0.5)*10, y: y + (Math.random()-0.5)*6,
            vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3,
            life: 15 + Math.random() * 12, size: 1.5 + Math.random() * 2.5,
            color: Math.random() < 0.5 ? 'rgba(180,150,100,' : 'rgba(210,180,120,',
            gravity: .025, drag: .97, glow: 0,
        });
}
function spawnBurst(x, y, count, hue) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2, force = 1.2 + Math.random() * 3.8;
        particles.push({
            x, y, vx: Math.cos(a) * force, vy: Math.sin(a) * force,
            life: 28 + Math.random() * 26, size: 1.2 + Math.random() * 2.8,
            color: `hsla(${hue + Math.random() * 22},90%,68%,`, gravity: .015, drag: .965, glow: 8,
        });
    }
}
function addFloatingText(text, x, y, color) {
    floatingTexts.push({ text, x, y, vy: -1.5, life: 50, color, alpha: 1 });
}

// ============================================================
//  RESET
// ============================================================
function reset() {
    worm = createWorm();
    obstacles = []; spiceItems = []; particles = []; floatingTexts = [];
    distance = 0; distanceScore = 0; spiceCount = 0; frameCount = 0;
    gameSpeed = BASE_SPEED; nextObstacle = 90; milestone = 0;
    shakeTimer = 0; finalScore = 0;
    boosting = false; boostWanted = false; boostMeter = 100;
    combo = 0; comboTimer = 0; closeCallBonus = 0;
    atmosphereFlash = 0; hitFlash = 0; deadSince = 0;
    startTime = Date.now();
    targetY = H / 2;
    generateBg();
    updateScoreDisplay();
}

function spiceMultiplier() { return 1 + spiceCount * SPICE_MULT_PER_UNIT; }
function totalScore() { return Math.floor(distanceScore) + spiceCount * SPICE_FLAT_BONUS + closeCallBonus; }
function updateScoreDisplay() { document.getElementById('score-display').textContent = totalScore(); }

// ============================================================
//  DRAWING
// ============================================================
function drawSky() {
    const scroll = gameState === 'playing' ? gameSpeed : .28;
    const twilight = Math.min(.52, distance / 32000);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1c0b0c'); g.addColorStop(.32, '#642415');
    g.addColorStop(.7, '#c35f29'); g.addColorStop(1, '#efb45c');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // Soleil dur et rayons volumétriques.
    const sunX = 646, sunY = 68;
    const halo = ctx.createRadialGradient(sunX, sunY, 6, sunX, sunY, 125);
    halo.addColorStop(0, 'rgba(255,250,215,.96)');
    halo.addColorStop(.18, 'rgba(255,205,100,.52)');
    halo.addColorStop(.55, 'rgba(255,125,42,.13)');
    halo.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(sunX, sunY, 125, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff0bd'; ctx.beginPath(); ctx.arc(sunX, sunY, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,193,96,.045)';
    ctx.beginPath(); ctx.moveTo(sunX - 16, sunY + 7); ctx.lineTo(355, H); ctx.lineTo(620, H); ctx.closePath(); ctx.fill();

    // Mesas lointaines, larges et facettées.
    for (const m of bgMesas) {
        m.x -= scroll * .075;
        if (m.x + m.w < -90) m.x = W + 55 + Math.random() * 90;
        const base = 332, topY = base - m.h;
        ctx.fillStyle = m.shade > .5 ? '#532319' : '#432019';
        ctx.beginPath(); ctx.moveTo(m.x, base); ctx.lineTo(m.x + m.w * .12, base - m.h * .2);
        ctx.lineTo(m.x + m.w * m.top, topY); ctx.lineTo(m.x + m.w * Math.min(.82, m.top + .34), topY + 2);
        ctx.lineTo(m.x + m.w * .9, base - m.h * .18); ctx.lineTo(m.x + m.w, base); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(226,113,54,.13)';
        ctx.beginPath(); ctx.moveTo(m.x + m.w * .12, base); ctx.lineTo(m.x + m.w * m.top, topY);
        ctx.lineTo(m.x + m.w * (m.top + .12), base); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(255,160,84,.09)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(m.x + 7, base - m.h * .27); ctx.lineTo(m.x + m.w - 8, base - m.h * .25); ctx.stroke();
    }

    // Trois nappes de dunes parallaxes.
    for (let layerIndex = 0; layerIndex < bgDunes.length; layerIndex++) {
        const layer = bgDunes[layerIndex];
        for (const p of layer.points) p.x -= scroll * layer.speed;
        while (layer.points[0].x < -95) {
            layer.points.shift();
            const last = layer.points[layer.points.length - 1];
            const i = frameCount + layer.points.length;
            layer.points.push({ x: last.x + 62, y: layer.base - Math.sin(i * .71 + layerIndex) * layer.amp * (.55 + Math.random() * .35) });
        }
        ctx.fillStyle = layer.color;
        ctx.beginPath(); ctx.moveTo(-20, H);
        const pts = layer.points;
        ctx.lineTo(pts[0].x, pts[0].y);
        for (let i = 0; i < pts.length - 1; i++) {
            const p = pts[i], n = pts[i + 1];
            ctx.quadraticCurveTo(p.x, p.y, (p.x + n.x) / 2, (p.y + n.y) / 2);
        }
        ctx.lineTo(W + 30, H); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = layerIndex === 2 ? 'rgba(255,218,145,.18)' : 'rgba(255,177,90,.08)';
        ctx.lineWidth = 1; ctx.stroke();
    }

    // Sol proche texturé et crêtes balayées par le vent.
    const ground = ctx.createLinearGradient(0, H - 34, 0, H);
    ground.addColorStop(0, '#b87531'); ground.addColorStop(1, '#6d3c1d');
    ctx.fillStyle = ground; ctx.fillRect(0, H - 29, W, 29);
    ctx.strokeStyle = 'rgba(255,204,118,.18)'; ctx.lineWidth = 1;
    for (let i = 0; i < 12; i++) {
        const x = ((i * 83 - distance * .7) % (W + 100) + W + 100) % (W + 100) - 50;
        ctx.beginPath(); ctx.moveTo(x, H - 22 + i % 4 * 5); ctx.lineTo(x + 34 + i % 3 * 13, H - 23 + i % 4 * 5); ctx.stroke();
    }

    // Grains en suspension, plus rapides avec le boost.
    ctx.fillStyle = '#ffd18a';
    for (const grain of airGrains) {
        grain.x -= grain.speed * (boosting ? 2.4 : 1);
        if (grain.x < -8) { grain.x = W + Math.random() * 35; grain.y = 35 + Math.random() * (H - 75); }
        ctx.globalAlpha = grain.alpha * (boosting ? 1.45 : 1);
        ctx.beginPath(); ctx.arc(grain.x, grain.y, grain.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (twilight > 0) {
        ctx.fillStyle = `rgba(24,28,68,${twilight})`; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = `rgba(210,220,255,${twilight * .55})`;
        for (let i = 0; i < 18; i++) { ctx.beginPath(); ctx.arc((i * 149) % W, 18 + (i * 47) % 145, i % 4 ? .6 : 1.2, 0, Math.PI * 2); ctx.fill(); }
    }
}

function drawObstacle(ob) {
    if (ob.type === 'pillars') {
        const topH = ob.gapY - ob.gapSize / 2;
        const botY = ob.gapY + ob.gapSize / 2;
        function drawCliff(y, h, isTop) {
            const grad = ctx.createLinearGradient(ob.x - 5, 0, ob.x + ob.w + 8, 0);
            grad.addColorStop(0, '#1c0d09'); grad.addColorStop(.3, '#754021');
            grad.addColorStop(.58, '#4b2515'); grad.addColorStop(1, '#160a08');
            ctx.fillStyle = grad;
            const steps = Math.max(3, Math.ceil(h / 58)), left = [], right = [];
            for (let i = 0; i <= steps; i++) {
                const yy = y + h * i / steps;
                left.push({ x: ob.x + Math.sin(ob.seed + i * 1.7) * 4.5, y: yy });
                right.push({ x: ob.x + ob.w + Math.cos(ob.seed * .7 + i * 1.31) * 5, y: yy });
            }
            ctx.beginPath(); ctx.moveTo(left[0].x, left[0].y);
            for (let i = 1; i < left.length; i++) ctx.lineTo(left[i].x, left[i].y);
            for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'rgba(230,126,62,.14)';
            ctx.beginPath(); ctx.moveTo(ob.x + ob.w * .15, y); ctx.lineTo(ob.x + ob.w * .46, y);
            ctx.lineTo(ob.x + ob.w * .34, y + h); ctx.lineTo(ob.x + ob.w * .04, y + h); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = 'rgba(255,160,86,.12)'; ctx.lineWidth = 1;
            for (let s = 1; s < steps; s++) {
                const sy = y + h * s / steps + Math.sin(ob.seed + s) * 4;
                ctx.beginPath(); ctx.moveTo(ob.x + 3, sy); ctx.lineTo(ob.x + ob.w - 3, sy + 2); ctx.stroke();
            }
            const lipY = isTop ? y + h : y;
            ctx.fillStyle = '#8a4b27'; ctx.beginPath(); ctx.moveTo(ob.x - 6, lipY);
            for (let i = 0; i <= 7; i++) {
                const px = ob.x - 6 + (ob.w + 12) * i / 7;
                ctx.lineTo(px, lipY + (i % 2 ? 7 : 2) * (isTop ? 1 : -1));
            }
            ctx.lineTo(ob.x + ob.w + 5, lipY + (isTop ? -7 : 7));
            ctx.lineTo(ob.x - 5, lipY + (isTop ? -7 : 7)); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = 'rgba(255,190,105,.2)'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(ob.x, lipY); ctx.lineTo(ob.x + ob.w, lipY); ctx.stroke();
        }
        drawCliff(0, topH, true);
        drawCliff(botY, H - botY, false);
    } else if (ob.type === 'rock') {
        const rockGrad = ctx.createLinearGradient(ob.x, ob.y, ob.x + ob.w, ob.y + ob.h);
        rockGrad.addColorStop(0, '#9b562d'); rockGrad.addColorStop(.42, '#5a2c19'); rockGrad.addColorStop(1, '#24110c');
        ctx.fillStyle = rockGrad;
        ctx.beginPath();
        ctx.moveTo(ob.x, ob.y + ob.h);
        ctx.lineTo(ob.x + 2, ob.y + ob.h * .35);
        ctx.lineTo(ob.x + ob.w * .28, ob.y + ob.h * .08);
        ctx.lineTo(ob.x + ob.w * .57, ob.y);
        ctx.lineTo(ob.x + ob.w * .82, ob.y + ob.h * .18);
        ctx.lineTo(ob.x + ob.w, ob.y + ob.h * .43);
        ctx.lineTo(ob.x + ob.w - 2, ob.y + ob.h);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(230,139,75,.22)';
        ctx.beginPath();
        ctx.moveTo(ob.x + 2, ob.y + ob.h * .35); ctx.lineTo(ob.x + ob.w * .57, ob.y);
        ctx.lineTo(ob.x + ob.w * .42, ob.y + ob.h * .65); ctx.lineTo(ob.x + ob.w * .08, ob.y + ob.h);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(22,8,5,.45)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(ob.x + ob.w * .57, ob.y); ctx.lineTo(ob.x + ob.w * .48, ob.y + ob.h * .38);
        ctx.lineTo(ob.x + ob.w * .67, ob.y + ob.h * .63); ctx.stroke();
    } else if (ob.type === 'thopter') {
        ob.phase += 0.15;
        const cx = ob.x + ob.w / 2, cy = ob.y + ob.h / 2;
        const flap = Math.sin(ob.phase) * 6;
        ctx.strokeStyle = 'rgba(200,126,90,.62)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        [[-5,-4,-25,-11+flap],[-2,-2,-23,1-flap],[5,-4,27,-11-flap],[3,-2,25,1+flap]].forEach(function (w) {
            ctx.beginPath(); ctx.moveTo(cx+w[0],cy+w[1]); ctx.lineTo(cx+w[2],cy+w[3]); ctx.stroke();
        });
        const bodyGrad = ctx.createLinearGradient(ob.x, cy, ob.x + ob.w, cy);
        bodyGrad.addColorStop(0, '#211015'); bodyGrad.addColorStop(.55, '#6a2630'); bodyGrad.addColorStop(1, '#1a0b0d');
        ctx.fillStyle = bodyGrad; ctx.beginPath(); ctx.moveTo(ob.x,cy); ctx.quadraticCurveTo(cx,cy-ob.h*.65,ob.x+ob.w,cy);
        ctx.quadraticCurveTo(cx,cy+ob.h*.55,ob.x,cy); ctx.fill();
        ctx.fillStyle = '#ff3b25'; ctx.shadowBlur = 8; ctx.shadowColor = '#ff2a16';
        ctx.beginPath(); ctx.arc(ob.x + ob.w * .76, cy - 1, 2.4, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,128,75,.22)'; ctx.lineWidth = 1;
        for (let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(ob.x-4-i*8,cy+i-1);ctx.lineTo(ob.x-18-i*13,cy+i*2);ctx.stroke();}
    } else if (ob.type === 'geyser') {
        ob.phase += 0.05;
        const intensity = 0.6 + Math.sin(ob.phase) * 0.4;
        const grd = ctx.createLinearGradient(ob.x, ob.y, ob.x, H);
        grd.addColorStop(0, `rgba(255,213,140,${.08 * intensity})`);
        grd.addColorStop(.35, `rgba(222,150,76,${.42 * intensity})`);
        grd.addColorStop(1, `rgba(115,61,28,${.88 * intensity})`);
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.moveTo(ob.x + ob.w*.15,H); ctx.quadraticCurveTo(ob.x-8,ob.y+ob.h*.45,ob.x+ob.w*.42,ob.y);
        ctx.quadraticCurveTo(ob.x+ob.w+9,ob.y+ob.h*.45,ob.x+ob.w*.85,H); ctx.closePath(); ctx.fill();
        ctx.fillStyle = `rgba(255,213,142,${.45 * intensity})`;
        for (let i = 0; i < 18; i++) {
            const travel = (frameCount * (1.5+i%3) + i*31) % (ob.h+30);
            const py = H-travel, spread = 5 + travel/ob.h*ob.w*.8;
            const px = ob.x+ob.w/2+Math.sin(ob.seed+i*2.4)*spread;
            ctx.beginPath(); ctx.arc(px,py,1+(i%3)*.65,0,Math.PI*2);ctx.fill();
        }
    }
}

function drawSpiceItem(sp) {
    if (sp.collected) return;
    sp.sparkle += 0.08;
    const glow = .62 + Math.sin(sp.sparkle) * .28;
    ctx.save(); ctx.shadowBlur = 16; ctx.shadowColor = '#ffb52d';
    const aura = ctx.createRadialGradient(sp.x,sp.y,1,sp.x,sp.y,15);
    aura.addColorStop(0,`rgba(255,238,155,${glow*.55})`);aura.addColorStop(1,'rgba(255,150,20,0)');
    ctx.fillStyle=aura;ctx.beginPath();ctx.arc(sp.x,sp.y,15,0,Math.PI*2);ctx.fill();
    const crystal=ctx.createLinearGradient(sp.x-5,sp.y-7,sp.x+5,sp.y+7);
    crystal.addColorStop(0,'#fff4b0');crystal.addColorStop(.38,'#ffca35');crystal.addColorStop(1,'#b75b0d');
    ctx.fillStyle=crystal;ctx.beginPath();ctx.moveTo(sp.x,sp.y-7);ctx.lineTo(sp.x+5,sp.y-1);
    ctx.lineTo(sp.x+2,sp.y+7);ctx.lineTo(sp.x-4,sp.y+3);ctx.lineTo(sp.x-5,sp.y-2);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.72)';ctx.beginPath();ctx.moveTo(sp.x,sp.y-5);ctx.lineTo(sp.x+1,sp.y-1);ctx.lineTo(sp.x-3,sp.y+1);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle=`rgba(255,226,130,${glow})`;
    for(let i=0;i<3;i++){const a=sp.sparkle+i*Math.PI*2/3;ctx.beginPath();ctx.arc(sp.x+Math.cos(a)*10,sp.y+Math.sin(a)*7,1,0,Math.PI*2);ctx.fill();}
    ctx.restore();
}

// Anneau de secours (utilisé seulement tant que le sprite du corps n'est pas
// chargé) : garde le rendu identifiable au premier affichage de la page.
function drawFallbackRing(x, y, angle, r) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
    const armor = ctx.createLinearGradient(0, -r, 0, r);
    armor.addColorStop(0, '#b67a40'); armor.addColorStop(.42, '#754625'); armor.addColorStop(1, '#352012');
    ctx.fillStyle = armor;
    ctx.beginPath(); ctx.ellipse(0, 0, r * .52, r, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

// Angle de tangente locale au segment i : direction entre son voisin AVANT
// (i-1, ou lui-même pour la tête) et son voisin APRÈS (i+1, ou lui-même pour
// le dernier anneau). Un Math.atan2 exact, recalculé chaque frame à partir
// des positions RÉELLES (déjà lissées par l'historique de trajectoire dans
// tick()) — donc une rotation parfaitement continue, jamais quantifiée,
// jamais amortie une seconde fois ici. C'est cette même fonction qui oriente
// la tête ET chaque plaque du corps : aucune rupture de logique entre elles.
function segAngle(segs, i) {
    const a = segs[Math.max(0, i - 1)];
    const b = segs[Math.min(segs.length - 1, i + 1)];
    return Math.atan2(a.y - b.y, a.x - b.x);
}

// Facteur d'étirement d'un anneau : les plaques/tranches ont une taille
// pensée pour l'espacement HORIZONTAL entre anneaux (WORM_SPACING) — mais
// en plongeon/montée serrés, la distance RÉELLE (à vol d'oiseau) entre deux
// anneaux consécutifs dépasse largement cet espacement (le X reste toujours
// à WORM_SPACING, c'est le Y qui s'envole). Sans compensation, des plaques
// à taille fixe n'arrivent plus à se toucher → trous visibles. On mesure
// donc la distance réelle au voisin le plus loin (avant OU après) et on
// étire la plaque en conséquence — jamais plus courte qu'avant (stretch
// >= 1), donc aucun changement en mouvement plat/doux.
function segStretch(segs, i, x, y) {
    const prev = segs[Math.max(0, i - 1)];
    const next = segs[Math.min(segs.length - 1, i + 1)];
    const dPrev = Math.hypot(x - prev.x, y - prev.y);
    const dNext = Math.hypot(x - next.x, y - next.y);
    return Math.min(3, Math.max(1, Math.max(dPrev, dNext) / WORM_SPACING));
}

// Tranche i (0 = museau) du sprite de tête, à taille native (HEAD_SCALE
// uniforme, aucune déformation) — le bord DROIT du recadrage source (le
// museau) correspond à i=0, le bord GAUCHE (où le corps continue) à
// i=HEAD_SLICES-1, pour raccorder avec la première plaque de corps.
function drawHeadSlice(x, y, angle, i, stretch) {
    const srcSliceW = (RIDER_SPRITE_W - RIDER_SOURCE_X) / HEAD_SLICES;
    const srcX = RIDER_SOURCE_X + (HEAD_SLICES - 1 - i) * srcSliceW;
    const drawW = srcSliceW * HEAD_SCALE * stretch;
    const drawH = RIDER_SPRITE_H * HEAD_SCALE;
    if (riderSpriteReady) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
        ctx.drawImage(riderSprite, srcX, 0, srcSliceW, RIDER_SPRITE_H,
            -drawW / 2, -drawH * 0.596, drawW, drawH);
        ctx.restore();
    } else {
        drawFallbackRing(x, y, angle, segRadius(i));
    }
}

// Plaque de corps générique pour l'anneau i (au-delà des tranches de tête).
function drawBodyPlate(x, y, angle, i, stretch) {
    const r = segRadius(i); // même rayon que la collision → cohérence visuelle/physique
    const plateH = r * 2.15;
    const plateW = (plateH * BODY_SPRITE_W / BODY_SPRITE_H) * stretch;
    if (bodySegmentReady) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
        if (i % 2) ctx.scale(-1, 1);
        // L'asset brut est plus jaune que les plaques arrière de la tête.
        // Ce filtre l'aligne sur leur brun-ocre sombre sans toucher au sprite.
        ctx.filter = 'brightness(0.70) saturate(1.22) sepia(0.10)';
        ctx.drawImage(bodySegmentSprite, 0, 0, BODY_SPRITE_W, BODY_SPRITE_H,
            -plateW * .56, -plateH / 2, plateW * 1.12, plateH);
        ctx.restore();
    } else {
        drawFallbackRing(x, y, angle, r);
    }
}

function drawWorm() {
    const segs = worm.segs;
    const head = segs[0];
    const hr = WORM_HEAD_R;
    const bob = Math.sin(frameCount * .12) * (boosting ? 1.8 : .75);

    // Aura de boost, ancrée sur la tête, dessinée AVANT tout le reste
    // (dessous) pour ne jamais passer par-dessus les tranches/plaques.
    if (boosting) {
        const headAngle = segAngle(segs, 0);
        ctx.save(); ctx.translate(head.x, head.y + bob); ctx.rotate(headAngle);
        const auraG = ctx.createRadialGradient(-hr, 0, 2, -hr, 0, hr * 3);
        auraG.addColorStop(0, 'rgba(255,210,120,.23)'); auraG.addColorStop(1, 'rgba(255,120,35,0)');
        ctx.fillStyle = auraG; ctx.beginPath(); ctx.ellipse(-hr, 0, hr * 3.2, hr * 1.4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    // Chaque anneau — DU DERNIER AU PREMIER, donc la tête (i petit) se
    // dessine EN DERNIER, par-dessus le très léger chevauchement avec la
    // plaque voisine (volontaire, comme entre deux plaques de corps —
    // jamais de trou). Un seul système de coordonnées (worm.segs) pour
    // TOUT le ver, tête comprise : aucun calcul d'ancrage séparé, donc plus
    // de risque de décalage/écart, et la tête se courbe avec le reste
    // puisqu'elle est maintenant découpée en tranches comme le corps.
    for (let i = segs.length - 1; i >= 0; i--) {
        const s = segs[i];
        const angle = segAngle(segs, i);
        const y = s.y + bob;
        // Distances mesurées SANS le bob (décalage cosmétique partagé par
        // tous les anneaux, donc sans effet sur l'écart RÉEL entre eux) —
        // cohérent avec les positions brutes des voisins.
        const stretch = segStretch(segs, i, s.x, s.y);
        if (i < HEAD_SLICES) drawHeadSlice(s.x, y, angle, i, stretch);
        else drawBodyPlate(s.x, y, angle, i, stretch);
    }

    // Invincibilité flash
    if (worm.invincible > 0 && Math.floor(worm.invincible / 4) % 2 === 0) {
        ctx.fillStyle = 'rgba(255,200,50,0.15)';
        ctx.beginPath(); ctx.arc(head.x, head.y, hr + 8, 0, Math.PI * 2); ctx.fill();
    }
}

function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vx *= p.drag || 1; p.vy = p.vy * (p.drag || 1) + (p.gravity || 0);
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        if (p.glow) { ctx.shadowBlur = p.glow; ctx.shadowColor = p.color.replace(/,$/, '1)'); }
        ctx.fillStyle = p.color + Math.min(1, p.life / 30) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
    }
}

function drawSpeedEffects() {
    const baseIntensity = Math.max(0, (gameSpeed - BASE_SPEED) / (MAX_SPEED * BOOST_MULT - BASE_SPEED));
    const intensity = boosting ? Math.max(.55, baseIntensity) : baseIntensity * .24;
    if (intensity <= .03) return;
    ctx.save(); ctx.lineCap = 'round';
    for (let i = 0; i < (boosting ? 38 : 14); i++) {
        const span = W + 170;
        const rawX = i * 79 - distance * (1.2 + i % 3 * .13);
        const x = ((rawX % span) + span) % span - 85;
        const y = 25 + ((i * 61 + frameCount * (i % 2 ? .18 : -.12)) % (H - 60));
        const len = 16 + (i % 6) * 9 + intensity * 38;
        ctx.strokeStyle = `rgba(255,207,134,${(.045 + (i % 4) * .018) * intensity})`;
        ctx.lineWidth = .6 + (i % 3) * .4;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - len, y + 1.5); ctx.stroke();
    }
    if (boosting) {
        const edge = ctx.createLinearGradient(0,0,W,0);
        edge.addColorStop(0,'rgba(255,122,34,.14)');edge.addColorStop(.22,'rgba(255,122,34,0)');
        edge.addColorStop(.78,'rgba(255,122,34,0)');edge.addColorStop(1,'rgba(255,122,34,.1)');
        ctx.fillStyle=edge;ctx.fillRect(0,0,W,H);
    }
    ctx.restore();
}

function drawPostFX() {
    const twilight=Math.min(.52,distance/32000);
    if(twilight>0){ctx.fillStyle=`rgba(24,31,78,${twilight*.28})`;ctx.fillRect(0,0,W,H);}

}

// ============================================================
//  COLLISION
// ============================================================
// Un anneau (cx,cy,r) touche-t-il l'obstacle ? Renvoie true en cas de contact.
function segHitsObstacle(cx, cy, r, ob) {
    if (ob.type === 'pillars') {
        const topH = ob.gapY - ob.gapSize / 2;
        const botY = ob.gapY + ob.gapSize / 2;
        if (cx + r > ob.x && cx - r < ob.x + ob.w) {
            if (cy - r < topH || cy + r > botY) return true;
        }
        return false;
    } else if (ob.type === 'rock') {
        const rx = Math.max(ob.x + 4, Math.min(cx, ob.x + ob.w - 4));
        const ry = Math.max(ob.y + 4, Math.min(cy, ob.y + ob.h - 4));
        const dx = cx - rx, dy = cy - ry;
        return dx * dx + dy * dy < r * r;
    } else if (ob.type === 'thopter') {
        const dx = cx - (ob.x + ob.w/2), dy = cy - ob.y;
        return dx*dx + dy*dy < (r + 14) * (r + 14);
    } else if (ob.type === 'geyser') {
        return cx + r > ob.x && cx - r < ob.x + ob.w && cy + r > ob.y;
    }
    return false;
}

// Distance approx. entre l'anneau et l'obstacle, pour détecter les esquives serrées.
function segNearMiss(cx, cy, ob, margin) {
    if (ob.type === 'pillars') {
        const topH = ob.gapY - ob.gapSize / 2;
        const botY = ob.gapY + ob.gapSize / 2;
        if (cx + margin > ob.x && cx - margin < ob.x + ob.w) {
            return (cy - margin < topH) || (cy + margin > botY);
        }
        return false;
    } else if (ob.type === 'rock' || ob.type === 'geyser') {
        return cx + margin > ob.x && cx - margin < ob.x + ob.w &&
               cy + margin > ob.y && cy - margin < ob.y + (ob.h || 999);
    } else if (ob.type === 'thopter') {
        const dx = cx - (ob.x + ob.w/2), dy = cy - ob.y;
        return dx*dx + dy*dy < (margin + 14) * (margin + 14);
    }
    return false;
}

function checkCollisions() {
    if (worm.invincible > 0) return false;
    const segs = worm.segs;

    for (const ob of obstacles) {
        let hit = false, nearMissed = false;
        for (let i = 0; i < segs.length; i++) {
            const r = segRadius(i) - HIT_PAD;
            if (segHitsObstacle(segs[i].x, segs[i].y, r, ob)) { hit = true; break; }
        }
        if (hit) return true;
        if (!ob.closeCalled) {
            nearMissed = segNearMiss(segs[0].x, segs[0].y, ob, WORM_HEAD_R + CLOSE_CALL_MARGIN);
            if (nearMissed) {
                ob.closeCalled = true;
                combo++; comboTimer = 100;
                const bonus = 8 * Math.min(combo, 5);
                closeCallBonus += bonus;
                addFloatingText('FRÔLÉ +' + bonus, segs[0].x, segs[0].y - 24, C.gold);
                spawnBurst(segs[0].x, segs[0].y, 8, 45);
                sndCloseCall();
            }
        }
    }

    // Bordures (tête uniquement, le corps peut légèrement mordre le sable)
    const hr = WORM_HEAD_R - HIT_PAD;
    const head = segs[0];
    if (head.y - hr < 0 || head.y + hr > H - 25) return true;

    return false;
}

// ============================================================
//  TICK
// ============================================================
function tick() {
    if (gameState === 'dead') { frameCount++; deadSince++; if (hitFlash > 0) hitFlash--; return; }
    if (gameState === 'menu') { frameCount++; return; }
    if (gameState !== 'playing') return;
    frameCount++;

    gameSpeed = Math.min(MAX_SPEED, BASE_SPEED + frameCount * SPEED_ACCEL);

    // Boost (risque/récompense) : maintenir le bouton donne un coup de vitesse
    // tant que la jauge n'est pas vide — plus de distance/score, mais moins
    // de temps pour réagir aux obstacles.
    if (boostWanted && (boosting ? boostMeter > 0 : boostMeter > BOOST_MIN_USE)) {
        if (!boosting) sndBoost();
        boosting = true;
        boostMeter = Math.max(0, boostMeter - BOOST_DRAIN);
        gameSpeed = Math.min(MAX_SPEED * BOOST_MULT, gameSpeed * BOOST_MULT);
    } else {
        boosting = false;
        boostMeter = Math.min(100, boostMeter + BOOST_REGEN);
    }
    distance += gameSpeed;
    // Points de distance au multiplicateur COURANT (dépend de l'épice déjà
    // ramassée à cet instant) — grandir tôt dans la course rapporte plus
    // longtemps, exactement le pari risque/récompense visé.
    distanceScore += (gameSpeed / 8) * spiceMultiplier();

    if (comboTimer > 0) comboTimer--; else combo = 0;
    if (atmosphereFlash > 0) atmosphereFlash--;

    // Milestones
    const dm = Math.floor(distance / 10), nextMs = (milestone + 1) * 500;
    if (dm >= nextMs) {
        milestone++; sndMilestone(); atmosphereFlash = 42;
        addFloatingText(nextMs + ' m !', W/2, H/2-30, C.gold);
        spawnBurst(W/2, H/2, 34, 36);
    }

    // La tête suit la cible avec lissage — c'est la SEULE source de
    // mouvement ; tout le reste du corps se contente de rejouer son
    // historique (cf. bloc segments plus bas), aucun ressort séparé.
    worm.headY += (targetY - worm.headY) * HEAD_SMOOTH;
    worm.headY = Math.max(MARGIN_TOP + WORM_HEAD_R, Math.min(H - MARGIN_BOT - WORM_HEAD_R, worm.headY));
    worm.segs[0].y = worm.headY;
    pushTrail(distance, worm.segs[0].y);

    // L'inclinaison de la tête et de chaque plaque du corps n'est PLUS
    // calculée ici : drawWorm() la recalcule chaque frame via segAngle()
    // (Math.atan2 exact entre voisins), directement à partir de worm.segs.
    // Un seul endroit qui décide de l'orientation visuelle, jamais deux
    // systèmes qui se contredisent.

    // Chaque anneau relit DIRECTEMENT le Y de la tête d'il y a i*WORM_SPACING
    // de distance parcourue — reconstruction fidèle de l'ondulation réelle,
    // plus une micro-vague de vie quand le ver est presque immobile. Aucun
    // amortissement/écrêtage supplémentaire ici (cf. note plus haut).
    for (let i = 1; i < worm.segs.length; i++) {
        worm.segs[i].x = worm.segs[0].x - i * WORM_SPACING;
        worm.segs[i].y = yAtTravelDistance(distance - i * WORM_SPACING) + Math.sin(frameCount * 0.06 + i * 0.5) * WORM_WAVE_AMPLITUDE;
    }

    // Invincibilité
    if (worm.invincible > 0) worm.invincible--;

    // Spawn
    if (frameCount >= nextObstacle) { spawnObstacle(); spawnSpice(); }

    // Move obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        const ob = obstacles[i];
        ob.x -= gameSpeed;
        if (ob.type === 'thopter') {
            ob.y += ob.vy;
            if (ob.y < MARGIN_TOP + 20 || ob.y > H - MARGIN_BOT - 20) ob.vy *= -1;
        }
        if (!ob.passed && ob.x + (ob.w || 50) < worm.segs[0].x) ob.passed = true;
        if (ob.x < -80) obstacles.splice(i, 1);
    }

    // Spice
    const hx = worm.segs[0].x, hy = worm.segs[0].y;
    for (let i = spiceItems.length - 1; i >= 0; i--) {
        spiceItems[i].x -= gameSpeed;
        if (!spiceItems[i].collected) {
            const sp = spiceItems[i];
            const dx = sp.x - hx, dy = sp.y - hy;
            if (dx*dx + dy*dy < 500) {
                sp.collected = true; spiceCount++; sndSpice();
                spawnBurst(sp.x, sp.y, 16, 38);
                addFloatingText('+1', sp.x, sp.y - 10, C.spice);
                maybeGrowWorm();
            }
        }
        if (spiceItems[i].x < -30) spiceItems.splice(i, 1);
    }

    // Sand particles from worm movement (plus intenses en boost)
    if (frameCount % (boosting ? 2 : 4) === 0) {
        const tail = worm.segs[worm.segs.length - 1];
        spawnSand(tail.x, tail.y, boosting ? 3 : 1);
    }
    // Gerbe de sable additionnelle juste sous la tête pendant le boost —
    // le point d'action doit se sentir, pas seulement la queue.
    if (boosting && frameCount % 3 === 0) spawnSand(hx - 6, hy + 10, 2);
    if (frameCount % 8 === 0) sndRumble();

    // Collision
    if (checkCollisions()) {
        gameState = 'dead'; frameCount = 0; deadSince = 0; hitFlash = 14; sndCrash();
        shakeTimer = 15; shakeIntensity = 8;
        spawnBurst(worm.segs[0].x, worm.segs[0].y, 38, 12);
        finalScore = totalScore();
        if (finalScore > 0) {
            if (finalScore > bestScore) { bestScore = finalScore; localStorage.setItem('wormrider_best', String(finalScore)); }
            submitScore(finalScore);
        }
    } else {
        updateScoreDisplay();
    }
}

// ============================================================
//  DRAW
// ============================================================
function draw() {
    ctx.save();
    if (shakeTimer > 0) {
        shakeTimer--;
        ctx.translate((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity);
    }
    drawSky();
    for (const ob of obstacles) drawObstacle(ob);
    for (const sp of spiceItems) drawSpiceItem(sp);
    drawParticles();
    drawSpeedEffects();
    if (gameState === 'playing' || gameState === 'dead') drawWorm();
    if (gameState === 'menu') drawWorm();
    drawPostFX();
    drawFloatingTexts();
    if (gameState === 'playing') drawHUD();
    if (gameState === 'menu') drawMenu();
    if (gameState === 'dead') drawDead();
    ctx.restore();
}

// ============================================================
//  GAME LOOP
// ============================================================
function loop(now) {
    requestAnimationFrame(loop);
    if (!lastTime) { lastTime = now; return; }
    const dt = now - lastTime; lastTime = now;
    accumulator += Math.min(dt, 100);
    while (accumulator >= FRAME_DUR) { tick(); accumulator -= FRAME_DUR; }
    draw();
}

// ============================================================
//  INPUT
// ============================================================
function handleAction() {
    if (gameState === 'menu') {
        gameState = 'playing'; reset();
        if (!scoreSecret) fetchSecret();
        return;
    }
    if (gameState === 'dead') {
        if (deadSince > 40) { gameState = 'menu'; reset(); }
        return;
    }
}

canvas.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    if (gameState === 'playing') { boostWanted = true; return; }
    handleAction();
});
// pointermove/up sur window (pas juste le canvas) : si la souris sort du
// cadre du jeu on continue de piloter au lieu de figer le ver, et le boost
// se relâche même si le clic est relâché en dehors du canvas.
window.addEventListener('pointerup', function() { boostWanted = false; });
window.addEventListener('pointermove', function(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleY = H / rect.height;
    targetY = Math.max(0, Math.min(H, (e.clientY - rect.top) * scaleY));
    mouseActive = true;
});

document.addEventListener('keydown', function(e) {
    if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === 'playing') { boostWanted = true; return; }
        handleAction();
    }
    if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); targetY = Math.max(MARGIN_TOP, targetY - 15); }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); targetY = Math.min(H - MARGIN_BOT, targetY + 15); }
});
document.addEventListener('keyup', function(e) {
    if (e.code === 'Space') { boostWanted = false; }
});

// ============================================================
//  SCORES API
// ============================================================
async function submitScore(s) {
    if (!scoreSecret) await fetchSecret();
    if (!scoreSecret) return;
    const dur = Math.floor((Date.now() - startTime) / 1000);
    const hash = await sha256(GAME_ID + s + dur + scoreSecret);
    try {
        const r = await fetch('scores_api.php', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'submit', game: GAME_ID, score: s, duration: dur, hash })
        });
        const j = await r.json();
        if (!j.ok) console.warn('[worm_rider] score non enregistré côté serveur :', j.error || 'raison inconnue');
        if (j.ok && j.new_personal) { bestScore = s; localStorage.setItem('wormrider_best', String(s)); }
        loadLeaderboard();
    } catch (e) {}
}
async function sha256(msg) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function fetchSecret() {
    try {
        const r = await fetch('scores_api.php', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'token', game: GAME_ID })
        });
        const j = await r.json();
        if (j.ok) scoreSecret = j.secret;
    } catch (e) {}
}
async function loadLeaderboard() {
    try {
        const r = await fetch('scores_api.php?action=leaderboard&game=' + GAME_ID + '&limit=10&scope=weekly', { credentials: 'same-origin' });
        const j = await r.json();
        if (!j.ok) return;
        const me = localStorage.getItem('user') || '';
        const ul = document.getElementById('lb-list');
        if (!j.leaderboard.length) { ul.innerHTML = '<li style="color:#7c5e2a">Aucun score cette semaine</li>'; return; }
        ul.innerHTML = j.leaderboard.map(function(e, i) {
            var medals = ['\u{1F947}','\u{1F948}','\u{1F949}'];
            var rank = medals[i] || (i + 1);
            var isMe = e.player === me;
            return '<li class="'+(isMe?'me':'')+'"><span class="rank">'+rank+'</span><span class="name">'+esc(e.player)+'</span><span class="pts">'+e.score+'</span></li>';
        }).join('');
    } catch (e) {}
}
function esc(s) { return String(s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// ============================================================
//  INIT
// ============================================================
bestScore = parseInt(localStorage.getItem('wormrider_best') || '0', 10);
gameState = 'menu'; reset(); loadLeaderboard(); fetchSecret();
requestAnimationFrame(loop);
})();
