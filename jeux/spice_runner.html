<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Spice Runner — Hub Jeux</title>
<link rel="stylesheet" href="../style.css">
<style>
:root {
    --bg: #0a0402;
    --gold: #cda434;
    --text: #f5deb3;
    --muted: #7c5e2a;
}
html, body {
    overflow: hidden; height: 100%; margin: 0;
    touch-action: none; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
}
body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
        radial-gradient(ellipse at 50% 110%, rgba(154,89,21,0.2), transparent 48%),
        radial-gradient(ellipse at 50% -10%, rgba(205,164,52,0.08), transparent 42%),
        var(--bg);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
}
body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    opacity: .24;
    background-image:
        radial-gradient(circle at 20% 30%, rgba(255,210,130,.18) 0 1px, transparent 1.5px),
        radial-gradient(circle at 75% 65%, rgba(255,190,90,.12) 0 1px, transparent 1.5px);
    background-size: 83px 79px, 127px 113px;
    animation: ambient-drift 18s linear infinite;
}
@keyframes ambient-drift { to { transform: translate3d(-40px, 18px, 0); } }
#game-wrapper {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
}
canvas {
    border: 1px solid #3d2b16; border-radius: 8px;
    background: #160906;
    box-shadow: 0 18px 55px rgba(0,0,0,.62), 0 0 0 1px rgba(205,164,52,.08),
                0 0 70px rgba(205,164,52,0.1), 0 0 140px rgba(180,120,30,0.05);
    cursor: pointer; display: block;
}
.game-header {
    display: flex; align-items: center; gap: 14px;
    width: 100%; max-width: 800px; padding: 10px 16px; box-sizing: border-box;
    background: linear-gradient(110deg, rgba(8,3,1,.92), rgba(38,19,6,.78));
    border: 1px solid #4c351b; border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.35);
}
.game-header .back-link {
    color: var(--gold); text-decoration: none; font-weight: bold; font-size: 0.82em;
    border: 1px solid #7c5e2a; border-radius: 4px; padding: 6px 14px;
    background: linear-gradient(180deg, #2a1a0b, #1a0f05);
    transition: all 0.2s; white-space: nowrap;
}
.game-header .back-link:hover { background: var(--gold); color: #000; border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
.game-header .game-title {
    font-size: 1.15em; font-weight: bold; color: var(--gold);
    text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px rgba(205,164,52,0.3);
}
.score-live { font-size: 1.25em; color: #ffcc00; font-weight: bold; margin-left: auto; }

#leaderboard {
    position: absolute; right: -240px; top: 0; width: 220px;
    background: rgba(10,5,2,0.92); border: 1px solid #3d2b16;
    border-radius: 8px; padding: 16px 14px; font-size: 0.78em;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
#leaderboard h3 {
    margin: 0 0 12px; color: var(--gold); font-size: 0.95em;
    text-align: center; text-transform: uppercase; letter-spacing: 2px;
}
#lb-list { list-style: none; padding: 0; margin: 0; }
#lb-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; border-bottom: 1px solid rgba(61,43,22,0.4);
}
#lb-list li .rank { color: var(--muted); width: 26px; font-size: 0.9em; }
#lb-list li .name { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#lb-list li .pts { color: #ffcc00; font-weight: bold; min-width: 44px; text-align: right; }
#lb-list li.me .name { color: var(--gold); }
.controls-hint { font-size: 0.72em; color: var(--muted); text-align: center; opacity: 0.7; }

/* Responsive */
@media (max-width: 900px) {
    #leaderboard { position: static; width: 90vw; max-width: 500px; margin-top: 6px; }
}
@media (max-width: 820px) {
    canvas { width: 95vw !important; height: auto !important; }
    .game-header { width: 95vw; padding: 8px 10px; gap: 8px; }
    .game-header .game-title { font-size: .88em; }
    .controls-hint { width: 94vw; }
}
@media (prefers-reduced-motion: reduce) { body::before { animation: none; } }
</style>
</head>
<body>
<script src="../auth-guard.js"></script>
<div id="game-wrapper">
    <div class="game-header">
        <a href="hub.html" class="back-link">&larr; Hub Jeux</a>
        <span class="game-title">🏃 Spice Runner</span>
        <span class="score-live" id="score-display">0</span>
    </div>
    <canvas id="game" width="800" height="350"></canvas>
    <div class="controls-hint" id="controls-hint">
        [Espace / Clic] Sauter &nbsp;&bull;&nbsp; [&darr;] Glisser &nbsp;&bull;&nbsp; Double-saut en l'air
    </div>
    <div id="leaderboard">
        <h3>🗓️ Cette semaine</h3>
        <ul id="lb-list"><li style="color:var(--muted)">Chargement…</li></ul>
    </div>
</div>

<script>
;(function () {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 350;
const GAME_ID = 'spice_runner';

// Canvas haute densité : garde les coordonnées logiques 800×350 tout en
// dessinant avec assez de pixels pour les écrans Retina/4K.
const DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
canvas.width = Math.round(W * DPR);
canvas.height = Math.round(H * DPR);
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

const RUNNER_FRAME_SIZE = 256;
const RUNNER_FRAME_COUNT = 8;
const runnerSprite = new Image();
let runnerSpriteReady = false;
runnerSprite.onload = () => { runnerSpriteReady = true; };
runnerSprite.src = 'img/spice_runner_run.png';

const slideSprite = new Image();
let slideSpriteReady = false;
slideSprite.onload = () => { slideSpriteReady = true; };
slideSprite.src = 'img/spice_runner_slide.png';

// ──────────────────────────────────────────────
//  CONSTANTES PHYSIQUES
// ──────────────────────────────────────────────
const TARGET_FPS = 60, FRAME_DUR = 1000 / TARGET_FPS;
const GROUND_Y = H - 50;
// Gravité asymétrique, poussée franchement pour que ça se sente : montée
// lente qui flotte nettement au sommet (~18 ticks), chute rapide et nerveuse
// (~10 ticks) — au lieu d'une parabole symétrique. Hauteur de saut ~64px,
// inchangée par rapport à l'ancien réglage, seule la forme de l'arc bouge.
const GRAVITY_UP = 0.4, GRAVITY_DOWN = 1.3;
const JUMP_FORCE = -7.2, DOUBLE_JUMP = -6.5;
const JUMP_BUFFER_FRAMES = 6; // fenêtre de tolérance : un saut pressé juste avant
                               // l'atterrissage se déclenche quand même au sol
const SLIDE_DURATION = 35;
const BASE_SPEED = 3.5, MAX_SPEED = 8, SPEED_ACCEL = 0.0008;
const PLAYER_W = 28, PLAYER_H = 48, PLAYER_H_SLIDE = 22, PLAYER_X = 100;
const HIT_PAD = 6;
const POWERUP_PICKUP_RADIUS = 42;
const SHIELD_DURATION = 600, MAGNET_DURATION = 300, BOOST_DURATION = 180;
const PIPE_W = 48, GAP = 175;

// ──────────────────────────────────────────────
//  PALETTE JOUR / NUIT (avec interpolation)
// ──────────────────────────────────────────────
const DAY = {
    skyTop: '#4a2010', skyHigh: '#8b3a18', skyMid: '#c06028', skyLow: '#e0a040', skyHorizon: '#f0c878',
    mountain: '#3a1e10', mountainLight: '#5a3020',
    duneFar: '#9a6a38', duneMid: '#b88545', duneNear: '#c99850',
    ground: '#d2a64a', groundDark: '#a07828',
};
const NIGHT = {
    skyTop: '#0a0a1e', skyHigh: '#181835', skyMid: '#252545', skyLow: '#353560', skyHorizon: '#505080',
    mountain: '#151028', mountainLight: '#251838',
    duneFar: '#2a2040', duneMid: '#3a3050', duneNear: '#453858',
    ground: '#3a3055', groundDark: '#282045',
};
const PAL_COMMON = {
    sun: '#fff5d0', rock: '#4a3018', rockLight: '#6b4a2a', rockShadow: '#2a1808',
    playerBody: '#2e1a0c', playerCape: '#4a3020', playerSkin: '#c49a6c', eyes: '#4488cc',
    spice: '#ffd700', gold: '#ffcc00', red: '#c44', white: '#f5deb3',
};

function lerpColor(a, b, t) {
    const pa = parseInt, ha = a.slice(1), hb = b.slice(1);
    const r = Math.round(pa(ha.substr(0,2),16)*(1-t) + pa(hb.substr(0,2),16)*t);
    const g = Math.round(pa(ha.substr(2,2),16)*(1-t) + pa(hb.substr(2,2),16)*t);
    const bl= Math.round(pa(ha.substr(4,2),16)*(1-t) + pa(hb.substr(4,2),16)*t);
    return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}
function cc(key) { return lerpColor(DAY[key], NIGHT[key], nightPhase); }

// ──────────────────────────────────────────────
//  AUDIO (optimisé)
// ──────────────────────────────────────────────
let audioCtx = null;
function audCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}
function tone(freq, dur, vol=0.07, type='sine') {
    try {
        const a = audCtx(), t = a.currentTime;
        const o = a.createOscillator(), g = a.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        o.frequency.exponentialRampToValueAtTime(freq*0.5, t+dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t+dur);
        o.connect(g); g.connect(a.destination);
        o.start(t); o.stop(t+dur);
    } catch(e){}
}
function sndJump()      { tone(280, 0.1, 0.1, 'triangle'); setTimeout(()=>tone(480, 0.06, 0.08), 30); }
function sndDoubleJump() { tone(420, 0.1, 0.1, 'sine'); setTimeout(()=>tone(700, 0.08, 0.08), 40); }
function sndSlide()     { tone(150, 0.08, 0.05, 'sawtooth'); }
function sndSpice()     { tone(880, 0.06, 0.08); setTimeout(()=>tone(1100, 0.06, 0.06), 40); }
function sndCloseCall() { tone(600, 0.06, 0.06, 'sawtooth'); }
function sndMilestone() {
    [523, 659, 784, 1047].forEach((f,i) => setTimeout(()=>tone(f,0.12,0.08), i*70));
}
function sndCrash() {
    try {
        const a = audCtx(), t = a.currentTime;
        const len = a.sampleRate * 0.25;
        const buf = a.createBuffer(1, len, a.sampleRate);
        const d = buf.getChannelData(0);
        for (let i=0; i<len; i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len,2.5);
        const src = a.createBufferSource(), g = a.createGain();
        src.buffer = buf; g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.25);
        src.connect(g); g.connect(a.destination); src.start(t);
        tone(70, 0.2, 0.15, 'sine');
    } catch(e){}
}
function sndPowerup()   { [660,880,1100].forEach((f,i)=>setTimeout(()=>tone(f,0.08,0.1), i*60)); }
function sndDrone()     { tone(100, 0.25, 0.04, 'sawtooth'); }
function sndWarning()   { for (let i=0; i<3; i++) tone(800, 0.06, 0.06, 'square', i*0.12); }
function sndBoost()     { tone(200, 0.2, 0.08, 'sawtooth'); }

// ──────────────────────────────────────────────
//  ÉTAT GLOBAL
// ──────────────────────────────────────────────
let player, obstacles, spiceItems, powerups, dustTrail, floatingTexts;
let distance, spiceCount, combo, comboTimer, bestScore, gameState, frameCount;
let gameSpeed, startTime, scoreSecret;
let shakeTimer = 0, shakeIntensity = 0;
let milestone = 0, nightPhase = 0;
let magnetTimer = 0, boostTimer = 0;
let finalScore = 0, finalDist = 0, finalSpice = 0;
let lastTime = 0, accumulator = 0;
let missiles = [];
let stars = [], mountains = [], duneFarPts = [], duneMidPts = [], duneNearPts = [];
let skyWisps = [], ambientSand = [];
let nextObstacle = 0;
let jumpBufferTimer = 0;

// ──────────────────────────────────────────────
//  INIT / RESET
// ──────────────────────────────────────────────
function initStars() {
    stars = [];
    for (let i=0; i<50; i++) {
        stars.push({
            x: Math.random()*W, y: Math.random()*(GROUND_Y-80),
            r: 0.4+Math.random()*1.2, twinkle: Math.random()*Math.PI*2,
            speed: 0.01+Math.random()*0.03,
        });
    }
    skyWisps = Array.from({ length: 7 }, (_, i) => ({
        x: Math.random() * W, y: 45 + Math.random() * 150,
        w: 90 + Math.random() * 170, speed: .08 + Math.random() * .12,
        alpha: .025 + Math.random() * .04, phase: i * 1.7,
    }));
    ambientSand = Array.from({ length: 42 }, () => ({
        x: Math.random() * W, y: 80 + Math.random() * (GROUND_Y - 80),
        size: .4 + Math.random() * 1.3, speed: .25 + Math.random() * .75,
        alpha: .08 + Math.random() * .24,
    }));
}
function generateTerrain() {
    mountains = [];
    const mountainCount = 14;
    const spacing = (W + 200) / mountainCount;
    for (let i = 0; i < mountainCount; i++) {
        mountains.push({
            x: i * spacing - 100,
            w: 70 + Math.random() * 100,
            h: 40 + Math.random() * 60,
            peak: .28 + Math.random() * .34,
            shoulder: .55 + Math.random() * .18,
            notch: .08 + Math.random() * .12,
            seed: Math.random() * Math.PI * 2,
        });
    }

    const createDunePoints = (n, baseY) => {
        const arr = [];
        const sp = (W + 200) / n;
        for (let i = 0; i <= n; i++) {
            arr.push({
                x: i * sp - 100,
                baseY: baseY - Math.random() * 25
            });
        }
        return arr;
    };
    duneFarPts = createDunePoints(14, GROUND_Y - 30);
    duneMidPts = createDunePoints(16, GROUND_Y - 15);
    duneNearPts = createDunePoints(18, GROUND_Y - 5);
}

function reset() {
    player = {
        x: PLAYER_X, y: GROUND_Y-PLAYER_H, vy: 0, w: PLAYER_W, h: PLAYER_H,
        grounded: true, canDoubleJump: true, sliding: false, slideTimer: 0,
        runFrame: 0, runTimer: 0, runAnim: 0, shield: false, shieldTimer: 0,
    };
    obstacles = []; spiceItems = []; powerups = []; dustTrail = []; floatingTexts = []; missiles = [];
    distance = 0; spiceCount = 0; combo = 0; comboTimer = 0; frameCount = 0;
    gameSpeed = BASE_SPEED; nextObstacle = 80; milestone = 0;
    shakeTimer = 0; magnetTimer = 0; boostTimer = 0; nightPhase = 0;
    finalScore = 0; finalDist = 0; finalSpice = 0; jumpBufferTimer = 0;
    startTime = Date.now();
    generateTerrain();
    updateScoreDisplay();
}
function totalScore() { return Math.floor(distance/10) + spiceCount*5; }
function updateScoreDisplay() { document.getElementById('score-display').textContent = totalScore(); }

// ──────────────────────────────────────────────
//  PARTICULES & TEXTES
// ──────────────────────────────────────────────
function spawnDust(x, y, count) {
    for (let i=0; i<count; i++) {
        dustTrail.push({
            x, y: y-Math.random()*4,
            vx: -Math.random()*2-1, vy: -Math.random()*2,
            life: 18+Math.random()*15, maxLife: 33,
            size: 1.5+Math.random()*2.5, hue: 35+Math.random()*15,
        });
    }
}
function addFloatingText(text, x, y, color) {
    floatingTexts.push({ text, x, y, vy: -1.5, life: 45, color, alpha: 1 });
}

// ──────────────────────────────────────────────
//  JEU : OBSTACLES & CO
// ──────────────────────────────────────────────
function distMeters() { return Math.floor(distance/10); }

function spawnObstacle() {
    const dm = distMeters();
    const minGap = Math.max(55, 100 - dm*0.25);
    nextObstacle = frameCount + minGap + Math.random()*45;
    let r = Math.random();
    const hasDrones = dm >= 450, hasMissiles = dm >= 900;

    if (hasMissiles && r < 0.08) { spawnMissile(); return; }
    if (hasDrones && r < 0.18) {
        const bands = [GROUND_Y-28, GROUND_Y-55, GROUND_Y-90];
        obstacles.push({
            type: 'drone', x: W+40, y: bands[Math.floor(Math.random()*3)],
            w: 40, h: 18, phase: 0, passed: false, closeCalled: false,
        });
        if (Math.random()<0.3) sndDrone();
        return;
    }
    // Rock cluster
    if (dm >= 250 && r < 0.25) {
        let cx = W+30;
        const count = 2 + (Math.random()<0.3?1:0);
        for (let i=0; i<count; i++) {
            const w = 18+Math.random()*18, h = 22+Math.random()*22;
            obstacles.push({ type:'rock', x:cx, y:GROUND_Y-h, w, h, passed:false, closeCalled:false });
            cx += w+8+Math.random()*10;
        }
        return;
    }
    // Obstacle unique
    let type, w, h, y;
    if (r < 0.4) {
        type = 'rock'; w = 22+Math.random()*22; h = 28+Math.random()*28; y = GROUND_Y-h;
    } else if (r < 0.58) {
        type = 'overhang'; w = 55+Math.random()*25; h = 18;
        // Traverse relevée pour accueillir le sprite de glissade à la même
        // échelle anatomique que le coureur, tout en bloquant un joueur debout.
        y = GROUND_Y-PLAYER_H_SLIDE-31-Math.random()*8;
    } else if (r < 0.76) {
        type = 'crevasse'; w = 35+Math.random()*28; h = 50; y = GROUND_Y;
    } else {
        type = 'worm'; w = 30; h = 50+Math.random()*35; y = GROUND_Y-h;
    }
    obstacles.push({ type, x:W+30, y, w, h, phase:Math.random()*Math.PI*2, passed:false, closeCalled:false });
}

function spawnMissile() {
    const y = 30+Math.random()*(GROUND_Y-80);
    missiles.push({ x:W+200, y, w:35, h:10, warning:90, speed:gameSpeed*2.5+3 });
    sndWarning();
}

function spawnSpice() {
    if (Math.random()>0.45) return;
    const count = 3+Math.floor(Math.random()*5);
    const baseY = GROUND_Y-50-Math.random()*55;
    const pattern = Math.random()<0.5?'line':'arc';
    for (let i=0; i<count; i++) {
        const sx = W+40+i*28;
        const sy = pattern==='line'?baseY:baseY-Math.sin(i/count*Math.PI)*40;
        spiceItems.push({ x:sx, y:sy, collected:false, sparkle:Math.random()*Math.PI*2 });
    }
}

function spawnPowerup() {
    if (Math.random()>0.12) return;
    const types = ['shield','magnet','boost'];
    const pu = types[Math.floor(Math.random()*types.length)];
    powerups.push({ type:pu, x:W+60, y:GROUND_Y-60-Math.random()*50, collected:false, phase:Math.random()*Math.PI*2 });
}

// ──────────────────────────────────────────────
//  ACTIONS JOUEUR
// ──────────────────────────────────────────────
function playerJump() {
    if (gameState!=='playing') return;
    if (player.sliding) return;
    if (player.grounded) {
        player.vy=JUMP_FORCE; player.grounded=false; player.canDoubleJump=true;
        sndJump(); spawnDust(player.x+player.w/2, GROUND_Y, 6);
        jumpBufferTimer = 0;
    } else if (player.canDoubleJump) {
        player.vy=DOUBLE_JUMP; player.canDoubleJump=false;
        sndDoubleJump(); spawnDust(player.x+player.w/2, player.y+player.h, 4);
    } else {
        // Saut pressé trop tôt (juste avant l'atterrissage) : on le mémorise
        // pour qu'il se déclenche automatiquement dès que le joueur touche le sol.
        jumpBufferTimer = JUMP_BUFFER_FRAMES;
    }
}
function playerSlide() {
    if (gameState!=='playing' || !player.grounded || player.sliding) return;
    player.sliding=true; player.slideTimer=SLIDE_DURATION;
    player.h=PLAYER_H_SLIDE; player.y=GROUND_Y-PLAYER_H_SLIDE;
    sndSlide();
}
function isOverhangAbove() {
    const px1=player.x-2, px2=player.x+player.w+2;
    const headY=GROUND_Y-PLAYER_H;
    for (const ob of obstacles) {
        if (ob.type!=='overhang') continue;
        if (ob.x<px2 && ob.x+ob.w>px1 && ob.y<headY+PLAYER_H && ob.y+ob.h+10>headY) return true;
    }
    return false;
}
function playerStopSlide() {
    if (!player.sliding) return;
    if (isOverhangAbove()) { player.slideTimer=5; return; }
    player.sliding=false; player.h=PLAYER_H; player.y=GROUND_Y-PLAYER_H; player.slideTimer=0;
}

// ──────────────────────────────────────────────
//  COLLISIONS
// ──────────────────────────────────────────────
function playerBox() {
    return { x:player.x+HIT_PAD, y:player.y+HIT_PAD, w:player.w-HIT_PAD*2, h:player.h-HIT_PAD*2 };
}
function boxOverlap(a,b) { return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function checkCollisions() {
    if (boostTimer>0) return false;
    const pb = playerBox();
    for (const ob of obstacles) {
        if (ob.neutralized) continue;
        let obBox;
        if (ob.type==='crevasse') {
            if (player.grounded && pb.x+pb.w>ob.x+6 && pb.x<ob.x+ob.w-6) {
                if (player.shield) {
                    player.shield=false; player.shieldTimer=0;
                    ob.neutralized=true; ob.x=-200;
                    addFloatingText('IMPACT ABSORBÉ !', player.x, player.y-10, '#66AAFF');
                    shakeTimer=5; shakeIntensity=3;
                    continue;
                }
                return true;
            }
            continue;
        } else if (ob.type==='worm') {
            obBox = { x:ob.x+ob.w/2-10, y:ob.y, w:20, h:ob.h };
        } else if (ob.type==='drone') {
            obBox = { x:ob.x+4, y:ob.y+2, w:ob.w-8, h:ob.h-4 };
        } else if (ob.type==='overhang') {
            // La traverse est désormais plus haute visuellement. Sa zone utile
            // descend assez pour arrêter le coureur debout, mais reste largement
            // au-dessus de la boîte basse de la glissade.
            obBox = { x:ob.x+5, y:ob.y, w:ob.w-10, h:ob.h+6 };
        } else {
            obBox = { x:ob.x+3, y:ob.y+3, w:ob.w-6, h:ob.h-3 };
        }
        if (boxOverlap(pb, obBox)) {
            if (player.shield) {
                player.shield=false; player.shieldTimer=0;
                // L'obstacle absorbé doit disparaître : "passed" seul le
                // laissait chevaucher puis tuer le joueur au tick suivant.
                ob.passed=true; ob.neutralized=true; ob.x=-200;
                addFloatingText('IMPACT ABSORBÉ !', player.x, player.y-10, '#66AAFF');
                shakeTimer=5; shakeIntensity=3;
                continue;
            }
            return true;
        }
        if (!ob.passed && !ob.closeCalled) {
            const m=14;
            const cb = { x:obBox.x-m, y:obBox.y-m, w:obBox.w+m*2, h:obBox.h+m*2 };
            if (boxOverlap(pb, cb) && !boxOverlap(pb, obBox)) ob.closeCalled=true;
        }
    }
    for (const m of missiles) {
        if (m.warning>0) continue;
        const mb = { x:m.x, y:m.y, w:m.w, h:m.h };
        if (boxOverlap(pb, mb)) {
            if (player.shield) {
                player.shield=false; player.shieldTimer=0;
                addFloatingText('IMPACT ABSORBÉ !', player.x, player.y-10, '#66AAFF');
                shakeTimer=5; shakeIntensity=3; m.x=-200;
                continue;
            }
            return true;
        }
    }
    return false;
}

// ──────────────────────────────────────────────
//  MISE À JOUR DU TERRAIN (appelée dans tick)
// ──────────────────────────────────────────────
function updateLayer(points, speedFactor, layerWidth) {
    const vel = (gameState === 'playing' ? gameSpeed : BASE_SPEED) * speedFactor;
    for (let p of points) p.x -= vel;
    while (points.length > 0 && points[0].x < -150) {
        const first = points.shift();
        const last = points[points.length - 1];
        const newX = last.x + layerWidth / (points.length + 1);
        first.x = newX;
        first.baseY = GROUND_Y - 5 - Math.random() * 20;
        points.push(first);
    }
}

function updateTerrain() {
    const mountainSpacing = (W + 200) / mountains.length;
    updateLayer(mountains, 0.15, mountains.length * mountainSpacing);
    if (duneFarPts.length > 0) updateLayer(duneFarPts, 0.25, duneFarPts.length * ((W + 200) / (duneFarPts.length - 1)));
    if (duneMidPts.length > 0) updateLayer(duneMidPts, 0.5,  duneMidPts.length * ((W + 200) / (duneMidPts.length - 1)));
    if (duneNearPts.length > 0) updateLayer(duneNearPts, 0.8, duneNearPts.length * ((W + 200) / (duneNearPts.length - 1)));
}

// ──────────────────────────────────────────────
//  TICK (physique à 60 fps)
// ──────────────────────────────────────────────
function tick() {
    if (gameState === 'dead') { frameCount++; return; }
    if (gameState !== 'playing') return;
    frameCount++;

    const baseSpd = Math.min(MAX_SPEED, BASE_SPEED + frameCount * SPEED_ACCEL);
    gameSpeed = boostTimer > 0 ? Math.min(MAX_SPEED * 1.3, baseSpd + 3) : baseSpd;
    distance += gameSpeed;

    // Animation indépendante du rafraîchissement de l'écran : 8 à 12 i/s.
    // Elle progresse dans le tick physique fixe, jamais dans drawPlayer().
    if (player.grounded && !player.sliding) {
        const speedRatio = Math.min(1, Math.max(0, (gameSpeed - BASE_SPEED) / (MAX_SPEED - BASE_SPEED)));
        // Huit poses : deux appuis complets et leurs transitions. Le cycle
        // reste volontairement sous deux tours par seconde à vitesse normale.
        player.runAnim = (player.runAnim + (11 + speedRatio * 3) / TARGET_FPS) % RUNNER_FRAME_COUNT;
    }

    // Cycle jour/nuit
    const cycle = (distance % 14000) / 14000;
    if (cycle < 0.4) nightPhase = 0;
    else if (cycle < 0.5) nightPhase = (cycle - 0.4) / 0.1;
    else if (cycle < 0.9) nightPhase = 1;
    else nightPhase = 1 - (cycle - 0.9) / 0.1;

    const dm = distMeters(), nextMs = (milestone + 1) * 500;
    if (dm >= nextMs) { milestone++; sndMilestone(); addFloatingText(nextMs + ' m !', W/2, H/2-30, PAL_COMMON.gold); }

    // Physique joueur (gravité asymétrique : plus légère en montée, plus lourde en chute)
    if (!player.grounded) {
        player.vy += (player.vy < 0 ? GRAVITY_UP : GRAVITY_DOWN);
        player.y += player.vy;
        if (player.y >= GROUND_Y - player.h) {
            player.y = GROUND_Y - player.h; player.vy = 0;
            player.grounded = true; player.canDoubleJump = true;
            spawnDust(player.x + player.w/2, GROUND_Y, 3);
            if (jumpBufferTimer > 0) { jumpBufferTimer = 0; playerJump(); }
        }
    }
    if (jumpBufferTimer > 0) jumpBufferTimer--;
    if (player.sliding) {
        // Une touche maintenue doit conserver la posture basse. L'ancien
        // minuteur relevait le joueur après ~0,58 s même avec ↓ encore pressé.
        if (slideHeld || isOverhangAbove()) player.slideTimer = 5;
        else {
            player.slideTimer--;
            if (player.slideTimer <= 0) playerStopSlide();
        }
    }
    if (comboTimer > 0) comboTimer--; else combo = 0;

    // Mise à jour du décor (avant le déplacement des obstacles)
    updateTerrain();

    // Spawn
    if (frameCount >= nextObstacle) { spawnObstacle(); spawnSpice(); spawnPowerup(); }

    // Déplacer obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        const ob = obstacles[i];
        const spd = ob.type === 'drone' ? gameSpeed * 1.15 : gameSpeed;
        ob.x -= spd;
        if (!ob.passed && ob.x + ob.w < player.x) {
            ob.passed = true;
            if (ob.closeCalled) {
                combo++; comboTimer = 120;
                const bonus = 5 * combo; spiceCount += bonus;
                addFloatingText('CLOSE CALL +' + bonus, player.x + 30, player.y - 20, '#FF8800');
                sndCloseCall();
            }
        }
        if (ob.x < -120) obstacles.splice(i, 1);
    }
    // Missiles
    for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i];
        if (m.warning > 0) { m.warning--; continue; }
        m.x -= m.speed;
        if (m.x < -100) missiles.splice(i, 1);
    }
    // Épice & aimant
    const pcx = player.x + player.w/2, pcy = player.y + player.h/2;
    const magnetRange = magnetTimer > 0 ? 150 : 0;
    for (let i = spiceItems.length - 1; i >= 0; i--) {
        const sp = spiceItems[i];
        sp.x -= gameSpeed;
        if (!sp.collected) {
            const dx = sp.x - pcx, dy = sp.y - pcy;
            const dist2 = dx*dx + dy*dy;
            if (magnetRange > 0 && dist2 < magnetRange * magnetRange) {
                sp.x -= dx * 0.08; sp.y -= dy * 0.08;
            }
            if (dist2 < 450) {
                sp.collected = true; spiceCount++; sndSpice();
                addFloatingText('+1', sp.x, sp.y - 10, PAL_COMMON.spice);
            }
        }
        if (sp.x < -20) spiceItems.splice(i, 1);
    }
    // Power-ups
    for (let i = powerups.length - 1; i >= 0; i--) {
        const pu = powerups[i];
        pu.x -= gameSpeed;
        if (!pu.collected) {
            // Même centre que le dessin animé du bonus. L'ancien rayon de
            // 22 px était nettement plus petit que le sprite du personnage.
            const dx = pu.x - pcx, dy = (pu.y + Math.sin(pu.phase)*4) - pcy;
            if (dx*dx + dy*dy < POWERUP_PICKUP_RADIUS*POWERUP_PICKUP_RADIUS) {
                pu.collected = true; sndPowerup();
                if (pu.type === 'shield') { player.shield = true; player.shieldTimer = SHIELD_DURATION; addFloatingText('BOUCLIER · 1 IMPACT', pu.x, pu.y - 15, '#66AAFF'); }
                else if (pu.type === 'magnet') { magnetTimer = MAGNET_DURATION; addFloatingText('AIMANT · 5 s', pu.x, pu.y - 15, '#CC66FF'); }
                else if (pu.type === 'boost') { boostTimer = BOOST_DURATION; sndBoost(); addFloatingText('BOOST · 3 s', pu.x, pu.y - 15, '#FFCC00'); }
            }
        }
        if (pu.x < -30) powerups.splice(i, 1);
    }

    if (checkCollisions()) {
        gameState = 'dead'; frameCount = 0; sndCrash();
        shakeTimer = 12; shakeIntensity = 8;
        finalScore = totalScore(); finalDist = distMeters(); finalSpice = spiceCount;
        if (finalScore > bestScore) { bestScore = finalScore; localStorage.setItem('spice_best', String(finalScore)); }
        submitScore(finalScore);
    } else {
        // Décompte après les collisions : le dernier tick encore affiché
        // comme actif protège réellement le joueur.
        if (player.shield && player.shieldTimer > 0 && --player.shieldTimer === 0) {
            player.shield = false;
            addFloatingText('BOUCLIER ÉPUISÉ', player.x+14, player.y-12, '#8CBFFF');
            tone(190,.12,.055,'triangle');
        }
        if (magnetTimer > 0 && --magnetTimer === 0)
            addFloatingText('AIMANT TERMINÉ', player.x+14, player.y-12, '#CC88FF');
        if (boostTimer > 0 && --boostTimer === 0)
            addFloatingText('BOOST TERMINÉ', player.x+14, player.y-12, '#FFD05A');
        updateScoreDisplay();
    }
}

// ──────────────────────────────────────────────
//  DESSIN
// ──────────────────────────────────────────────
function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    grad.addColorStop(0, cc('skyTop'));
    grad.addColorStop(0.3, cc('skyHigh'));
    grad.addColorStop(0.6, cc('skyMid'));
    grad.addColorStop(0.85, cc('skyLow'));
    grad.addColorStop(1, cc('skyHorizon'));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, GROUND_Y);

    if (nightPhase > 0.3) {
        const alpha = (nightPhase - 0.3) * 1.4;
        ctx.fillStyle = `rgba(255,255,220,${alpha})`;
        for (const s of stars) {
            s.twinkle += s.speed;
            const twinkle = 0.4 + Math.abs(Math.sin(s.twinkle)) * 0.6;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r * twinkle, 0, Math.PI*2);
            ctx.fill();
        }
    }
    // Soleil
    const sunAlpha = 1 - nightPhase;
    if (sunAlpha > 0.1) {
        const sx = 650, sy = 60;
        const glow = ctx.createRadialGradient(sx, sy, 8, sx, sy, 80);
        glow.addColorStop(0, `rgba(255,240,200,${0.9*sunAlpha})`);
        glow.addColorStop(0.4, `rgba(255,200,100,${0.4*sunAlpha})`);
        glow.addColorStop(1, 'rgba(255,100,20,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(sx, sy, 80, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = PAL_COMMON.sun;
        ctx.beginPath(); ctx.arc(sx, sy, 16, 0, Math.PI*2); ctx.fill();
    }
    // Lune
    if (nightPhase > 0.5) {
        const ma = (nightPhase - 0.5) * 2;
        const lx = 180, ly = 50;
        ctx.fillStyle = `rgba(200,210,230,${ma*0.2})`;
        ctx.beginPath(); ctx.arc(lx, ly, 35, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = `rgba(220,225,240,${ma})`;
        ctx.beginPath(); ctx.arc(lx, ly, 18, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = cc('skyTop');
        ctx.beginPath(); ctx.arc(lx+8, ly-4, 16, 0, Math.PI*2); ctx.fill();
    }
    // Brume de chaleur
    ctx.strokeStyle = `rgba(255,220,160,${0.06*(1-nightPhase)})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
        const yy = GROUND_Y - 60 + i * 12;
        ctx.beginPath();
        for (let x = 0; x < W; x += 6) {
            const dy = Math.sin((x + frameCount*0.8 + i*100) * 0.02) * 2;
            if (x === 0) ctx.moveTo(x, yy + dy); else ctx.lineTo(x, yy + dy);
        }
        ctx.stroke();
    }
}

function drawAtmosphere() {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (const wisp of skyWisps) {
        wisp.x -= wisp.speed * (gameState === 'playing' ? gameSpeed / BASE_SPEED : .35);
        if (wisp.x + wisp.w < -20) wisp.x = W + 40;
        const y = wisp.y + Math.sin(frameCount * .006 + wisp.phase) * 5;
        const g = ctx.createLinearGradient(wisp.x, y, wisp.x + wisp.w, y);
        g.addColorStop(0, 'rgba(255,205,135,0)');
        g.addColorStop(.5, `rgba(255,205,135,${wisp.alpha * (1-nightPhase*.7)})`);
        g.addColorStop(1, 'rgba(255,205,135,0)');
        ctx.strokeStyle = g; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(wisp.x, y);
        ctx.bezierCurveTo(wisp.x+wisp.w*.25, y-4, wisp.x+wisp.w*.7, y+5, wisp.x+wisp.w, y);
        ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    for (const mote of ambientSand) {
        mote.x -= mote.speed * (gameState === 'playing' ? gameSpeed / BASE_SPEED : .3);
        if (mote.x < -4) { mote.x = W + Math.random()*40; mote.y = 90 + Math.random()*(GROUND_Y-90); }
        ctx.fillStyle = `rgba(255,215,145,${mote.alpha * (1-nightPhase*.45)})`;
        ctx.fillRect(mote.x, mote.y, mote.size * 2.4, mote.size);
    }
    ctx.restore();
}

function drawMountains() {
    const base = GROUND_Y - 20;
    ctx.save();

    // Une silhouette atmosphérique très douce évite l'ancienne succession
    // de triangles identiques et donne de la profondeur à l'horizon.
    ctx.globalAlpha = .28;
    ctx.fillStyle = cc('mountainLight');
    ctx.beginPath(); ctx.moveTo(-30, base);
    for (const m of mountains) {
        const px = m.x + m.w*m.peak;
        ctx.lineTo(m.x-m.w*.18, base);
        ctx.lineTo(px, base-m.h*.72);
        ctx.lineTo(m.x+m.w*1.16, base);
    }
    ctx.lineTo(W+40, base); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;

    for (const m of mountains) {
        const x0=m.x, x1=m.x+m.w, px=x0+m.w*m.peak;
        const py=base-m.h, sx=x0+m.w*m.shoulder;
        const sy=base-m.h*(.7-m.notch);

        // Masse sombre, irrégulière et légèrement érodée.
        ctx.fillStyle = cc('mountain');
        ctx.beginPath();
        ctx.moveTo(x0,base);
        ctx.lineTo(x0+m.w*.12,base-m.h*.24);
        ctx.lineTo(px-m.w*.08,py+m.h*.13);
        ctx.lineTo(px,py);
        ctx.lineTo(px+m.w*.08,py+m.h*m.notch);
        ctx.lineTo(sx,sy);
        ctx.lineTo(x1-m.w*.1,base-m.h*.2);
        ctx.lineTo(x1,base);
        ctx.closePath(); ctx.fill();

        // Facette éclairée et grande face à l'ombre.
        ctx.fillStyle = cc('mountainLight');
        ctx.globalAlpha = .72;
        ctx.beginPath();
        ctx.moveTo(x0,base); ctx.lineTo(x0+m.w*.12,base-m.h*.24);
        ctx.lineTo(px,py); ctx.lineTo(px-m.w*.04,base-m.h*.22);
        ctx.lineTo(x0+m.w*.42,base); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(8,3,2,.2)';
        ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(sx,sy);
        ctx.lineTo(x1,base); ctx.lineTo(x0+m.w*.42,base); ctx.closePath(); ctx.fill();

        // Strates rocheuses discrètes, stables grâce au seed de la montagne.
        ctx.strokeStyle = `rgba(225,143,78,${.08*(1-nightPhase*.55)})`;
        ctx.lineWidth = 1;
        for (let i=1;i<=2;i++) {
            const yy=base-m.h*(.22+i*.17)+Math.sin(m.seed+i)*2;
            ctx.beginPath(); ctx.moveTo(x0+m.w*(.18+i*.03),yy);
            ctx.quadraticCurveTo(px,yy-4,x1-m.w*.16,yy+3); ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }
    ctx.restore();
}

function drawDuneLayer(points) {
    if (points.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y - 5);
    for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i];
        const p1 = points[i + 1];
        const cx = (p0.x + p1.x) / 2;
        const cy = (p0.baseY + p1.baseY) / 2 - 3;
        ctx.quadraticCurveTo(p0.x, p0.baseY, cx, cy);
        ctx.quadraticCurveTo(p1.x, p1.baseY, p1.x, p1.baseY);
    }
    ctx.lineTo(W + 60, GROUND_Y - 5);
    ctx.closePath();
    ctx.fill();
}

function drawGround() {
    ctx.fillStyle = cc('ground');
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    ctx.fillStyle = cc('groundDark');
    ctx.fillRect(0, GROUND_Y, W, 3);
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    for (let i = 0; i < 30; i++) {
        const gx = ((i * 37 + frameCount * gameSpeed * 0.5) % (W + 20)) - 10;
        ctx.fillRect(gx, GROUND_Y + 8 + (i * 7) % 25, 2, 1);
    }
    // Filets lumineux et grains de sable défilants pour donner de la vitesse.
    ctx.strokeStyle = `rgba(255,214,145,${.08*(1-nightPhase*.6)})`;
    ctx.lineWidth = 1;
    for (let i=0; i<8; i++) {
        const x = ((i*127 - frameCount*gameSpeed*1.7) % (W+160) + W+160) % (W+160) - 80;
        const y = GROUND_Y + 10 + (i*11)%34;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 24 + i*3, y); ctx.stroke();
    }
}

function drawObstacle(ob) {
    if (ob.type !== 'crevasse' && ob.type !== 'overhang') {
        ctx.fillStyle = 'rgba(16,5,1,.24)';
        ctx.beginPath();
        ctx.ellipse(ob.x + ob.w*.48, GROUND_Y + 3, ob.w*.7, 5, 0, 0, Math.PI*2);
        ctx.fill();
    }
    if (ob.type === 'rock') {
        const grad = ctx.createLinearGradient(ob.x, ob.y, ob.x+ob.w, ob.y+ob.h);
        grad.addColorStop(0, PAL_COMMON.rockLight);
        grad.addColorStop(0.5, PAL_COMMON.rock);
        grad.addColorStop(1, PAL_COMMON.rockShadow);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(ob.x, ob.y+ob.h);
        ctx.lineTo(ob.x+ob.w*0.1, ob.y+ob.h*0.2);
        ctx.lineTo(ob.x+ob.w*0.4, ob.y);
        ctx.lineTo(ob.x+ob.w*0.7, ob.y+ob.h*0.15);
        ctx.lineTo(ob.x+ob.w, ob.y+ob.h*0.35);
        ctx.lineTo(ob.x+ob.w-2, ob.y+ob.h);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(45,18,7,.35)'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(ob.x+ob.w*.42, ob.y+ob.h*.12);
        ctx.lineTo(ob.x+ob.w*.5, ob.y+ob.h*.45);
        ctx.lineTo(ob.x+ob.w*.36, ob.y+ob.h*.68);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,220,160,0.1)';
        ctx.beginPath();
        ctx.moveTo(ob.x+ob.w*0.1, ob.y+ob.h*0.2);
        ctx.lineTo(ob.x+ob.w*0.4, ob.y);
        ctx.lineTo(ob.x+ob.w*0.45, ob.y+ob.h*0.5);
        ctx.lineTo(ob.x, ob.y+ob.h);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(235,154,83,.2)'; ctx.lineWidth = 1;
        for (let i=1;i<=2;i++) {
            const ry=ob.y+ob.h*(.38+i*.19);
            ctx.beginPath(); ctx.moveTo(ob.x+ob.w*.12,ry);
            ctx.quadraticCurveTo(ob.x+ob.w*.5,ry-3,ob.x+ob.w*.87,ry+1); ctx.stroke();
        }
        ctx.fillStyle = 'rgba(70,32,12,.55)';
        ctx.beginPath(); ctx.ellipse(ob.x+ob.w*.18,GROUND_Y-1,3,2,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(ob.x+ob.w*.82,GROUND_Y,2,1.5,0,0,Math.PI*2); ctx.fill();
    } else if (ob.type === 'overhang') {
        const beam = ctx.createLinearGradient(ob.x,ob.y,ob.x,ob.y+ob.h);
        beam.addColorStop(0,PAL_COMMON.rockLight);
        beam.addColorStop(.42,PAL_COMMON.rock);
        beam.addColorStop(1,PAL_COMMON.rockShadow);
        ctx.fillStyle = beam;
        ctx.beginPath();
        ctx.moveTo(ob.x-3,ob.y+3); ctx.lineTo(ob.x+5,ob.y-3);
        ctx.lineTo(ob.x+ob.w*.34,ob.y); ctx.lineTo(ob.x+ob.w*.55,ob.y-2);
        ctx.lineTo(ob.x+ob.w+3,ob.y+2); ctx.lineTo(ob.x+ob.w-1,ob.y+ob.h);
        ctx.lineTo(ob.x+2,ob.y+ob.h); ctx.closePath(); ctx.fill();

        // Dents rocheuses sous la traverse : elles indiquent clairement qu'il
        // faut se baisser sans agrandir la boîte de collision.
        ctx.fillStyle = PAL_COMMON.rockShadow;
        for (let i = 0; i < 4; i++) {
            const sx = ob.x + 8 + i * (ob.w - 16) / 3;
            ctx.beginPath();
            ctx.moveTo(sx-4, ob.y+ob.h-1); ctx.lineTo(sx, ob.y+ob.h+4+(i%2)*2); ctx.lineTo(sx+4, ob.y+ob.h-1);
            ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = PAL_COMMON.rock;
        ctx.beginPath(); ctx.moveTo(ob.x-5,ob.y+2); ctx.lineTo(ob.x+3,ob.y+2);
        ctx.lineTo(ob.x+5,GROUND_Y); ctx.lineTo(ob.x-8,GROUND_Y); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(ob.x+ob.w-3,ob.y+2); ctx.lineTo(ob.x+ob.w+5,ob.y+2);
        ctx.lineTo(ob.x+ob.w+8,GROUND_Y); ctx.lineTo(ob.x+ob.w-5,GROUND_Y); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='rgba(35,14,6,.48)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(ob.x+ob.w*.28,ob.y+1); ctx.lineTo(ob.x+ob.w*.34,ob.y+7); ctx.lineTo(ob.x+ob.w*.3,ob.y+ob.h-1); ctx.stroke();
        ctx.fillStyle='rgba(245,176,95,.16)'; ctx.fillRect(ob.x+3,ob.y,ob.w-8,2);
    } else if (ob.type === 'crevasse') {
        const abyss=ctx.createLinearGradient(ob.x,ob.y,ob.x,ob.y+ob.h);
        abyss.addColorStop(0,'#090301'); abyss.addColorStop(.42,'#160804'); abyss.addColorStop(1,'#321208');
        ctx.fillStyle=abyss; ctx.fillRect(ob.x-2,ob.y,ob.w+4,ob.h);

        // Lèvres brisées et profondeur intérieure au lieu d'un rectangle noir.
        ctx.fillStyle = cc('groundDark');
        ctx.beginPath();
        ctx.moveTo(ob.x-8,ob.y-2); ctx.lineTo(ob.x+2,ob.y+1); ctx.lineTo(ob.x+7,ob.y+7);
        ctx.lineTo(ob.x+2,ob.y+14); ctx.lineTo(ob.x+5,ob.y+ob.h); ctx.lineTo(ob.x-8,ob.y+ob.h);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(ob.x+ob.w+8,ob.y-2); ctx.lineTo(ob.x+ob.w-3,ob.y+2);
        ctx.lineTo(ob.x+ob.w-7,ob.y+9); ctx.lineTo(ob.x+ob.w-2,ob.y+17);
        ctx.lineTo(ob.x+ob.w-5,ob.y+ob.h); ctx.lineTo(ob.x+ob.w+8,ob.y+ob.h);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle='rgba(223,137,68,.22)'; ctx.lineWidth=1;
        for(let i=0;i<3;i++) {
            const yy=ob.y+9+i*13;
            ctx.beginPath(); ctx.moveTo(ob.x+5,yy); ctx.lineTo(ob.x+ob.w*.42,yy+4);
            ctx.moveTo(ob.x+ob.w-5,yy+2); ctx.lineTo(ob.x+ob.w*.6,yy+6); ctx.stroke();
        }
        ctx.fillStyle='rgba(255,176,82,.08)'; ctx.fillRect(ob.x+ob.w*.28,ob.y+ob.h-7,ob.w*.44,3);
    } else if (ob.type === 'worm') {
        ob.phase += 0.06;
        const segs=8, pts=[];
        for(let i=0;i<segs;i++) {
            const t=i/(segs-1);
            pts.push({x:ob.x+ob.w/2+Math.sin(ob.phase+i*.58)*7*(.35+t),y:GROUND_Y-t*ob.h});
        }
        // Corps continu, puis anneaux chitineux lisibles.
        const body=ctx.createLinearGradient(ob.x,ob.y,ob.x+ob.w,ob.y);
        body.addColorStop(0,'#3c1c0d'); body.addColorStop(.45,'#9a5b2d'); body.addColorStop(1,'#321407');
        ctx.strokeStyle=body; ctx.lineWidth=15; ctx.lineCap='round'; ctx.lineJoin='round';
        ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
        for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
        ctx.stroke();
        for(let i=1;i<segs-1;i++) {
            const p=pts[i], prev=pts[i-1], ang=Math.atan2(p.y-prev.y,p.x-prev.x);
            ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(ang);
            ctx.strokeStyle='rgba(37,15,7,.48)'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(-7,0); ctx.quadraticCurveTo(0,-2,7,0); ctx.stroke(); ctx.restore();
        }
        const head=pts[segs-1];
        ctx.save(); ctx.translate(head.x,head.y); ctx.rotate(Math.sin(ob.phase)*.12);
        ctx.fillStyle='#7f4723'; ctx.beginPath(); ctx.ellipse(0,0,11,9,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#210807'; ctx.beginPath(); ctx.ellipse(1,-1,7.5,6,0,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#d6a46d'; ctx.lineWidth=1.3;
        for(let i=0;i<8;i++) {
            const a=i*Math.PI/4; ctx.beginPath();
            ctx.moveTo(Math.cos(a)*5,Math.sin(a)*4); ctx.lineTo(Math.cos(a)*7,Math.sin(a)*5.5); ctx.stroke();
        }
        ctx.fillStyle='#8f2d24'; ctx.beginPath(); ctx.arc(1,-1,2.3,0,Math.PI*2); ctx.fill(); ctx.restore();
        // Gerbe de sable à la sortie du sol.
        ctx.fillStyle='rgba(204,137,68,.55)';
        for(let i=0;i<6;i++) {
            const a=ob.phase+i*1.7, sx=pts[0].x+Math.cos(a)*9, sy=GROUND_Y-2-Math.abs(Math.sin(a))*7;
            ctx.beginPath(); ctx.arc(sx,sy,1+(i%2),0,Math.PI*2); ctx.fill();
        }
    } else if (ob.type === 'drone') {
        ob.phase += 0.15;
        const cx = ob.x + ob.w/2, cy = ob.y + ob.h/2;
        ctx.fillStyle = '#2a1818';
        ctx.beginPath(); ctx.ellipse(cx, cy, ob.w/2, ob.h/2, 0, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#4a2828'; ctx.lineWidth = 2;
        const rot = Math.sin(ob.phase)*0.3;
        ctx.save(); ctx.translate(cx, ob.y-2);
        ctx.rotate(rot);
        ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.stroke();
        ctx.restore();
        ctx.save(); ctx.translate(cx, ob.y-6);
        ctx.rotate(-rot);
        ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke();
        ctx.restore();
        ctx.fillStyle = '#ff0000';
        ctx.beginPath(); ctx.arc(cx+5, cy-2, 3, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ff6666';
        ctx.beginPath(); ctx.arc(cx+5, cy-2, 1.5, 0, Math.PI*2); ctx.fill();
    }
}

function drawMissile(m) {
    if (m.warning > 0) {
        if (Math.floor(m.warning/5) % 2) {
            ctx.strokeStyle = 'rgba(255,0,0,0.5)'; ctx.lineWidth = 2;
            ctx.setLineDash([8, 6]);
            ctx.beginPath(); ctx.moveTo(0, m.y + m.h/2); ctx.lineTo(W, m.y + m.h/2); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#ff0000'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'right';
            ctx.fillText('⚠', W - 10, m.y + m.h/2 + 6);
        }
        return;
    }
    ctx.fillStyle = '#8b0000';
    ctx.beginPath();
    ctx.moveTo(m.x + m.w, m.y + m.h/2);
    ctx.lineTo(m.x + m.w*0.7, m.y);
    ctx.lineTo(m.x, m.y + 2);
    ctx.lineTo(m.x, m.y + m.h - 2);
    ctx.lineTo(m.x + m.w*0.7, m.y + m.h);
    ctx.closePath(); ctx.fill();
    const fLen = 8 + Math.random()*8;
    ctx.fillStyle = 'rgba(255,150,0,0.8)';
    ctx.beginPath();
    ctx.moveTo(m.x, m.y + 2); ctx.lineTo(m.x - fLen, m.y + m.h/2); ctx.lineTo(m.x, m.y + m.h - 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,100,0.6)';
    ctx.beginPath();
    ctx.moveTo(m.x, m.y + 3); ctx.lineTo(m.x - fLen*0.6, m.y + m.h/2); ctx.lineTo(m.x, m.y + m.h - 3);
    ctx.closePath(); ctx.fill();
}

function drawSpiceItem(sp) {
    if (sp.collected) return;
    sp.sparkle += 0.08;
    const glow = 0.45 + Math.sin(sp.sparkle) * 0.35;
    ctx.save();
    ctx.shadowBlur = 14; ctx.shadowColor = PAL_COMMON.spice;
    const halo = ctx.createRadialGradient(sp.x, sp.y, 2, sp.x, sp.y, 12);
    halo.addColorStop(0, `rgba(255,230,150,${glow*0.7})`);
    halo.addColorStop(1, 'rgba(255,200,50,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fffef5';
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y - 7); ctx.lineTo(sp.x + 5, sp.y);
    ctx.lineTo(sp.x, sp.y + 7); ctx.lineTo(sp.x - 5, sp.y);
    ctx.closePath(); ctx.fill();
    ctx.restore();
}

function drawPowerup(pu) {
    if (pu.collected) return;
    pu.phase += 0.06;
    const py = pu.y + Math.sin(pu.phase)*4;
    const colors = { shield:'#6ab8ff', magnet:'#cf75ff', boost:'#ffd34d' };
    const col = colors[pu.type];
    ctx.save(); ctx.translate(pu.x, py);
    ctx.shadowBlur = 14; ctx.shadowColor = col;
    ctx.fillStyle = 'rgba(12,6,4,.86)'; ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0; ctx.strokeStyle = col; ctx.fillStyle = col;
    if (pu.type === 'shield') {
        ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(6,-3); ctx.lineTo(5,3);
        ctx.quadraticCurveTo(0,8,-5,3); ctx.lineTo(-6,-3); ctx.closePath(); ctx.stroke();
    } else if (pu.type === 'magnet') {
        ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI); ctx.stroke();
        ctx.fillRect(-7,-5,4,4); ctx.fillRect(3,-5,4,4);
    } else {
        ctx.beginPath(); ctx.moveTo(2,-7); ctx.lineTo(-4,1); ctx.lineTo(0,1);
        ctx.lineTo(-2,7); ctx.lineTo(5,-2); ctx.lineTo(1,-2); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
}

function drawPlayer() {
    const p = player, bx = p.x, by = p.y;
    if (boostTimer > 0) {
        ctx.fillStyle = `rgba(255,200,50,${0.15 + Math.sin(frameCount*0.3)*0.1})`;
        ctx.beginPath(); ctx.arc(bx + p.w/2, by + p.h/2, p.h/2 + 10, 0, Math.PI*2); ctx.fill();
    }
    if (p.shield && (p.shieldTimer > 120 || frameCount%12 < 7)) {
        const ending = p.shieldTimer <= 120;
        ctx.strokeStyle = ending ? 'rgba(190,220,255,.72)' : `rgba(100,180,255,${0.35 + Math.sin(frameCount*0.2)*0.15})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(bx + p.w/2, by + p.h/2, p.h/2 + 6, 0, Math.PI*2); ctx.stroke();
    }
    if (magnetTimer > 0) {
        ctx.strokeStyle = `rgba(200,100,255,${0.3 + Math.sin(frameCount*0.15)*0.15})`;
        ctx.lineWidth = 1;
        const mr = 30 + Math.sin(frameCount*0.1)*5;
        ctx.beginPath(); ctx.arc(bx + p.w/2, by + p.h/2, mr, 0, Math.PI*2); ctx.stroke();
    }

    ctx.save();
    // Ombre de contact indépendante du saut.
    const air = Math.max(0, GROUND_Y - (by+p.h));
    ctx.fillStyle = `rgba(10,3,1,${Math.max(.06,.23-air/260)})`;
    ctx.beginPath(); ctx.ellipse(bx+p.w/2, GROUND_Y+3, Math.max(7,16-air/12), 4, 0, 0, Math.PI*2); ctx.fill();

    if (!p.sliding && runnerSpriteReady) {
        // Pendant un saut, une pose étendue reste fixe pour éviter de pédaler en l'air.
        const frame = p.grounded ? Math.floor(p.runAnim) % RUNNER_FRAME_COUNT : 0;
        const size = 70;
        const footY = by + p.h + 5;
        ctx.drawImage(
            runnerSprite,
            frame * RUNNER_FRAME_SIZE, 0, RUNNER_FRAME_SIZE, RUNNER_FRAME_SIZE,
            bx + p.w/2 - size/2, footY - size, size, size
        );
        ctx.restore();
        return;
    }

    if (p.sliding && slideSpriteReady) {
        // Le sprite déborde volontairement derrière la boîte de collision :
        // les pieds et le foulard donnent une vraie silhouette de glissade.
        // Même échelle de tête et de torse que la course : le corps est plus
        // long, mais réellement beaucoup plus bas sous la barrière.
        const slideW = 86, slideH = 36;
        const footY = by + p.h + 5;
        ctx.drawImage(
            slideSprite,
            bx + p.w/2 - slideW*.55, footY - slideH, slideW, slideH
        );
    } else if (p.sliding) {
        ctx.translate(bx+12, by+11); ctx.rotate(-.08);
        ctx.fillStyle = '#5d3518';
        ctx.beginPath(); ctx.roundRect(-10,-4,30,15,6); ctx.fill();
        ctx.fillStyle = PAL_COMMON.playerCape;
        ctx.beginPath(); ctx.moveTo(-7,-3); ctx.lineTo(-25,-8); ctx.lineTo(-20,8); ctx.lineTo(-5,8); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#2c180d';
        ctx.beginPath(); ctx.arc(17,-4,8,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#d7aa68'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(10,-4); ctx.lineTo(23,-4); ctx.stroke();
        ctx.strokeStyle = '#4a2813'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(8,8); ctx.lineTo(25,11); ctx.stroke();
    } else {
        const phase = p.grounded ? Math.floor(p.runAnim) * Math.PI/2 : -.7;
        const stride = p.grounded ? Math.sin(phase)*7 : 4;
        const bob = p.grounded ? Math.abs(Math.sin(phase))*1.5 : 0;
        ctx.translate(bx+14, by+bob);

        // Cape et foulard, animés par la vitesse.
        ctx.fillStyle = '#6d3219';
        ctx.beginPath(); ctx.moveTo(-6,15); ctx.lineTo(-18-gameSpeed,17+Math.sin(frameCount*.18)*3);
        ctx.lineTo(-10,34); ctx.lineTo(-4,30); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#9a5527'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-3,10); ctx.quadraticCurveTo(-14,8,-20-gameSpeed*.7,12+Math.sin(frameCount*.22)*3); ctx.stroke();

        // Jambes articulées et bottes.
        ctx.strokeStyle = '#352013'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-4,31); ctx.lineTo(-6+stride*.45,39); ctx.lineTo(-8+stride,47); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(5,31); ctx.lineTo(7-stride*.4,39); ctx.lineTo(10-stride,47); ctx.stroke();
        ctx.strokeStyle = '#17100b'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-8+stride,47); ctx.lineTo(-3+stride,47); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10-stride,47); ctx.lineTo(15-stride,47); ctx.stroke();

        // Tunique, ceinture et plis.
        const bodyGrad = ctx.createLinearGradient(-8,12,9,32);
        bodyGrad.addColorStop(0,'#75451f'); bodyGrad.addColorStop(1,'#3b2313');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath(); ctx.roundRect(-8,12,17,22,4); ctx.fill();
        ctx.fillStyle = '#1f140d'; ctx.fillRect(-8,26,17,4);
        ctx.fillStyle = '#b27a36'; ctx.fillRect(1,26,3,4);

        // Bras en opposition à la foulée.
        ctx.strokeStyle = '#4a2b17'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-5,16); ctx.lineTo(-9-stride*.35,24); ctx.lineTo(-4-stride*.45,29); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(7,16); ctx.lineTo(10+stride*.35,22); ctx.lineTo(8+stride*.5,28); ctx.stroke();

        // Capuche, masque et lentilles bleues caractéristiques.
        ctx.fillStyle = '#382014';
        ctx.beginPath(); ctx.arc(1,8,11,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#17100d';
        ctx.beginPath(); ctx.roundRect(-5,4,13,8,4); ctx.fill();
        ctx.fillStyle = '#58bfff'; ctx.shadowBlur = 7; ctx.shadowColor = '#58bfff';
        ctx.beginPath(); ctx.arc(1,7,2,0,Math.PI*2); ctx.arc(6,7,2,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#b0844c'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(1,7,3.2,0,Math.PI*2); ctx.arc(6,7,3.2,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
}

function drawDustTrail() {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (let i = dustTrail.length - 1; i >= 0; i--) {
        const d = dustTrail[i];
        d.x += d.vx - gameSpeed*0.3; d.y += d.vy; d.vy += 0.05; d.life--;
        if (d.life <= 0) { dustTrail.splice(i, 1); continue; }
        const alpha = (d.life / d.maxLife) * 0.6;
        ctx.fillStyle = `hsla(${d.hue},60%,65%,${alpha})`;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.size * alpha, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
    if (gameState === 'playing' && player.grounded && frameCount % 3 === 0) {
        dustTrail.push({
            x: player.x + 5, y: GROUND_Y - 1, vx: -Math.random()*1.5, vy: -Math.random(),
            life: 14 + Math.random()*10, maxLife: 24, size: 1.5 + Math.random()*2, hue: 35 + Math.random()*15,
        });
    }
}

function drawSpeedLines() {
    const intensity = boostTimer > 0 ? 1 : Math.max(0, (gameSpeed - 5.5) / 3.5);
    if (intensity <= .05 || gameState !== 'playing') return;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.strokeStyle = `rgba(255,205,120,${.08 + intensity*.13})`;
    ctx.lineWidth = 1;
    for (let i=0; i<11; i++) {
        const x = ((i*97 - frameCount*gameSpeed*4.2) % (W+220) + W+220) % (W+220) - 110;
        const y = 55 + (i*41)%235;
        const len = 20 + intensity*65 + (i%3)*12;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+len,y); ctx.stroke();
    }
    ctx.restore();
}

function drawFloatingTexts() {
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy; ft.life--; ft.alpha = Math.min(1, ft.life / 15);
        if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
        ctx.save(); ctx.globalAlpha = ft.alpha;
        ctx.font = 'bold 15px "Segoe UI", sans-serif'; ctx.textAlign = 'center';
        ctx.fillStyle = ft.color;
        ctx.shadowBlur = 6; ctx.shadowColor = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
    }
}

function drawHUD() {
    ctx.save();
    ctx.fillStyle = 'rgba(8,3,1,0.58)';
    ctx.beginPath(); ctx.roundRect(8, 8, 112, combo > 1 ? 64 : 48, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,200,100,0.22)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(8, 8, 112, combo > 1 ? 64 : 48, 7); ctx.stroke();
    ctx.font = '12px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255,220,180,0.85)'; ctx.fillText('DISTANCE  ' + distMeters() + ' m', 17, 27);
    ctx.fillStyle = PAL_COMMON.spice; ctx.fillText('ÉPICE       ✦ ' + spiceCount, 17, 45);
    if (combo > 1) { ctx.fillStyle = PAL_COMMON.gold; ctx.fillText('COMBO      ×' + combo, 17, 63); }

    // Effets actifs : durée exacte, barre restante et clignotement sous 2 s.
    const effects=[];
    if (player.shield) effects.push({label:'BOUCLIER ×1',timer:player.shieldTimer,max:SHIELD_DURATION,color:'#6ab8ff'});
    if (magnetTimer>0) effects.push({label:'AIMANT',timer:magnetTimer,max:MAGNET_DURATION,color:'#cf75ff'});
    if (boostTimer>0) effects.push({label:'BOOST',timer:boostTimer,max:BOOST_DURATION,color:'#ffd34d'});
    effects.forEach((fx,i)=>{
        const x=W-130, y=28+i*25, remain=fx.timer/TARGET_FPS;
        const ending=fx.timer<=120;
        ctx.save();
        if (ending) ctx.globalAlpha=.62+Math.sin(frameCount*.45)*.25;
        ctx.fillStyle='rgba(8,3,1,.72)'; ctx.strokeStyle=fx.color; ctx.lineWidth=1;
        ctx.beginPath(); ctx.roundRect(x,y,114,19,5); ctx.fill(); ctx.stroke();
        ctx.fillStyle=fx.color; ctx.fillRect(x+2,y+16,110*Math.max(0,fx.timer/fx.max),1.5);
        ctx.font='9px "Segoe UI", sans-serif'; ctx.textAlign='left'; ctx.fillText(fx.label,x+6,y+12);
        ctx.textAlign='right';
        ctx.fillText((ending?remain.toFixed(1):Math.ceil(remain))+' s',x+108,y+12);
        ctx.restore();
    });

    const sp = Math.min(1, (gameSpeed - BASE_SPEED) / (MAX_SPEED - BASE_SPEED));
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(W - 90, 10, 70, 7);
    const speedColor = sp < 0.4 ? PAL_COMMON.gold : sp < 0.7 ? '#e8a030' : PAL_COMMON.red;
    ctx.fillStyle = speedColor; ctx.fillRect(W - 90, 10, 70 * sp, 7);
    ctx.strokeStyle = 'rgba(255,200,100,0.25)'; ctx.strokeRect(W - 90, 10, 70, 7);
    ctx.font = '9px sans-serif'; ctx.fillStyle = 'rgba(255,220,180,0.5)'; ctx.textAlign = 'right';
    ctx.fillText('VITESSE', W - 16, 8);
    ctx.restore();
}

function drawMenu() {
    ctx.fillStyle = 'rgba(8,3,1,0.46)'; ctx.fillRect(0, 0, W, H);
    const panel = ctx.createLinearGradient(W/2-210,0,W/2+210,0);
    panel.addColorStop(0,'rgba(12,5,2,.18)'); panel.addColorStop(.5,'rgba(12,5,2,.84)'); panel.addColorStop(1,'rgba(12,5,2,.18)');
    ctx.fillStyle = panel; ctx.fillRect(W/2-230, H/2-105, 460, 205);
    ctx.save(); ctx.textAlign = 'center';
    ctx.font = '900 34px "Segoe UI", sans-serif'; ctx.fillStyle = '#f0bd49';
    ctx.shadowBlur = 18; ctx.shadowColor = 'rgba(205,164,52,0.48)';
    ctx.fillText('SPICE RUNNER', W / 2, H / 2 - 55);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#7b4c20'; ctx.fillRect(W/2-72,H/2-43,144,2);
    ctx.font = '14px "Segoe UI", sans-serif'; ctx.fillStyle = '#c5a16d';
    ctx.fillText('Traverse le désert d\'Arrakis, collecte l\'épice', W / 2, H / 2 - 25);
    ctx.fillText('et esquive les dangers du désert profond', W / 2, H / 2 - 8);
    ctx.fillStyle = 'rgba(205,164,52,.14)'; ctx.strokeStyle = '#9b722d';
    ctx.beginPath(); ctx.roundRect(W/2-145,H/2+12,290,38,7); ctx.fill(); ctx.stroke();
    ctx.font = 'bold 15px "Segoe UI", sans-serif'; ctx.fillStyle = PAL_COMMON.white;
    ctx.fillText('CLIQUE OU ESPACE POUR PARTIR', W / 2, H / 2 + 37);
    if (bestScore > 0) {
        ctx.font = '13px sans-serif'; ctx.fillStyle = '#7c5e2a';
        ctx.fillText('MEILLEUR SCORE  ·  ' + bestScore, W / 2, H / 2 + 72);
    }
    ctx.restore();
}

function drawDead() {
    ctx.fillStyle = 'rgba(8,3,1,0.7)'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(25,9,4,.82)'; ctx.strokeStyle = 'rgba(180,70,40,.4)';
    ctx.beginPath(); ctx.roundRect(W/2-180,H/2-108,360,216,10); ctx.fill(); ctx.stroke();
    ctx.font = '900 27px "Segoe UI", sans-serif'; ctx.fillStyle = '#e76b45';
    ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(200,40,40,0.5)';
    ctx.fillText('PERDU !', W / 2, H / 2 - 60);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 42px "Segoe UI", sans-serif'; ctx.fillStyle = PAL_COMMON.gold;
    ctx.fillText(finalScore, W / 2, H / 2 - 14);
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#a89060';
    ctx.fillText(finalDist + ' m  ·  ' + finalSpice + ' épice', W / 2, H / 2 + 12);
    if (bestScore > 0) ctx.fillText('🏆 Record : ' + bestScore, W / 2, H / 2 + 34);
    ctx.font = 'bold 15px "Segoe UI", sans-serif'; ctx.fillStyle = PAL_COMMON.white;
    ctx.fillText('CLIQUE POUR REJOUER', W / 2, H / 2 + 67);
    ctx.restore();
}

// ──────────────────────────────────────────────
//  BOUCLE PRINCIPALE
// ──────────────────────────────────────────────
function draw() {
    ctx.save();
    if (shakeTimer > 0) { shakeTimer--; ctx.translate((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity); }
    drawSky();
    drawAtmosphere();
    drawMountains();
    ctx.fillStyle = cc('duneFar');   drawDuneLayer(duneFarPts);
    ctx.fillStyle = cc('duneMid');   drawDuneLayer(duneMidPts);
    ctx.fillStyle = cc('duneNear');  drawDuneLayer(duneNearPts);
    drawGround();
    for (const ob of obstacles) drawObstacle(ob);
    for (const m of missiles) drawMissile(m);
    for (const sp of spiceItems) drawSpiceItem(sp);
    for (const pu of powerups) drawPowerup(pu);
    drawDustTrail();
    if (gameState === 'playing' || gameState === 'dead') drawPlayer();
    drawSpeedLines();
    drawFloatingTexts();
    if (gameState === 'playing') drawHUD();
    if (gameState === 'menu') drawMenu();
    if (gameState === 'dead') drawDead();
    // Vignette
    const vignette = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.7);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(6,3,1,0.35)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
}

function loop(now) {
    requestAnimationFrame(loop);
    if (!lastTime) { lastTime = now; return; }
    const dt = Math.min(now - lastTime, 100);
    lastTime = now;
    accumulator += dt;
    while (accumulator >= FRAME_DUR) { tick(); accumulator -= FRAME_DUR; }
    draw();
}

// ──────────────────────────────────────────────
//  INPUT
// ──────────────────────────────────────────────
let slideHeld = false;
function handleAction(action) {
    if (gameState === 'menu') { gameState = 'playing'; reset(); playerJump(); if (!scoreSecret) fetchSecret(); return; }
    if (gameState === 'dead') { if (frameCount > 40) { gameState = 'menu'; reset(); } return; }
    if (action === 'jump') playerJump();
    if (action === 'slide') playerSlide();
}
canvas.addEventListener('pointerdown', e => { e.preventDefault(); handleAction('jump'); });
document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); handleAction('jump'); }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); if (!slideHeld) { slideHeld = true; handleAction('slide'); } }
});
document.addEventListener('keyup', e => {
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { slideHeld = false; playerStopSlide(); }
});

// ──────────────────────────────────────────────
//  API SCORES
// ──────────────────────────────────────────────
async function submitScore(s) {
    if (!scoreSecret) await fetchSecret();
    if (!scoreSecret) return;
    const dur = Math.floor((Date.now() - startTime) / 1000);
    const hash = await sha256(GAME_ID + s + dur + scoreSecret);
    try {
        const r = await fetch('scores_api.php', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'submit', game: GAME_ID, score: s, duration: dur, hash })
        });
        const j = await r.json();
        if (!j.ok) console.warn('[spice_runner] score non enregistré côté serveur :', j.error || 'raison inconnue');
        if (j.ok && j.new_personal) { bestScore = s; localStorage.setItem('spice_best', String(s)); }
        loadLeaderboard();
    } catch (e) {}
}
async function sha256(msg) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function fetchSecret() {
    try {
        const r = await fetch('scores_api.php', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'token', game: GAME_ID })
        });
        const j = await r.json();
        if (j.ok) scoreSecret = j.secret;
    } catch (e) {}
}
async function loadLeaderboard() {
    try {
        const r = await fetch('scores_api.php?action=leaderboard&game=' + GAME_ID + '&limit=10&scope=weekly', { credentials: 'same-origin' });
        const j = await r.json();
        if (!j.ok) return;
        const me = localStorage.getItem('user') || '';
        const ul = document.getElementById('lb-list');
        if (!j.leaderboard.length) { ul.innerHTML = '<li style="color:var(--muted)">Aucun score cette semaine</li>'; return; }
        ul.innerHTML = j.leaderboard.map((e, i) => {
            const medals = ['🥇', '🥈', '🥉'];
            const rank = medals[i] || (i + 1);
            const isMe = e.player === me;
            return `<li class="${isMe ? 'me' : ''}"><span class="rank">${rank}</span><span class="name">${esc(e.player)}</span><span class="pts">${e.score}</span></li>`;
        }).join('');
    } catch (e) {}
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }

// ──────────────────────────────────────────────
//  INITIALISATION
// ──────────────────────────────────────────────
bestScore = parseInt(localStorage.getItem('spice_best') || '0', 10);
gameState = 'menu';
reset();
loadLeaderboard();
fetchSecret();
initStars();
requestAnimationFrame(loop);
})();
</script>
