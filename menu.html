<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Dune - Menu</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Styles spécifiques au Menu */
        html { overflow: auto; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-y: auto;
            font-family: sans-serif;
            background-color: #0a0402;
            background-image: url('menu_bg.png');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(8, 4, 2, 0.65);
            pointer-events: none;
            z-index: 0;
        }

        /* Header épinglé pendant le défilement, comme sur les autres pages du site
           (chroniques, métiers…) — par défaut style.css le pose en absolute. */
        header { position: fixed; }

        /* === ESPACEMENT HAUT === */
        /* Dégage l'espace sous le header fixe (50px, cf. style.css) + une respiration. */
        .cards-top-spacer {
            height: 70px;
            position: relative;
            z-index: 1;
        }

        .cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 22px;
            width: 100%;
            max-width: 1266px;   /* 4 cartes (4×300) + 3 gaps (3×22) → lignes de 4 sur grand écran */
            margin: 0 auto;
            box-sizing: border-box;
            padding: 20px 0;
            position: relative;
            z-index: 1;
        }

        /* Tuile photo plein format : plus de bloc de texte séparé sous l'image.
           Le titre reste visible en permanence (coin bas-droit) ; la description
           n'apparaît qu'au survol, en infobulle, pour ne pas alourdir la tuile. */
        .card {
            background-color: rgba(10, 5, 2, 0.82);
            border-radius: 6px;
            overflow: hidden;
            width: 300px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s;
            text-decoration: none;
            border: 1px solid #3d2b16;
            position: relative;
            display: block;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(205, 164, 52, 0.2), 0 0 0 1px rgba(205,164,52,0.15);
            border-color: #cda434;
        }

        .card-image {
            width: 100%;
            height: 185px;
            object-fit: cover;
            display: block;
            filter: sepia(0.2) contrast(1.1);
            transition: filter 0.3s;
        }

        .card:hover .card-image {
            filter: sepia(0) contrast(1.2);
        }

        /* Assombrit le bas de l'image pour que le titre reste lisible sur n'importe quelle photo. */
        .card-scrim {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0) 55%);
            pointer-events: none;
        }

        .card-title {
            position: absolute;
            right: 12px; bottom: 10px;
            color: #ffcc00;
            font-size: 1.05em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: .5px;
            text-align: right;
            z-index: 2;
        }

        /* Description : cachée par défaut, révélée au survol (souris uniquement — voir mobile plus bas). */
        .card-desc {
            position: absolute;
            left: 10px; right: 10px; top: 10px;
            opacity: 0;
            transition: opacity 0.2s ease;
            background: rgba(10, 6, 3, 0.94);
            border: 1px solid #7c5e2a;
            border-radius: 4px;
            padding: 8px 10px;
            font-size: 0.78em;
            font-style: italic;
            line-height: 1.4;
            color: #d9c48f;
            z-index: 2;
            pointer-events: none;
        }

        .card:hover .card-desc { opacity: 1; }

        /* --- BOUTON DÉCONNEXION DE RETOUR --- */
        .logout-btn {
            position: relative;
            z-index: 1;
            margin-top: 60px;
            
            /* Style de base identique au bouton "Ajouter" du planificateur */
            background: linear-gradient(180deg, #2a1a0b 0%, #1a0f05 100%);
            color: #cda434;
            border: 1px solid #7c5e2a;
            
            padding: 15px 50px; /* Un peu plus large pour le menu */
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 1em;
            letter-spacing: 1px;
            display: inline-block;
        }

        .logout-btn:hover {
            /* Effet relief et lumière au survol */
            background: linear-gradient(180deg, #3d2610 0%, #2a1a0b 100%);
            color: #fff;
            border-color: #cda434;
            box-shadow: 0 0 15px rgba(205, 164, 52, 0.3);
            transform: translateY(-3px); /* Le bouton monte légèrement */
        }

        /* === CARTE « EN TRAVAUX » (joueurs) === */
        .card-wip { cursor: default; }
        .card-wip:hover {
            transform: none;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            border-color: #3d2b16;
        }
        .card-wip .card-title { opacity: 0.7; }
        /* Image affichée quand en_travaux.png est absent : on grise la vignette d'origine */
        .card-wip .card-image.wip-fallback { filter: grayscale(1) brightness(0.45); }

        /* Rubans d'angle (joueurs : en travaux ; admins : en travaux / masquée) */
        .wip-ribbon, .hidden-ribbon {
            position: absolute; top: 14px; right: -38px;
            transform: rotate(45deg);
            font-weight: bold; font-size: 0.7em;
            padding: 5px 44px; z-index: 4; letter-spacing: 1px; text-transform: uppercase;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }
        .wip-ribbon    { background: linear-gradient(180deg, #c9912f 0%, #a9772a 100%); color: #1a1007; }
        .hidden-ribbon { background: linear-gradient(180deg, #9a4a3a 0%, #6e2f24 100%); color: #f6e3c4; }

        /* === INDICATEUR ADMIN « MASQUÉE » (la tuile reste cliquable) === */
        .card-admin-hidden .card-image { filter: grayscale(0.85) brightness(0.5); transition: filter 0.3s; }
        .card-admin-hidden:hover .card-image { filter: grayscale(0.4) brightness(0.7); }
        .hidden-eye {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            pointer-events: none; z-index: 3;
        }
        .hidden-eye svg {
            width: 46px; height: 46px; fill: #cda434; opacity: 0.92;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.85));
        }

        /* Le flex-wrap réduit le nombre de cartes par ligne automatiquement quand l'écran
           rétrécit (la dernière ligne reste centrée) — pas besoin de paliers de colonnes. */

        /* === RESPONSIVE — Mobile (1 colonne) === */
        @media(max-width: 580px) {
            .cards-top-spacer { height: 20px; }
            .cards-container { gap: 12px; padding: 10px; }
            .card { width: min(300px, calc(100vw - 40px)); margin: 0 auto; }
            .card-image { height: 135px; }
            .logout-btn { margin-top: 25px; padding: 12px 25px; font-size: 0.9em; }
            /* Pas de survol tactile fiable : le titre suffit, la description en infobulle
               ne s'affiche que sur pointeur souris (desktop). */
        }

        /* Espace bas de page */
        .logout-btn { margin-bottom: 60px; }
    </style>
</head>
<body>
<script src="auth-guard.js"></script>
<script src="dune-tip.js" defer></script>

<header>
  <div class="title">Maison des Havres Gris</div>
  <div class="header-controls">
    <a href="account.html" class="user-account-widget" id="ua-widget">
      <div class="ua-avatar" id="ua-avatar">?</div>
      <span class="ua-pseudo" id="ua-pseudo">…</span>
    </a>
  </div>
</header>
<script>(function(){var u=localStorage.getItem("user")||"?";document.getElementById("ua-pseudo").textContent=u;var av=document.getElementById("ua-avatar");var img=localStorage.getItem("avatar");if(img){av.style.background="transparent";av.innerHTML='<img src="'+img+'" style="width:42px;height:42px;margin:-1px;object-fit:cover;border-radius:50%;">';}else{av.textContent=u.charAt(0).toUpperCase();var h=0;for(var i=0;i<u.length;i++)h=((h<<5)-h)+u.charCodeAt(i);av.style.background="hsl("+(Math.abs(h)%360)+",55%,32%)";}})();</script>

    <div class="cards-top-spacer"></div>

    <div class="cards-container" id="cards-container"></div>

    <button class="logout-btn" onclick="logout()">Déconnexion</button>

<script src="pages.js"></script>
<script>
function logout() {
    localStorage.removeItem("user");
    localStorage.removeItem("role");
    localStorage.removeItem("realRole");
    localStorage.removeItem("previewPlayer");
    window.location.href = "index.html";
}

// Échappe le texte injecté dans le HTML des cartes (titres/descriptions du registre)
function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// Rendu du menu à partir du registre pages.js + état d'accès défini par les admins.
// Admin : toutes les tuiles, cliquables (avec un badge indiquant l'état vu par les joueurs).
// Joueur : open = normale ; hidden = absente ; wip = grisée, non cliquable, image « en travaux ».
(async function renderMenu() {
    const isAdmin = localStorage.getItem('role') === 'admin';
    let pages = {};
    try {
        const r = await fetch('save.php', { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ action: 'getSettings' }) });
        const s = await r.json();
        pages = (s && s.pages) || {};
    } catch(e) {}

    // Icône « œil barré » pour signaler aux admins une tuile masquée
    const EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>';

    // Titre (coin bas-droit, toujours visible) + description (infobulle au survol).
    const overlay = p => `
        <div class="card-scrim"></div>
        <div class="card-desc">${esc(p.desc)}</div>
        <div class="card-title">${esc(p.title)}</div>`;

    const wipImg = p => `<img src="en_travaux.png" onerror="this.onerror=null;this.src='${esc(p.img)}';this.classList.add('wip-fallback')" alt="${esc(p.title)}" class="card-image">`;

    const inner = p => `
        <img src="${esc(p.img)}" onerror="this.src='intro.jpg'" alt="${esc(p.title)}" class="card-image">${overlay(p)}`;

    const html = (window.MENU_PAGES || []).map(p => {
        const status = pages[p.key] || 'open';

        // Admin : tout reste cliquable, mais masquée/en travaux sont signalées visuellement.
        if (isAdmin) {
            if (status === 'wip') {
                return `<a href="${esc(p.href)}" class="card" data-page="${esc(p.key)}" data-tip="En travaux (visible par toi seul·e)">
                    <div class="wip-ribbon">En travaux</div>
                    ${wipImg(p)}${overlay(p)}
                </a>`;
            }
            if (status === 'hidden') {
                return `<a href="${esc(p.href)}" class="card card-admin-hidden" data-page="${esc(p.key)}" data-tip="Masquée pour les joueurs (visible par toi seul·e)">
                    <div class="hidden-ribbon">Masquée</div>
                    <img src="${esc(p.img)}" onerror="this.src='intro.jpg'" alt="${esc(p.title)}" class="card-image">
                    <div class="hidden-eye">${EYE_OFF}</div>
                    ${overlay(p)}
                </a>`;
            }
            return `<a href="${esc(p.href)}" class="card" data-page="${esc(p.key)}">${inner(p)}</a>`;
        }

        // Joueur
        if (status === 'hidden') return '';
        if (status === 'wip') {
            return `<div class="card card-wip" data-page="${esc(p.key)}" data-tip="En travaux">
                <div class="wip-ribbon">En travaux</div>
                ${wipImg(p)}${overlay(p)}
            </div>`;
        }
        return `<a href="${esc(p.href)}" class="card" data-page="${esc(p.key)}">${inner(p)}</a>`;
    }).join('');

    document.getElementById('cards-container').innerHTML = html;
})();
</script>
</body>
</html>
