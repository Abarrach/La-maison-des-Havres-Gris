<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ornithopter Flap — Hub Jeux</title>
<link rel="stylesheet" href="../style.css">
<style>
:root {
    --bg: #0a0402;
    --gold: #cda434;
    --text: #f5deb3;
    --muted: #7c5e2a;
}
html, body {
    overflow: hidden; height: 100%; margin: 0;
    touch-action: none; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
}
body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
}
#game-wrapper {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
}
canvas {
    border: 1px solid #3d2b16; border-radius: 8px;
    box-shadow:
        0 0 60px rgba(205,164,52,0.08),
        0 0 120px rgba(180,120,30,0.04);
    cursor: pointer; display: block;
}
.game-header {
    display: flex; align-items: center; gap: 10px;
    width: 100%; max-width: 400px; padding: 8px 12px; box-sizing: border-box;
    background: rgba(0,0,0,0.4); border: 1px solid #3d2b16; border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.35);
}
.game-header .back-link {
    color: var(--gold); text-decoration: none; font-weight: bold; font-size: 0.78em;
    border: 1px solid #7c5e2a; border-radius: 4px; padding: 5px 10px;
    background: linear-gradient(180deg, #2a1a0b, #1a0f05);
    transition: all 0.2s; white-space: nowrap;
}
.game-header .back-link:hover { background: var(--gold); color: #000; border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
.game-header .game-title {
    font-size: 1em; font-weight: bold; color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.5px; text-shadow: 0 0 10px rgba(205,164,52,0.3);
}
.score-live { font-size: 1.15em; color: #ffcc00; font-weight: bold; margin-left: auto; }

#leaderboard {
    position: absolute; right: -240px; top: 0; width: 220px;
    background: rgba(10,5,2,0.92); border: 1px solid #3d2b16;
    border-radius: 8px; padding: 16px 14px; font-size: 0.78em;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
#leaderboard h3 {
    margin: 0 0 12px; color: var(--gold); font-size: 0.95em;
    text-align: center; text-transform: uppercase; letter-spacing: 2px;
}
#lb-list { list-style: none; padding: 0; margin: 0; }
#lb-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; border-bottom: 1px solid rgba(61,43,22,0.4);
}
#lb-list li .rank { color: var(--muted); width: 26px; font-size: 0.9em; }
#lb-list li .name { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#lb-list li .pts { color: #ffcc00; font-weight: bold; min-width: 44px; text-align: right; }
#lb-list li.me .name { color: var(--gold); }

/* Responsive */
@media (max-width: 700px) {
    #leaderboard { position: static; width: 90vw; max-width: 400px; margin-top: 6px; }
}
@media (max-width: 420px) {
    canvas { width: 95vw !important; height: auto !important; }
    .game-header { font-size: 0.7em; }
}
</style>
</head>
<body>
<script src="../auth-guard.js"></script>
<div id="game-wrapper">
    <div class="game-header">
        <a href="hub.html" class="back-link">&larr; Hub Jeux</a>
        <span class="game-title">🪶 Ornithopter Flap</span>
        <span class="score-live" id="score-display">0</span>
    </div>
    <canvas id="game" width="400" height="600"></canvas>
    <div id="leaderboard">
        <h3>🗓️ Cette semaine</h3>
        <ul id="lb-list"><li style="color:var(--muted)">Chargement…</li></ul>
    </div>
</div>

<script>
;(function () {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 400, H = 600;
const GAME_ID = 'orni_flap';

// ──────────────────────────────────────────────
//  CONSTANTES PHYSIQUES
// ──────────────────────────────────────────────
const TARGET_FPS = 60, FRAME_DUR = 1000 / TARGET_FPS;
const GRAVITY = 0.38, FLAP_FORCE = -7.2;
const PIPE_W = 48, GAP = 182;
const PIPE_SPEED_BASE = 1.75;
const PIPE_INTERVAL_BASE = 158;
const PIPE_INTERVAL_MIN = 108;
const MAX_GAP_SHIFT = 90;
const BIRD_X = 80, BIRD_W = 36, BIRD_H = 26;
const BIRD_HIT_HALF_W = 21, BIRD_HIT_HALF_H = 8.5;
const GROUND_H = 22;
const COLLECTIBLE_PICKUP_X = 30, COLLECTIBLE_PICKUP_Y = 23;

const ORNI_BODY_SIZE = 256, ORNI_DRAW_SIZE = 80;
const orniBodySprite = new Image();
let orniBodyReady = false;
orniBodySprite.onload = () => { orniBodyReady = true; };
orniBodySprite.src = 'img/ornithopter_body.png';

// ---- Variété (contre la monotonie) ----
const SPICE_CHANCE       = 0.5;   // proba d'épice par pilier
const SHIELD_MIN_SCORE   = 6;
const SHIELD_CHANCE      = 0.1;   // proba de bouclier par pilier (si score suffisant)
const OSCILLATE_MIN_SCORE = 8;
const OSCILLATE_CHANCE   = 0.4;
const OSC_AMPLITUDE      = 26;
const OSC_SPEED          = 0.02;
// Frôlement — DÉGAGEMENT mesuré depuis le BORD de la hitbox, pas depuis le centre de l'orni.
// L'ancienne version comparait la marge à la distance CENTRE↔lèvre du tuyau, alors que la
// collision, elle, se déclenche au bord (BIRD_HIT_HALF_H = 8.5 px plus loin). Résultat : la
// bande réellement exploitable ne faisait que `10 - 8.5 = 1.5 px`, soit 1,8 % de la hauteur
// de vol utile — et comme un coup d'aile déplace l'orni de 7,2 px en une frame, on la
// franchissait sans jamais l'occuper. Le bonus n'était donc jamais tentable volontairement :
// il ne tombait que par hasard, au sommet d'un arc où la vitesse verticale s'annule.
// Exprimé en dégagement, la constante dit enfin ce qu'elle veut dire : « passé à moins de
// N px du tuyau », et reste juste si la hitbox change un jour.
// Valeur retenue après essai en main : 12 restait trop sec parce que la trajectoire est une
// PARABOLE — on ne tient jamais une altitude, on la traverse. 14 laisse le temps d'ajuster
// l'arc sans transformer le bonus en acquis (cf. aussi la détection balayée dans tick()).
const CLOSE_CALL_CLEARANCE = 14;  // ~17 % du vol utile récompensé
const CLOSE_CALL_REACH     = 10;  // fenêtre HORIZONTALE d'éligibilité autour du pilier
const WORM_HAZARD_MIN_SCORE = 12; // avant ce score le ver reste un simple décor
const SECTOR_LENGTH = 8;
const WEATHER_WARNING_FRAMES = 90;

const SECTORS = [
    {
        name: 'MER DE DUNES', icon: '☀', weather: 'sandstorm',
        sky: ['#3e1a0c', '#7a3818', '#b45a2a', '#d99b4a', '#e8c47a'],
        tint: 'rgba(245,174,80,0.04)',
    },
    {
        name: 'CANYON PROFOND', icon: '◈', weather: 'gust',
        sky: ['#23100d', '#54251b', '#8c4028', '#b66a3a', '#d39a5a'],
        tint: 'rgba(112,35,20,0.10)',
    },
    {
        name: "NUIT D'ARRAKIS", icon: '☾', weather: 'staticstorm',
        sky: ['#080a18', '#15162c', '#292744', '#55405a', '#9a654e'],
        tint: 'rgba(28,35,92,0.18)',
    },
];

const MISSION_DEFS = [
    { type: 'gate', target: 8, label: 'Franchir 8 passages' },
    { type: 'spice', target: 3, label: 'Récolter 3 épices' },
    { type: 'close', target: 2, label: 'Réaliser 2 frôlements' },
];
const CHALLENGE_TOKEN_CHANCE = 0.34;
const CHALLENGE_Y_TOP = 68;
const CHALLENGE_Y_BOTTOM = H - GROUND_H - 64;

// ──────────────────────────────────────────────
//  PALETTE DE COULEURS (Dune améliorée)
// ──────────────────────────────────────────────
const PAL = {
    skyTop: '#3e1a0c',
    skyHigh: '#7a3818',
    skyMid: '#b45a2a',
    skyLow: '#d99b4a',
    skyHorizon: '#e8c47a',
    sun: '#fff5d0',
    sandFar: '#a67a3a',
    sandMid: '#c49448',
    sandNear: '#d9af55',
    sandDark: '#8a5e28',
    rock: '#4a3018',
    rockLight: '#6b4a2a',
    rockShadow: '#2e1a0a',
    wing: '#5a3a20',
    wingMembrane: '#8a6030',
    body: '#3d2410',
    cockpit: '#1a1008',
    gold: '#ffcc00',
    red: '#c44',
    white: '#f5deb3',
};

// ──────────────────────────────────────────────
//  ÉTAT GLOBAL
// ──────────────────────────────────────────────
let bird, pipes, particles, score, bestScore, gameState, frameCount, speed, nextPipeTimer;
let startTime = 0, scoreSecret = '';
let lastTime = 0, accumulator = 0;
let worm = null;
let spiceItems = [], powerups = [];
let shielded = false, shieldGrace = 0;
let combo = 0, comboTimer = 0;
let gatesPassed = 0, sectorIndex = 0, sectorBannerTimer = 0;
let weather = null, weatherCooldown = 0;
let mission = null;
let challengeItems = [], challengeCooldown = 0;
let stormInterference = null, stormFlashTimer = 0;

// ── JUS / GAME FEEL ──────────────────────────────
// Modèle "trauma" (Squirrel Eiserloh) plutôt qu'un timer de shake : on ACCUMULE du trauma
// (0→1), il décroît linéairement, et l'amplitude réelle = trauma². Le carré fait que deux
// petits chocs rapprochés restent discrets alors qu'un gros choc tape fort — et la sortie
// s'éteint en douceur au lieu de couper net.
let trauma = 0;
const TRAUMA_DECAY = 0.055;      // un trauma plein s'éteint en ~0.3 s ; un petit choc en ~0.1 s
const TRAUMA_MAX_OFFSET = 13;    // px de déplacement au trauma maximal
const TRAUMA_MAX_ROT = 0.016;    // rad — une pointe de roulis vend mieux le choc qu'une translation seule
function addTrauma(amount) { trauma = Math.min(1, trauma + amount); }

// DOCTRINE : le tremblement d'écran DÉPLACE l'image, donc il dégrade la lecture de la
// position. On ne s'autorise ce déplacement QUE lorsque la précision n'a plus d'importance.
//
// Première version : tout événement positif secouait l'écran, frôlement compris. Or un
// frôlement se produit AU MOMENT où l'on enfile le trou, et la secousse durait 9 à 11 frames,
// soit 33 à 43 % des 26 frames de traversée du pilier, pour 3 à 5 px de déplacement. Pire,
// l'amplitude croissait avec le combo : chaque frôlement réussi rendait le suivant plus
// difficile à placer. Le jus se mettait à combattre le jeu au lieu de l'habiller — c'est
// exactement ce qu'il ne doit jamais faire (il s'ajoute par-dessus ce qui marche, il n'en
// devient jamais un élément porteur).
//
// Les événements en plein vol reçoivent donc un retour NON DÉPLAÇANT : hitstop, étincelles,
// texte flottant, pulse du combo, lèvre du tuyau qui s'illumine. Tout aussi présent, mais
// l'image ne bouge pas d'un pixel tant qu'il faut piloter.
const SHAKE = {
    // — Précision suspendue : là, on peut secouer.
    degat: 0.72,   // ~6.7 px — bouclier perdu, suivi de 25 frames d'invulnérabilité
    crash: 1.00,   // 13 px   — la partie est finie, plus rien à piloter
};

// Hitstop : on gèle le monde quelques frames sur un impact. C'est ce qui donne du POIDS —
// le cerveau lit la pause comme de la résistance. 60-80 ms sur un impact destructif.
let hitstop = 0;
function addHitstop(frames) { hitstop = Math.max(hitstop, frames); }

// Squash & stretch de l'orni : squashT décroît de 1→0, l'étirement suit un ease-out quad.
// Signe positif = étiré verticalement (montée), négatif = aplati (impact/chute).
let squashT = 0, squashDir = 1;
function addSquash(dir) { squashT = 1; squashDir = dir; }

// Flash plein écran (crash, gros événement) — décroît vite, sinon ça devient pénible.
let flashT = 0, flashHue = 0;
function addFlash(amount, hue = 0) { flashT = Math.min(1, flashT + amount); flashHue = hue; }

// Pulse du compteur de combo à chaque frôlement (le HUD ne bougeait pas d'un pixel).
let comboFlash = 0;

// Textes flottants ("FRÔLEMENT +6") : le frôlement est la mécanique signature du jeu et
// n'avait AUCUN retour visuel — seulement un son. On matérialise le gain là où il se produit.
let floaters = [];
function addFloater(x, y, text, color = '#ffcc00', size = 15) {
    floaters.push({ x, y, text, color, size, life: 52, maxLife: 52, vy: -1.15 });
}

// Débris de crash : contrairement aux particules de sable (qui s'effacent), ceux-ci tombent
// et RESTENT au sol le temps de l'écran de mort. La permanence est un des points de Nijman :
// laisser une trace prouve que l'impact a eu lieu.
let debris = [];

// ──────────────────────────────────────────────
//  AUDIO
// ──────────────────────────────────────────────
let audioCtx = null;
function audCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}
function tone(freq, dur, vol = 0.08, type = 'sine') {
    try {
        const a = audCtx(), t = a.currentTime;
        const o = a.createOscillator(), g = a.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(a.destination);
        o.start(t); o.stop(t + dur);
    } catch (e) {}
}
function sndFlap()   { tone(300, 0.08, 0.1, 'triangle'); setTimeout(() => tone(480, 0.06, 0.08), 30); }
function sndScore()  { tone(660, 0.1, 0.12); setTimeout(() => tone(880, 0.1, 0.1), 60); }
function sndSpice()  { tone(880, 0.06, 0.08); setTimeout(() => tone(1100, 0.06, 0.06), 40); }
function sndShield() { [660, 880, 1100].forEach((f, i) => setTimeout(() => tone(f, 0.08, 0.1), i * 60)); }
function sndCloseCall() { tone(600, 0.06, 0.06, 'sawtooth'); }
function sndWormWarn() { for (let i = 0; i < 3; i++) setTimeout(() => tone(800, 0.06, 0.06, 'square'), i * 120); }
function sndWeatherWarn() { tone(260, 0.12, 0.05, 'triangle'); setTimeout(() => tone(210, 0.16, 0.04, 'triangle'), 140); }
function sndSector() { [330, 440, 550].forEach((f, i) => setTimeout(() => tone(f, 0.1, 0.05), i * 70)); }
function sndMission() { [660, 880, 1100].forEach((f, i) => setTimeout(() => tone(f, 0.12, 0.07), i * 80)); }
function sndContract() { tone(420, .1, .07, 'square'); setTimeout(() => tone(720, .15, .08, 'triangle'), 90); }
function sndStormCharge() { tone(1250, .08, .08, 'sawtooth'); setTimeout(() => tone(190, .22, .1, 'square'), 55); }
function sndCrash() {
    try {
        const a = audCtx(), t = a.currentTime;
        const len = a.sampleRate * 0.2;
        const buf = a.createBuffer(1, len, a.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
        const src = a.createBufferSource(), g = a.createGain();
        src.buffer = buf;
        g.gain.setValueAtTime(0.22, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        src.connect(g); g.connect(a.destination); src.start(t);
        tone(70, 0.2, 0.14, 'sine');
    } catch (e) {}
}

// ──────────────────────────────────────────────
//  DUNES (3 couches + points fixes)
// ──────────────────────────────────────────────
let dunes = [], mesas = [], skyMotes = [];
function initDunes() {
    dunes = [
        { pts: [], speed: 0.15, color: PAL.sandFar, heightBase: 70 },
        { pts: [], speed: 0.3,  color: PAL.sandMid, heightBase: 40 },
        { pts: [], speed: 0.5,  color: PAL.sandNear, heightBase: 20 },
    ];
    for (const layer of dunes) {
        const n = 10;
        for (let i = 0; i <= n; i++) {
            layer.pts.push({
                x: (i / n) * (W + 120) - 60,
                y: H - layer.heightBase - Math.random() * 30,
            });
        }
    }
    mesas=Array.from({length:8},(_,i)=>({
        x:i*78-70,w:58+Math.random()*58,h:55+Math.random()*115,
        peak:.25+Math.random()*.42,seed:Math.random()*Math.PI*2,
    }));
    skyMotes=Array.from({length:34},()=>({
        x:Math.random()*W,y:70+Math.random()*(H-150),
        len:5+Math.random()*15,speed:.18+Math.random()*.5,alpha:.04+Math.random()*.12,
    }));
}

// ──────────────────────────────────────────────
//  OBJETS
// ──────────────────────────────────────────────
function reset() {
    bird = { y: H / 2.5, prevY: H / 2.5, vy: 0, rot: 0, wingPhase: 0, wingSpeed: 0.22 };
    pipes = [];
    particles = [];
    spiceItems = []; powerups = [];
    shielded = false; shieldGrace = 0;
    combo = 0; comboTimer = 0;
    score = 0;
    frameCount = 0;
    speed = PIPE_SPEED_BASE;
    nextPipeTimer = PIPE_INTERVAL_BASE;
    worm = null;
    gatesPassed = 0;
    sectorIndex = 0;
    sectorBannerTimer = 120;
    weather = { phase: 'idle', type: null, timer: 0, direction: 0 };
    weatherCooldown = 360;
    mission = null;
    challengeItems = [];
    challengeCooldown = 2;
    stormInterference = null;
    stormFlashTimer = 0;
    trauma = 0; hitstop = 0; squashT = 0; flashT = 0; comboFlash = 0;
    floaters = []; debris = [];
    startTime = Date.now();
    initDunes();
    updateScoreDisplay();
}

function chooseMission() {
    const def = MISSION_DEFS[Math.floor(Math.random() * MISSION_DEFS.length)];
    mission = { ...def, progress: 0, completed: false, toast: 0, dismissTimer: 0 };
}

function advanceMission(type, amount = 1) {
    if (!mission || mission.completed || mission.type !== type) return;
    mission.progress = Math.min(mission.target, mission.progress + amount);
    if (mission.progress >= mission.target) {
        mission.completed = true;
        mission.toast = 180;
        mission.dismissTimer = 180;
        score += 8;
        updateScoreDisplay();
        sndMission();
        emitBurst(W / 2, 145, 28, 118);
        // Plus gros gain unitaire du jeu (+8) : il lui fallait une ponctuation à la hauteur.
        addHitstop(5); addFlash(0.42, 130);   // pas de secousse : on est encore en train de piloter
    }
}

function currentSector() {
    return SECTORS[sectorIndex];
}

function updateSector() {
    const nextIndex = Math.floor(gatesPassed / SECTOR_LENGTH) % SECTORS.length;
    if (nextIndex === sectorIndex) return;
    sectorIndex = nextIndex;
    sectorBannerTimer = 180;
    weather = { phase: 'idle', type: null, timer: 0, direction: 0 };
    weatherCooldown = 180;
    sndSector();
}
function updateScoreDisplay() {
    document.getElementById('score-display').textContent = score;
}
function spawnPipe() {
    let challengeSpawned = false;
    const minTop = 55;
    const maxTop = H - GAP - 90;
    const rawTop = minTop + Math.random() * (maxTop - minTop);
    const previous = pipes[pipes.length - 1];
    const topH = previous
        ? Math.max(minTop, Math.min(maxTop,
            Math.max(previous.baseTop - MAX_GAP_SHIFT,
                Math.min(previous.baseTop + MAX_GAP_SHIFT, rawTop))))
        : rawTop;
    const oscillates = score >= OSCILLATE_MIN_SCORE && Math.random() < OSCILLATE_CHANCE;
    pipes.push({
        x: W + 20, topH, baseTop: topH, scored: false, closeCalled: false,
        seed: Math.random() * 1000, oscillates, oscPhase: Math.random() * Math.PI * 2,
    });

    // Un collectible (épice) ou plus rarement un bouclier, dans l'espace du trou
    const gapMidY = topH + GAP / 2;
    const px = W + 20 + PIPE_W / 2;
    if (score >= SHIELD_MIN_SCORE && Math.random() < SHIELD_CHANCE) {
        powerups.push({ x: px, y: gapMidY, collected: false, phase: Math.random() * Math.PI * 2 });
    } else if (Math.random() < SPICE_CHANCE) {
        spiceItems.push({ x: px, y: gapMidY + (Math.random() - 0.5) * (GAP * 0.4), collected: false, sparkle: Math.random() * Math.PI * 2 });
    }

    // Une balise de contrat apparaît entre deux obstacles, volontairement près d'une limite.
    if (!mission && challengeItems.length === 0 && gatesPassed >= 2 && challengeCooldown <= 0
        && Math.random() < CHALLENGE_TOKEN_CHANCE) {
        const highDistance = Math.abs(gapMidY - CHALLENGE_Y_TOP);
        const lowDistance = Math.abs(gapMidY - CHALLENGE_Y_BOTTOM);
        const nearerIsHigh = highDistance <= lowDistance;
        const high = Math.random() < .75 ? nearerIsHigh : !nearerIsHigh;
        const nextInterval = Math.max(PIPE_INTERVAL_MIN, Math.round(PIPE_INTERVAL_BASE - score * .65));
        const openDistance = Math.max(150, speed * nextInterval - PIPE_W);
        challengeItems.push({
            // 58 % de l'espace libre après le tube : assez de préparation, sans coller au suivant.
            x: W + 20 + PIPE_W + openDistance * .58,
            y: high ? CHALLENGE_Y_TOP : CHALLENGE_Y_BOTTOM,
            phase: Math.random() * Math.PI * 2,
            edge: high ? 'HAUT' : 'RAS DU SOL',
        });
        challengeSpawned = true;
    }
    return challengeSpawned;
}

// ──────────────────────────────────────────────
//  PARTICULES (sable + traînée)
// ──────────────────────────────────────────────
function emitSand(x, y, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x + (Math.random() - 0.5) * 12,
            y: y + (Math.random() - 0.5) * 6,
            vx: (Math.random() - 0.5) * 1.5 - 1,
            vy: (Math.random() - 0.5) * 1.5 - 0.3,
            life: 25 + Math.random() * 25,
            maxLife: 50,
            size: 1.2 + Math.random() * 2.5,
            hue: 35 + Math.random() * 15,
        });
    }
}

// ──────────────────────────────────────────────
//  DESSIN : CIEL
// ──────────────────────────────────────────────
function drawSky() {
    const sector = currentSector();
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, sector.sky[0]);
    grad.addColorStop(0.3, sector.sky[1]);
    grad.addColorStop(0.6, sector.sky[2]);
    grad.addColorStop(0.85, sector.sky[3]);
    grad.addColorStop(1, sector.sky[4]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Soleil ou lunes selon le secteur.
    const sx = 300, sy = 70;
    const glow = ctx.createRadialGradient(sx, sy, 8, sx, sy, 90);
    const night = sectorIndex === 2;
    glow.addColorStop(0, night ? 'rgba(210,220,255,0.85)' : 'rgba(255,240,200,0.95)');
    glow.addColorStop(0.3, night ? 'rgba(120,145,220,0.25)' : 'rgba(255,200,100,0.5)');
    glow.addColorStop(0.7, night ? 'rgba(80,100,180,0.06)' : 'rgba(255,140,40,0.1)');
    glow.addColorStop(1, 'rgba(255,80,10,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sx, sy, 90, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = night ? '#d8ddf2' : PAL.sun;
    ctx.beginPath(); ctx.arc(sx, sy, night ? 13 : 18, 0, Math.PI * 2); ctx.fill();

    if (night) {
        ctx.fillStyle = 'rgba(225,225,255,0.72)';
        for (let i = 0; i < 34; i++) {
            const x = (i * 83 + 17) % W, y = 18 + ((i * 47) % 245);
            const r = i % 7 === 0 ? 1.3 : 0.65;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#bd9c8c';
        ctx.beginPath(); ctx.arc(250, 105, 5, 0, Math.PI * 2); ctx.fill();
    }

    // Poussière en suspension (bandes horizontales)
    ctx.fillStyle = 'rgba(220,170,100,0.08)';
    for (let i = 0; i < 4; i++) {
        const y = 120 + i * 80;
        ctx.fillRect(0, y, W, 6 + i * 3);
    }
    ctx.fillStyle = sector.tint;
    ctx.fillRect(0, 0, W, H);
}

// ──────────────────────────────────────────────
//  DESSIN : DUNES
// ──────────────────────────────────────────────
function drawDunes() {
    const palettes = [
        ['#80502b', '#a67638', '#c79b4c', '#e0bb64'],
        ['#321510', '#5b281b', '#814127', '#a76c38'],
        ['#10142d', '#20284a', '#34395e', '#596080'],
    ];
    const colors = palettes[sectorIndex];

    // Les reliefs ont une géométrie propre à chaque secteur, pas seulement une teinte différente.
    for (const m of mesas) {
        m.x -= (gameState === 'playing' ? speed / PIPE_SPEED_BASE : .25) * (sectorIndex === 1 ? .18 : .11);
        if (m.x + m.w < -45) m.x = W + 45 + Math.random() * 55;
        const base = H - 72;
        ctx.fillStyle = colors[0];
        ctx.beginPath();
        if (sectorIndex === 0) {
            const top = base - m.h * .72;
            ctx.moveTo(m.x, base); ctx.lineTo(m.x + m.w * .16, base - m.h * .22);
            ctx.lineTo(m.x + m.w * .34, top); ctx.lineTo(m.x + m.w * .66, top + 2);
            ctx.lineTo(m.x + m.w * .84, base - m.h * .2); ctx.lineTo(m.x + m.w, base);
        } else if (sectorIndex === 1) {
            const h = m.h * 1.18, top = base - h;
            ctx.moveTo(m.x, base); ctx.lineTo(m.x + m.w * .08, base - h * .16);
            ctx.lineTo(m.x + m.w * .18, top + h * .08); ctx.lineTo(m.x + m.w * .72, top);
            ctx.lineTo(m.x + m.w * .88, base - h * .2); ctx.lineTo(m.x + m.w, base);
        } else {
            const peakX = m.x + m.w * (.38 + m.peak * .2), top = base - m.h * .92;
            ctx.moveTo(m.x, base); ctx.lineTo(peakX - m.w * .1, top + m.h * .18);
            ctx.lineTo(peakX, top); ctx.lineTo(peakX + m.w * .13, top + m.h * .22);
            ctx.lineTo(m.x + m.w, base);
        }
        ctx.closePath(); ctx.fill();

        ctx.fillStyle = sectorIndex === 2 ? 'rgba(125,150,220,.16)' : 'rgba(235,145,75,.16)';
        ctx.beginPath(); ctx.moveTo(m.x + m.w * .12, base);
        ctx.lineTo(m.x + m.w * .4, base - m.h * .68);
        ctx.lineTo(m.x + m.w * .52, base - m.h * .3);
        ctx.lineTo(m.x + m.w * .62, base); ctx.closePath(); ctx.fill();
        if (sectorIndex === 1) {
            ctx.strokeStyle = 'rgba(231,143,79,.16)'; ctx.lineWidth = 1;
            for (let s = 1; s <= 3; s++) {
                const y = base - m.h * s * .2;
                ctx.beginPath(); ctx.moveTo(m.x + 6, y); ctx.lineTo(m.x + m.w - 5, y + Math.sin(m.seed + s) * 3); ctx.stroke();
            }
        }
    }

    // Grains et filets de sable dans l'air : le ciel reste lisible mais vivant.
    ctx.save();
    for(const mote of skyMotes) {
        mote.x-=mote.speed*(gameState==='playing'?speed/PIPE_SPEED_BASE:.3);
        if(mote.x+mote.len<0){mote.x=W+Math.random()*30;mote.y=80+Math.random()*(H-170);}
        ctx.strokeStyle = sectorIndex === 2
            ? `rgba(160,185,255,${mote.alpha * .8})`
            : `rgba(255,211,145,${mote.alpha})`;
        ctx.lineWidth = sectorIndex === 1 ? 1.15 : .8;
        ctx.beginPath(); ctx.moveTo(mote.x, mote.y);
        ctx.lineTo(mote.x + mote.len * (sectorIndex === 1 ? 1.7 : 1), mote.y + (sectorIndex === 1 ? 2 : 0)); ctx.stroke();
    }
    ctx.restore();

    for (let layerIndex = 0; layerIndex < dunes.length; layerIndex++) {
        const layer = dunes[layerIndex];
        if (gameState === 'playing') {
            for (const p of layer.pts) p.x -= layer.speed * (speed / PIPE_SPEED_BASE);
        }
        // Ré-enroulement
        const first = layer.pts[0];
        if (first.x < -80) {
            layer.pts.shift();
            const last = layer.pts[layer.pts.length - 1];
            layer.pts.push({
                x: last.x + (W + 120) / (layer.pts.length),
                y: H - layer.heightBase - 5 - Math.random() * 25,
            });
        }
        // Tracé lissé
        ctx.fillStyle = colors[layerIndex + 1];
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (let i = 0; i < layer.pts.length - 1; i++) {
            const p0 = layer.pts[i], p1 = layer.pts[i + 1];
            const cx = (p0.x + p1.x) / 2;
            const cy = (p0.y + p1.y) / 2 - (sectorIndex === 1 ? 1 : 5);
            ctx.quadraticCurveTo(p0.x, p0.y, cx, cy);
            ctx.quadraticCurveTo(p1.x, p1.y, p1.x, p1.y);
        }
        ctx.lineTo(W, H);
        ctx.closePath(); ctx.fill();

        ctx.strokeStyle = sectorIndex === 2 ? 'rgba(126,151,225,.13)' : 'rgba(255,220,145,.1)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i < layer.pts.length; i++) {
            const p = layer.pts[i];
            if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
    }
    // Sol dur
    ctx.fillStyle = colors[1];
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    ctx.fillStyle = colors[3];
    ctx.fillRect(0, H - 4, W, 4);
    ctx.fillStyle = currentSector().tint;
    ctx.fillRect(0, H * 0.35, W, H * 0.65);
}

// ──────────────────────────────────────────────
//  DESSIN : PILIERS ROCHEUX
// ──────────────────────────────────────────────
function drawPipe(pipe) {
    const topH = pipe.topH;
    const botY = topH + GAP;
    const w = PIPE_W;
    const schemes = [
        { shadow: '#251408', mid: '#65401f', light: '#91633a', edge: 'rgba(236,169,92,.24)' },
        { shadow: '#160806', mid: '#4a1d14', light: '#803b24', edge: 'rgba(255,130,72,.27)' },
        { shadow: '#070a17', mid: '#181e38', light: '#3d466c', edge: 'rgba(135,169,255,.34)' },
    ];
    const rock = schemes[sectorIndex];

    // Fonction utilitaire : pilier unique avec texture
    function drawPillar(x, y, h, isTop) {
        // Paroi de canyon irrégulière, pas un cylindre parfait.
        const grad = ctx.createLinearGradient(x, 0, x + w, 0);
        grad.addColorStop(0, rock.shadow);
        grad.addColorStop(0.28, rock.light);
        grad.addColorStop(0.66, rock.mid);
        grad.addColorStop(1, rock.shadow);
        ctx.fillStyle = grad;
        const steps=Math.max(3,Math.ceil(h/55)), left=[], right=[];
        for(let i=0;i<=steps;i++) {
            const yy=y+h*i/steps;
            const middleBulge = Math.sin(Math.PI * i / steps) * (sectorIndex === 1 ? 7 : 3);
            const rough = sectorIndex === 1 ? 5.5 : 3.5;
            left.push({x:x-middleBulge+Math.sin(pipe.seed+i*1.73)*rough,y:yy});
            right.push({x:x+w+middleBulge+Math.cos(pipe.seed*.7+i*1.31)*rough,y:yy});
        }
        ctx.beginPath(); ctx.moveTo(left[0].x,left[0].y);
        for(let i=1;i<left.length;i++) ctx.lineTo(left[i].x,left[i].y);
        for(let i=right.length-1;i>=0;i--) ctx.lineTo(right[i].x,right[i].y);
        ctx.closePath(); ctx.fill();

        // Large facette éclairée qui casse encore la lecture de « tuyau ».
        ctx.fillStyle = sectorIndex === 2 ? 'rgba(123,151,225,.16)' : 'rgba(230,139,76,.15)';
        ctx.beginPath(); ctx.moveTo(x+w*.16,y); ctx.lineTo(x+w*.43,y);
        ctx.lineTo(x+w*.34,y+h); ctx.lineTo(x+w*.08,y+h); ctx.closePath(); ctx.fill();

        // Stries horizontales
        ctx.strokeStyle = sectorIndex === 2 ? 'rgba(130,165,255,.11)' : 'rgba(0,0,0,0.28)';
        ctx.lineWidth = 1;
        for (let i = 0; i < h; i += 18) {
            ctx.beginPath();
            ctx.moveTo(x + 4, y + i + Math.sin(i * 0.5 + pipe.seed) * 3);
            ctx.lineTo(x + w - 4, y + i + Math.cos(i * 0.5 + pipe.seed) * 3);
            ctx.stroke();
        }

        // Arête lumineuse : souligne immédiatement la zone de collision dans les ambiances chargées.
        ctx.strokeStyle = rock.edge; ctx.lineWidth = sectorIndex === 2 ? 2 : 1.2;
        ctx.beginPath();
        const rimX = isTop ? x + w - 1 : x + 1;
        ctx.moveTo(rimX, y); ctx.lineTo(rimX + Math.sin(pipe.seed) * 2, y + h); ctx.stroke();

        if (sectorIndex === 1) {
            ctx.strokeStyle = 'rgba(255,158,88,.2)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x + w * .72, y + h * .14);
            ctx.lineTo(x + w * .48, y + h * .33); ctx.lineTo(x + w * .61, y + h * .48); ctx.stroke();
        } else if (sectorIndex === 2) {
            ctx.fillStyle = 'rgba(103,145,255,.18)';
            for (let c = 0; c < 3; c++) {
                const cy = y + h * (.2 + c * .27);
                ctx.beginPath(); ctx.moveTo(x + 7, cy); ctx.lineTo(x + 14, cy - 9); ctx.lineTo(x + 17, cy + 3); ctx.closePath(); ctx.fill();
            }
        }

        // Lèvre brisée tournée vers le passage.
        const capY = isTop ? y + h : y;
        ctx.fillStyle = rock.light;
        ctx.beginPath();
        ctx.moveTo(x-5,capY);
        for(let i=0;i<=6;i++) {
            const xx=x-5+(w+10)*i/6;
            const tooth=(i%2?5:2)*(isTop?1:-1);
            ctx.lineTo(xx,capY+tooth);
        }
        ctx.lineTo(x+w+4,capY+(isTop?-7:7));
        ctx.lineTo(x-4,capY+(isTop?-7:7)); ctx.closePath(); ctx.fill();
        ctx.fillStyle = rock.shadow;
        ctx.fillRect(x+4,capY+(isTop?-4:1),w-8,3);
    }

    drawPillar(pipe.x, 0, topH, true);
    drawPillar(pipe.x, botY, H - botY, false);

    // Lèvre illuminée après un frôlement : remplace le tremblement d'écran, qui gênait
    // la lecture au pire moment (cf. doctrine sur SHAKE). L'effet est local, marque
    // l'endroit exact de l'exploit, et s'intensifie avec la série sans jamais bouger l'image.
    if (pipe.grazeGlow > 0) {
        const t = pipe.grazeGlow / 16;
        const hot = pipe.grazeHot || 0;
        const lipY = pipe.grazeTop ? topH : botY;
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const halo = ctx.createLinearGradient(0, lipY - 26, 0, lipY + 26);
        const col = hot > .6 ? '255,170,70' : '255,214,110';
        halo.addColorStop(0,   `rgba(${col},0)`);
        halo.addColorStop(0.5, `rgba(${col},${0.5 * t})`);
        halo.addColorStop(1,   `rgba(${col},0)`);
        ctx.fillStyle = halo;
        ctx.fillRect(pipe.x - 5, lipY - 26, w + 10, 52);
        ctx.strokeStyle = `rgba(255,238,190,${0.9 * t})`;
        ctx.lineWidth = 2 + hot * 1.6;
        ctx.beginPath();
        ctx.moveTo(pipe.x - 3, lipY);
        ctx.lineTo(pipe.x + w + 3, lipY);
        ctx.stroke();
        ctx.restore();
    }
}

// ──────────────────────────────────────────────
//  DESSIN : VER GÉANT (apparition rare)
// ──────────────────────────────────────────────
function maybeSpawnWorm() {
    if (worm || Math.random() > 0.002) return;
    const hazard = score >= WORM_HAZARD_MIN_SCORE;
    worm = { x: W + 30, y: H - 40 - Math.random() * 20, phase: 0, segments: 10, hazard };
    if (hazard) sndWormWarn();
}
function drawWorm() {
    if (!worm) return;
    worm.x -= speed * 0.7;
    worm.phase += 0.1;
    const segCount = worm.segments;
    for (let i = segCount - 1; i >= 0; i--) {
        const sx = worm.x + i * 14;
        const sy = worm.y + Math.sin(worm.phase + i * 0.7) * 9;
        const r = 6 - i * 0.3;
        const grad = ctx.createRadialGradient(sx - 2, sy - 2, r * 0.2, sx, sy, r);
        grad.addColorStop(0, worm.hazard ? '#c07040' : '#a07040');
        grad.addColorStop(1, worm.hazard ? '#6a1a10' : '#4a2a10');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(sx, sy, Math.max(2, r), 0, Math.PI * 2); ctx.fill();
        if (i === 0) {
            ctx.fillStyle = '#c44';
            ctx.beginPath(); ctx.arc(sx + 5, sy, 4, 0, Math.PI * 2); ctx.fill();
        }
    }
    if (worm.hazard) {
        ctx.fillStyle = 'rgba(255,60,40,0.12)';
        ctx.beginPath(); ctx.arc(worm.x, worm.y, 16, 0, Math.PI * 2); ctx.fill();
    }
    if (worm.x < -150) worm = null;
}
function collidesWorm() {
    if (!worm || !worm.hazard) return false;
    const bx = BIRD_X + BIRD_W / 2, by = bird.y + BIRD_H / 2;
    for (let i = 0; i < worm.segments; i++) {
        const sx = worm.x + i * 14;
        const sy = worm.y + Math.sin(worm.phase + i * 0.7) * 9;
        const r = (6 - i * 0.3) + 9; // marge indulgente
        const dx = bx - sx, dy = by - sy;
        if (dx * dx + dy * dy < r * r) return true;
    }
    return false;
}

// ──────────────────────────────────────────────
//  DESSIN : ORNITHOPTÈRE
// ──────────────────────────────────────────────
function drawBird() {
    ctx.save();
    const cx = BIRD_X + BIRD_W / 2, cy = bird.y + BIRD_H / 2;
    ctx.translate(cx, cy);

    // La rotation et l'animation sont mises à jour dans le tick physique.
    ctx.rotate(bird.rot * Math.PI / 180);

    // Squash & stretch : l'appareil s'étire à la verticale quand il grimpe (coup d'aile) et
    // s'aplatit à l'impact. C'est le principe n°1 de l'animation Disney — il donne
    // l'impression d'un corps qui encaisse, là où un sprite rigide reste inerte.
    // Ease-out quad sur le retour, et l'axe secondaire ne compense qu'à 60% (conserve du volume).
    if (squashT > 0) {
        const e = squashT * squashT;                 // décroissance quadratique = retour vif puis doux
        const amp = 0.16 * e * squashDir;
        ctx.scale(1 - amp * 0.6, 1 + amp);
    }

    if (orniBodyReady) {
        // Impulsion moteur et halo : donnent une présence au petit sprite sans agrandir sa hitbox.
        const enginePulse = .65 + Math.sin(frameCount * .7) * .2;
        const engineGlow = ctx.createRadialGradient(-28, 2, 1, -28, 2, 20);
        engineGlow.addColorStop(0, `rgba(130,205,255,${enginePulse})`);
        engineGlow.addColorStop(.35, `rgba(65,135,255,${enginePulse * .42})`);
        engineGlow.addColorStop(1, 'rgba(30,80,255,0)');
        ctx.fillStyle = engineGlow; ctx.beginPath(); ctx.ellipse(-28, 2, 22, 7, 0, 0, Math.PI * 2); ctx.fill();

        // Quatre ailes seulement, toutes au-dessus ou au niveau du fuselage.
        // Les deux paires battent en opposition autour d'une amplitude courte.
        const flapA=Math.sin(bird.wingPhase)*4.1;
        const flapB=Math.sin(bird.wingPhase+Math.PI)*4.1;
        const wings=[
            [-4,-5,-48,-12+flapA,2.8,.58],[-1,-3,-43,-5+flapB,2.3,.42],
            [ 1,-5, 47,-12+flapB,2.8,.58],[ 3,-3, 42,-5+flapA,2.3,.42],
        ];
        ctx.save(); ctx.lineCap='round'; ctx.globalCompositeOperation='screen';
        for(const [x0,y0,x1,y1,width,alpha] of wings) {
            ctx.strokeStyle=`rgba(184,166,112,${alpha})`; ctx.lineWidth=width;
            ctx.beginPath(); ctx.moveTo(x0,y0);
            ctx.quadraticCurveTo((x0+x1)*.52,y1-(y1-y0)*.18,x1,y1); ctx.stroke();
            ctx.strokeStyle=`rgba(244,218,151,${alpha*.32})`; ctx.lineWidth=.7;
            ctx.beginPath(); ctx.moveTo(x0,y0-1); ctx.lineTo(x1,y1-1); ctx.stroke();
        }
        ctx.restore();
        ctx.drawImage(
            orniBodySprite,
            0, 0, ORNI_BODY_SIZE, ORNI_BODY_SIZE,
            -ORNI_DRAW_SIZE/2, -ORNI_DRAW_SIZE/2, ORNI_DRAW_SIZE, ORNI_DRAW_SIZE
        );
        if (gameState === 'playing' && frameCount % 2 === 0)
            emitSand(cx-BIRD_W/2-5,cy,1);
        ctx.restore();
        return;
    }

    // Ancien dessin procédural conservé si le sprite n'est pas disponible.
    const wingFlap = Math.sin(bird.wingPhase) * 0.55;

    // Ombre portée (décalée)
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#000';
    ctx.translate(0, 12);
    ctx.beginPath(); ctx.ellipse(0, 0, BIRD_W / 2, BIRD_H / 2.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Corps principal
    ctx.fillStyle = PAL.body;
    ctx.beginPath(); ctx.ellipse(0, 0, BIRD_W / 2.2, BIRD_H / 2.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7a5020';
    ctx.beginPath(); ctx.ellipse(BIRD_W / 4.5, -2, 7, 4.5, -0.1, 0, Math.PI * 2); ctx.fill();

    // Cockpit (verrière)
    ctx.fillStyle = PAL.cockpit;
    ctx.beginPath(); ctx.ellipse(BIRD_W / 5, -3, 5, 6, 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,200,100,0.25)';
    ctx.beginPath(); ctx.ellipse(BIRD_W / 5, -5, 3, 3, 0, 0, Math.PI * 2); ctx.fill();

    // Ailes gauches et droites
    const wingSpan = BIRD_W / 2 + 14;
    ctx.fillStyle = PAL.wing;
    ctx.save();
    ctx.rotate(wingFlap);
    // Aile haute
    ctx.beginPath();
    ctx.moveTo(4, -2);
    ctx.lineTo(-wingSpan, -BIRD_H + 4);
    ctx.lineTo(-wingSpan + 6, -BIRD_H + 12);
    ctx.lineTo(2, 2);
    ctx.closePath(); ctx.fill();
    // Membrane
    ctx.fillStyle = PAL.wingMembrane;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-wingSpan + 10, -BIRD_H + 15);
    ctx.lineTo(-wingSpan + 16, -BIRD_H + 18);
    ctx.lineTo(2, 3);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    ctx.fillStyle = PAL.wing;
    ctx.save();
    ctx.rotate(-wingFlap);
    // Aile basse
    ctx.beginPath();
    ctx.moveTo(4, 2);
    ctx.lineTo(-wingSpan, BIRD_H - 4);
    ctx.lineTo(-wingSpan + 6, BIRD_H - 12);
    ctx.lineTo(2, -2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = PAL.wingMembrane;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-wingSpan + 10, BIRD_H - 15);
    ctx.lineTo(-wingSpan + 16, BIRD_H - 18);
    ctx.lineTo(2, -3);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // Queue (stabilisateur)
    ctx.fillStyle = PAL.body;
    ctx.beginPath();
    ctx.moveTo(-BIRD_W / 2, 0);
    ctx.lineTo(-BIRD_W / 2 - 12, -6);
    ctx.lineTo(-BIRD_W / 2 - 12, 6);
    ctx.closePath(); ctx.fill();

    // Trainée de poussière
    if (gameState === 'playing' && frameCount % 2 === 0) {
        emitSand(cx - BIRD_W / 2 - 5, cy, 1);
    }

    ctx.restore();
}

function drawShieldRing() {
    if (!shielded) return;
    const cx = BIRD_X + BIRD_W / 2, cy = bird.y + BIRD_H / 2;
    ctx.save();
    ctx.strokeStyle = `rgba(100,180,255,${0.4 + Math.sin(frameCount * 0.2) * 0.15})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, BIRD_W / 2 + 10, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
}

// ──────────────────────────────────────────────
//  COLLECTIBLES (épice + bouclier)
// ──────────────────────────────────────────────
function drawSpiceItem(sp) {
    if (sp.collected) return;
    sp.sparkle += 0.08;
    const glow = 0.45 + Math.sin(sp.sparkle) * 0.35;
    ctx.save();
    ctx.shadowBlur = 12; ctx.shadowColor = PAL.gold;
    ctx.fillStyle = `rgba(255,230,150,${glow * 0.6})`;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fffef5';
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y - 6); ctx.lineTo(sp.x + 4, sp.y);
    ctx.lineTo(sp.x, sp.y + 6); ctx.lineTo(sp.x - 4, sp.y);
    ctx.closePath(); ctx.fill();
    ctx.restore();
}
function drawPowerup(pu) {
    if (pu.collected) return;
    pu.phase += 0.06;
    const py = pu.y + Math.sin(pu.phase) * 3;
    ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText('🛡️', pu.x, py);
    ctx.textBaseline = 'alphabetic';
}

function drawChallengeItem(item) {
    item.phase += .07;
    const pulse = .72 + Math.sin(item.phase) * .22;
    ctx.save(); ctx.translate(item.x, item.y); ctx.rotate(item.phase * .35);
    ctx.shadowBlur = 18; ctx.shadowColor = '#ff7a2f';
    ctx.strokeStyle = `rgba(255,174,74,${pulse})`; ctx.lineWidth = 2.2;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 3;
        const px = Math.cos(a) * 15, py = Math.sin(a) * 15;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.stroke();
    ctx.rotate(-item.phase * .35);
    ctx.fillStyle = '#fff0b0'; ctx.font = 'bold 16px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', 0, -1);
    ctx.restore();

    ctx.save(); ctx.textAlign = 'center'; ctx.font = 'bold 8px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255,213,135,.82)';
    ctx.fillText('CONTRAT · ' + item.edge, item.x, item.y + (item.y < H / 2 ? 27 : -24));
    ctx.restore();
}

// ──────────────────────────────────────────────
//  PARTICULES (sable)
// ──────────────────────────────────────────────
function drawParticles() {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    // Pendant un hitstop, les particules se figent avec le reste du monde : une explosion
    // suspendue en l'air pendant le gel vend beaucoup mieux l'impact qu'un nuage qui
    // continue de s'étaler tout seul.
    const frozen = hitstop > 0;
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (!frozen) { p.x += p.vx; p.y += p.vy; p.life--; }
        if (p.life <= 0 || p.x < -15) { particles.splice(i, 1); continue; }
        const alpha = (p.life / p.maxLife) * 0.7;
        ctx.fillStyle = `hsla(${p.hue}, 65%, 65%, ${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

// Débris de crash : morceaux de coque qui retombent, rebondissent une fois et RESTENT.
// Ils ne s'effacent jamais tant qu'on n'a pas relancé — c'est la « permanence » de Nijman :
// la carcasse au sol prouve que le crash a eu lieu, l'écran de mort n'est plus abstrait.
function drawDebris() {
    const frozen = hitstop > 0;
    const ground = H - 34;
    ctx.save();
    for (const d of debris) {
        if (!frozen && !d.rested) {
            d.vy += 0.42;            // gravité un peu plus forte que celle de l'orni : ça tombe sec
            d.x += d.vx; d.y += d.vy;
            d.rot += d.vr;
            d.vx *= 0.99;
            if (d.y >= ground) {
                d.y = ground;
                if (Math.abs(d.vy) > 2.2) { d.vy *= -0.32; d.vx *= 0.55; d.vr *= 0.4; } // un seul rebond franc
                else { d.rested = true; d.vy = 0; d.vx = 0; d.vr = 0; }
            }
        }
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.rot);
        ctx.fillStyle = d.color;
        ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
        ctx.restore();
    }
    ctx.restore();
}

function drawFloaters() {
    if (!floaters.length) return;
    ctx.save();
    ctx.textAlign = 'center';
    for (const f of floaters) {
        const t = f.life / f.maxLife;
        // Petit « pop » d'échelle à l'apparition puis fondu : attire l'œil sans le retenir.
        const pop = 1 + (1 - Math.min(1, (1 - t) * 6)) * 0.35;
        ctx.globalAlpha = Math.min(1, t * 1.8);
        ctx.font = `bold ${f.size * pop}px "Segoe UI", sans-serif`;
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(8,4,1,0.75)';
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, f.x, f.y);
    }
    ctx.restore();
}

// ──────────────────────────────────────────────
//  MÉTÉO DYNAMIQUE
// ──────────────────────────────────────────────
function weatherLabel() {
    if (!weather || !weather.type) return '';
    if (weather.type === 'sandstorm') return 'TEMPÊTE DE SABLE';
    if (weather.type === 'gust') return weather.direction > 0 ? 'RAFALES DESCENDANTES' : 'RAFALES ASCENDANTES';
    return 'ORAGE STATIQUE';
}

function startWeatherWarning() {
    const type = currentSector().weather;
    weather = {
        phase: 'warning', type, timer: WEATHER_WARNING_FRAMES,
        direction: type === 'gust' ? (Math.random() < 0.5 ? -1 : 1) : 0,
    };
    sndWeatherWarn();
}

function applyStormCharge() {
    const cx = BIRD_X + BIRD_W / 2, cy = bird.y + BIRD_H / 2;
    stormFlashTimer = 24;
    emitBurst(cx, cy, 24, 205);
    sndStormCharge();
    if (shielded) {
        shielded = false;
        shieldGrace = Math.max(shieldGrace, 12);
        stormInterference = { timer: 90, multiplier: 1, label: 'CHARGE ABSORBÉE PAR LE BOUCLIER' };
        sndShield();
        return;
    }
    const weakened = Math.random() < .5;
    stormInterference = weakened
        ? { timer: 150, multiplier: .78, label: 'PROPULSEURS AFFAIBLIS' }
        : { timer: 150, multiplier: 1.18, label: 'PROPULSEURS EN SURTENSION' };
    bird.vy += weakened ? .45 : -.3;
}

function updateWeather() {
    if (weather.phase === 'idle') {
        weatherCooldown--;
        if (weatherCooldown <= 0) startWeatherWarning();
        return;
    }
    weather.timer--;
    if (weather.phase === 'warning' && weather.timer <= 0) {
        weather.phase = 'active';
        weather.timer = weather.type === 'sandstorm' ? 240 : 180;
        weather.strikeTimer = weather.type === 'staticstorm' ? 55 + Math.floor(Math.random() * 31) : 0;
        weather.struck = false;
        return;
    }
    if (weather.phase === 'active') {
        // Forces volontairement légères : elles changent le rythme sans prendre le contrôle au joueur.
        if (weather.type === 'gust') bird.vy += weather.direction * 0.008;
        if (weather.type === 'staticstorm' && !weather.struck && --weather.strikeTimer <= 0) {
            weather.struck = true;
            applyStormCharge();
        }
        if (weather.timer <= 0) {
            weather = { phase: 'idle', type: null, timer: 0, direction: 0 };
            weatherCooldown = 480 + Math.floor(Math.random() * 241);
        }
    }
}

function emitBurst(x, y, count, hue = 42) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const force = 1.2 + Math.random() * 3.2;
        particles.push({
            x, y, vx: Math.cos(angle) * force, vy: Math.sin(angle) * force,
            life: 36 + Math.random() * 28, maxLife: 64,
            size: 1.8 + Math.random() * 3.2, hue: hue + Math.random() * 24,
        });
    }
}

function drawWeather() {
    if (gameState !== 'playing' || !weather || weather.phase === 'idle') return;
    ctx.save();
    if (weather.phase === 'warning') {
        const pulse = 0.65 + Math.sin(frameCount * 0.18) * 0.25;
        const warningTint = weather.type === 'staticstorm' ? '78,105,190' : '205,90,35';
        ctx.fillStyle = `rgba(${warningTint},${0.08 + pulse * 0.08})`; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = `rgba(12,6,3,${0.58 + pulse * 0.12})`;
        ctx.fillRect(42, H - 91, W - 84, 43);
        ctx.strokeStyle = `rgba(255,190,80,${pulse})`;
        ctx.lineWidth = 2; ctx.strokeRect(42.5, H - 90.5, W - 85, 42);
        ctx.textAlign = 'center'; ctx.font = 'bold 14px "Segoe UI", sans-serif';
        ctx.fillStyle = '#ffd27a';
        ctx.fillText('⚠  ' + weatherLabel(), W / 2, H - 65);
        ctx.restore();
        return;
    }

    if (weather.type === 'sandstorm') {
        // Densité en vagues : alternance de courtes accalmies et de murs de sable aveuglants.
        const wave = (Math.sin(frameCount * .052) + 1) * .5;
        const density = .34 + Math.pow(wave, 1.8) * .43;
        ctx.fillStyle = `rgba(151,78,31,${density})`; ctx.fillRect(0, 0, W, H);

        const frontX = ((frameCount * 5.4) % (W + 360)) - 180;
        const wall = ctx.createLinearGradient(frontX - 155, 0, frontX + 155, 0);
        wall.addColorStop(0, 'rgba(106,48,18,0)');
        wall.addColorStop(.42, `rgba(103,45,16,${.18 + wave * .26})`);
        wall.addColorStop(.6, `rgba(235,157,76,${.2 + wave * .25})`);
        wall.addColorStop(1, 'rgba(235,157,76,0)');
        ctx.fillStyle = wall; ctx.fillRect(frontX - 165, 0, 330, H);

        ctx.fillStyle = `rgba(78,33,12,${.12 + wave * .12})`;
        for (let i = 0; i < 14; i++) {
            const rawX = i * 83 - frameCount * (3.8 + (i % 3));
            const cx = ((rawX % (W + 260)) + (W + 260)) % (W + 260) - 100;
            const cy = 45 + (i * 67 % 520);
            ctx.beginPath(); ctx.ellipse(cx, cy, 125, 31, -.18, 0, Math.PI * 2); ctx.fill();
        }
        // Rafales en grains, réparties sur trois profondeurs pour éviter l'effet « pluie oblique ».
        const grainLayers = [
            { count: 105, speed: 2.6, drift: .18, size: .65, alpha: .22 },
            { count: 82,  speed: 4.7, drift: .34, size: 1.15, alpha: .34 },
            { count: 48,  speed: 7.4, drift: .52, size: 2.05, alpha: .46 },
        ];
        for (let layerIndex = 0; layerIndex < grainLayers.length; layerIndex++) {
            const layer = grainLayers[layerIndex];
            ctx.fillStyle = `rgba(255,215,145,${layer.alpha * (.55 + wave * .45)})`;
            ctx.beginPath();
            for (let i = 0; i < layer.count; i++) {
                const span = W + 100;
                const rawX = i * (61 + layerIndex * 18) - frameCount * layer.speed + layerIndex * 37;
                const x = ((rawX % span) + span) % span - 50;
                const seedY = (i * 83 + layerIndex * 127) % H;
                const y = (seedY + frameCount * layer.drift + Math.sin(i * 2.17 + frameCount * .018) * (7 + layerIndex * 4)) % H;
                const cluster = .55 + .45 * Math.sin(i * 1.73 + frameCount * .035 + layerIndex);
                const radius = layer.size * (.7 + cluster * .5);
                ctx.moveTo(x + radius, y);
                ctx.arc(x, y, radius, 0, Math.PI * 2);
            }
            ctx.fill();
        }
    } else if (weather.type === 'gust') {
        const gustGrad = ctx.createLinearGradient(0, 0, 0, H);
        gustGrad.addColorStop(0, weather.direction > 0 ? 'rgba(235,170,110,.18)' : 'rgba(255,255,255,0)');
        gustGrad.addColorStop(1, weather.direction < 0 ? 'rgba(235,170,110,.18)' : 'rgba(255,255,255,0)');
        ctx.fillStyle = gustGrad; ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = 'rgba(255,230,195,0.38)'; ctx.lineWidth = 1.4;
        for (let i = 0; i < 20; i++) {
            const x = ((i * 97 - frameCount * 5) % (W + 120)) - 60;
            const rawY = i * 53 + frameCount * weather.direction * 1.8;
            const y = ((rawY % H) + H) % H;
            ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 35, y + weather.direction * 8, x + 72, y + weather.direction * 18); ctx.stroke();
        }
    } else {
        // Orage statique : éclairs brefs et arcs autour de l'appareil, sans « vagues montantes ».
        const flashPhase = weather.timer % 58;
        ctx.fillStyle = `rgba(4,7,25,${.18 + (flashPhase < 5 ? .08 : 0)})`; ctx.fillRect(0, 0, W, H);
        if (flashPhase < 5) {
            const flash = (5 - flashPhase) / 5;
            ctx.fillStyle = `rgba(155,185,255,${flash * .2})`; ctx.fillRect(0, 0, W, H);
            const boltX = 65 + ((Math.floor(frameCount / 58) * 137) % 285);
            ctx.strokeStyle = `rgba(195,218,255,${.55 + flash * .35})`; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(boltX, 0);
            for (let y = 22; y < H * .62; y += 24) ctx.lineTo(boltX + Math.sin(y * .18 + frameCount) * 13, y);
            ctx.stroke();
        }
        if (stormFlashTimer > 0) {
            const bx = BIRD_X + BIRD_W / 2, by = bird.y + BIRD_H / 2;
            const strikeAlpha = Math.min(1, stormFlashTimer / 10);
            ctx.fillStyle = `rgba(120,170,255,${strikeAlpha * .16})`;
            ctx.beginPath(); ctx.arc(bx, by, 48, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = `rgba(155,196,255,${strikeAlpha * .82})`; ctx.lineWidth = 1.5;
            for (let a = 0; a < 4; a++) {
                const start = frameCount * .19 + a * Math.PI * .5;
                ctx.beginPath();
                for (let s = 0; s <= 6; s++) {
                    const ang = start + s * .21, radius = 23 + (s % 2) * 8;
                    const x = bx + Math.cos(ang) * radius, y = by + Math.sin(ang) * radius;
                    if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }
    }
    ctx.fillStyle = 'rgba(7,4,2,0.5)'; ctx.fillRect(W - 165, H - 33, 155, 23);
    ctx.textAlign = 'right'; ctx.font = 'bold 9px "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255,224,174,0.82)';
    ctx.fillText(weatherLabel(), W - 17, H - 18);
    ctx.restore();
}

function drawSectorTransition() {
    if (sectorBannerTimer <= 120) return;
    const progress = Math.max(0, Math.min(1, (180 - sectorBannerTimer) / 60));
    const pulse = Math.sin(progress * Math.PI);
    ctx.save();
    ctx.fillStyle = sectorIndex === 2
        ? `rgba(78,103,190,${pulse * .3})`
        : `rgba(226,116,46,${pulse * .28})`;
    ctx.fillRect(0, 0, W, H);
    const curtainX = progress * (W + 220) - 110;
    const curtain = ctx.createLinearGradient(curtainX - 100, 0, curtainX + 100, 0);
    curtain.addColorStop(0, 'rgba(255,210,130,0)');
    curtain.addColorStop(.5, `rgba(255,220,160,${pulse * .42})`);
    curtain.addColorStop(1, 'rgba(255,210,130,0)');
    ctx.fillStyle = curtain; ctx.fillRect(curtainX - 110, 0, 220, H);
    ctx.restore();
}

function drawScore() {
    ctx.save();
    ctx.font = 'bold 44px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.fillStyle = PAL.gold;
    ctx.fillText(score, W / 2, 65);
    if (combo > 1) {
        ctx.shadowBlur = 0;
        // Le compteur enfle brièvement à chaque frôlement puis retombe : sans ce pulse,
        // rien ne signale au joueur QUAND sa série vient de progresser.
        const cf = comboFlash / 12;
        ctx.save();
        ctx.translate(W / 2, 88);
        ctx.scale(1 + cf * 0.4, 1 + cf * 0.4);
        ctx.font = 'bold 14px "Segoe UI", sans-serif';
        ctx.fillStyle = cf > 0 ? '#ffd257' : '#ff8800';
        ctx.fillText('x' + combo + ' COMBO', 0, 0);
        ctx.restore();
        // Jauge de fenêtre de combo : matérialise le temps qu'il reste pour enchaîner.
        // Le comboTimer existait déjà mais était invisible — le joueur ne pouvait pas jouer avec.
        if (comboTimer > 0) {
            const wRatio = comboTimer / 90, barW = 54;
            ctx.fillStyle = 'rgba(255,255,255,0.14)';
            ctx.fillRect(W / 2 - barW / 2, 94, barW, 3);
            ctx.fillStyle = wRatio < 0.3 ? '#c4553c' : '#ff9d3c';
            ctx.fillRect(W / 2 - barW / 2, 94, barW * wRatio, 3);
        }
    }

    // Secteur courant et mission : compacts pour préserver la lisibilité du passage.
    ctx.shadowBlur = 0; ctx.textAlign = 'left';
    ctx.font = 'bold 10px "Segoe UI", sans-serif'; ctx.fillStyle = 'rgba(255,224,174,0.78)';
    ctx.fillText(currentSector().icon + ' ' + currentSector().name, 11, 20);
    if (mission) {
        ctx.save();
        if (mission.completed) ctx.globalAlpha = Math.min(1, mission.dismissTimer / 45);
        ctx.fillStyle = 'rgba(7,4,2,0.58)'; ctx.fillRect(10, 101, 224, 39);
        ctx.strokeStyle = mission.completed ? 'rgba(110,225,145,0.72)' : 'rgba(205,164,52,0.48)';
        ctx.strokeRect(10.5, 101.5, 223, 38);
        ctx.font = 'bold 10px "Segoe UI", sans-serif';
        ctx.fillStyle = mission.completed ? '#8ee6a8' : '#e4c16d';
        ctx.fillText((mission.completed ? '✓ ' : 'MISSION  ') + mission.label, 18, 116);
        ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(18, 124, 186, 6);
        ctx.fillStyle = mission.completed ? '#65d98b' : PAL.gold;
        ctx.fillRect(18, 124, 186 * (mission.progress / mission.target), 6);
        ctx.textAlign = 'right'; ctx.fillStyle = '#f5deb3';
        ctx.fillText(mission.progress + '/' + mission.target, 225, 131);
        ctx.restore();
    } else {
        ctx.font = 'bold 9px "Segoe UI", sans-serif'; ctx.fillStyle = 'rgba(235,190,105,.7)';
        ctx.fillText('◇ CHERCHEZ UNE BALISE DE CONTRAT', 11, 113);
    }

    if (sectorBannerTimer > 0) {
        const alpha = Math.min(1, sectorBannerTimer / 35);
        ctx.textAlign = 'center';
        ctx.fillStyle = `rgba(7,4,2,${0.52 * alpha})`; ctx.fillRect(58, 162, W - 116, 48);
        ctx.strokeStyle = `rgba(231,190,101,${0.58 * alpha})`; ctx.strokeRect(58.5, 162.5, W - 117, 47);
        ctx.font = '10px "Segoe UI", sans-serif'; ctx.fillStyle = `rgba(225,195,145,${alpha})`;
        ctx.fillText('NOUVEAU SECTEUR', W / 2, 178);
        ctx.font = 'bold 17px "Segoe UI", sans-serif'; ctx.fillStyle = `rgba(255,214,120,${alpha})`;
        ctx.fillText(currentSector().icon + ' ' + currentSector().name, W / 2, 199);
    }

    if (mission && mission.toast > 0) {
        const alpha = Math.min(1, mission.toast / 35);
        ctx.textAlign = 'center'; ctx.font = 'bold 15px "Segoe UI", sans-serif';
        ctx.fillStyle = `rgba(115,240,155,${alpha})`;
        ctx.fillText('MISSION ACCOMPLIE  +8', W / 2, 154);
    }
    if (stormInterference) {
        const alpha = Math.min(1, stormInterference.timer / 25);
        ctx.textAlign = 'center'; ctx.font = 'bold 11px "Segoe UI", sans-serif';
        ctx.fillStyle = `rgba(5,9,24,${.68 * alpha})`; ctx.fillRect(64, H - 73, W - 128, 29);
        ctx.strokeStyle = `rgba(115,165,255,${.62 * alpha})`; ctx.strokeRect(64.5, H - 72.5, W - 129, 28);
        ctx.fillStyle = stormInterference.multiplier === 1
            ? `rgba(125,205,255,${alpha})`
            : `rgba(190,215,255,${alpha})`;
        ctx.fillText('⚡ ' + stormInterference.label, W / 2, H - 54);
    }
    ctx.restore();
}

// ──────────────────────────────────────────────
//  COLLISIONS (tolérance)
// ──────────────────────────────────────────────
function collides() {
    // Fuselage seul : plus large que l'ancienne petite boîte, mais les ailes restent indulgentes.
    const cx = BIRD_X + BIRD_W / 2, cy = bird.y + BIRD_H / 2;
    const left = cx - BIRD_HIT_HALF_W, right = cx + BIRD_HIT_HALF_W;
    const top = cy - BIRD_HIT_HALF_H, bottom = cy + BIRD_HIT_HALF_H;
    if (top < 0 || bottom > H - GROUND_H) return true;
    for (const p of pipes) {
        if (right > p.x && left < p.x + PIPE_W) {
            if (top < p.topH || bottom > p.topH + GAP) return true;
        }
    }
    return false;
}

// ──────────────────────────────────────────────
//  API SCORE (identique à l'original)
// ──────────────────────────────────────────────
async function submitScore(s) {
    if (!scoreSecret) await fetchSecret();
    if (!scoreSecret) return;
    const dur = Math.floor((Date.now() - startTime) / 1000);
    const hash = await sha256(GAME_ID + s + dur + scoreSecret);
    try {
        const r = await fetch('scores_api.php', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'submit', game: GAME_ID, score: s, duration: dur, hash })
        });
        const j = await r.json();
        if (!j.ok) console.warn('[orni_flap] score non enregistré côté serveur :', j.error || 'raison inconnue');
        if (j.ok && j.new_personal) {
            bestScore = s;
            localStorage.setItem('orni_best', String(s));
        }
        loadLeaderboard();
    } catch (e) {}
}
async function sha256(msg) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function fetchSecret() {
    try {
        const r = await fetch('scores_api.php', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'token', game: GAME_ID })
        });
        const j = await r.json();
        if (j.ok) scoreSecret = j.secret;
    } catch (e) {}
}
async function loadLeaderboard() {
    try {
        const r = await fetch('scores_api.php?action=leaderboard&game=' + GAME_ID + '&limit=10&scope=weekly', { credentials: 'same-origin' });
        const j = await r.json();
        if (!j.ok) return;
        const me = localStorage.getItem('user') || '';
        const ul = document.getElementById('lb-list');
        if (!j.leaderboard.length) { ul.innerHTML = '<li style="color:var(--muted)">Aucun score cette semaine</li>'; return; }
        ul.innerHTML = j.leaderboard.map((e, i) => {
            const medals = ['🥇', '🥈', '🥉'];
            const rank = medals[i] || (i + 1);
            const isMe = e.player === me;
            return `<li class="${isMe ? 'me' : ''}"><span class="rank">${rank}</span><span class="name">${esc(e.player)}</span><span class="pts">${e.score}</span></li>`;
        }).join('');
    } catch (e) {}
}
function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

// ──────────────────────────────────────────────
//  ACTION FLAP
// ──────────────────────────────────────────────
function flap() {
    if (gameState === 'menu') {
        gameState = 'playing';
        reset();
        bird.vy = FLAP_FORCE;
        sndFlap();
        fetchSecret();
        return;
    }
    if (gameState === 'dead') {
        if (frameCount > 30) {
            gameState = 'menu';
            reset();
        }
        return;
    }
    const flapMultiplier = stormInterference ? stormInterference.multiplier : 1;
    // Un flap qui vient d'une grosse chute doit se sentir plus fort qu'un flap de maintien :
    // on module l'étirement selon la vitesse encaissée juste avant le coup d'aile.
    const impactRatio = Math.min(1, Math.max(0, bird.vy) / 9);
    bird.vy = FLAP_FORCE * flapMultiplier;
    bird.wingPhase = 0;
    addSquash(1);                                  // étirement vertical : l'appareil « se tend » vers le haut
    emitSand(BIRD_X + BIRD_W / 2 - 12, bird.y + BIRD_H / 2 + 4, 3); // souffle sous l'appareil
    sndFlap();
}

document.addEventListener('pointerdown', e => {
    // Le contrôle fonctionne partout dans la page, sauf sur les liens et contrôles d'interface.
    if (e.target.closest && e.target.closest('a, button, input, select, textarea')) return;
    e.preventDefault();
    flap();
});
document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
});

// ──────────────────────────────────────────────
//  BOUCLE PRINCIPALE
// ──────────────────────────────────────────────
function tick() {
    if (gameState === 'dead') { frameCount++; return; }
    if (gameState !== 'playing') return;
    frameCount++;

    speed = PIPE_SPEED_BASE + Math.min(score * 0.028, 1.7);
    updateWeather();
    bird.vy += GRAVITY;
    bird.prevY = bird.y;          // position d'avant le déplacement : sert au frôlement balayé
    bird.y  += bird.vy;
    bird.rot += (Math.min(bird.vy*2.8,65)-bird.rot)*.12;
    bird.wingPhase = (bird.wingPhase + 1.05) % (Math.PI*2);

    if (comboTimer > 0) comboTimer--; else combo = 0;
    if (shieldGrace > 0) shieldGrace--;
    if (stormFlashTimer > 0) stormFlashTimer--;
    if (stormInterference && --stormInterference.timer <= 0) stormInterference = null;
    if (sectorBannerTimer > 0) sectorBannerTimer--;
    if (mission) {
        if (mission.toast > 0) mission.toast--;
        if (mission.completed && mission.dismissTimer > 0) {
            mission.dismissTimer--;
            if (mission.dismissTimer <= 0) {
                mission = null;
                challengeCooldown = 1;
            }
        }
    }

    nextPipeTimer--;
    if (nextPipeTimer <= 0) {
        const challengeSpawned = spawnPipe();
        const interval = Math.max(PIPE_INTERVAL_MIN, Math.round(PIPE_INTERVAL_BASE - score * 0.65));
        // Un contrat ouvre une fenêtre supplémentaire pour revenir de la trajectoire risquée.
        nextPipeTimer = interval + Math.floor(Math.random() * 13) + (challengeSpawned ? 30 : 0);
    }

    const minTop = 55, maxTop = H - GAP - 90;
    for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= speed;
        if (p.grazeGlow > 0) p.grazeGlow--;
        if (p.oscillates) {
            p.oscPhase += OSC_SPEED;
            p.topH = Math.max(minTop, Math.min(maxTop, p.baseTop + Math.sin(p.oscPhase) * OSC_AMPLITUDE));
        }
        if (!p.scored && p.x + PIPE_W < BIRD_X) {
            p.scored = true;
            score++;
            gatesPassed++;
            if (challengeCooldown > 0) challengeCooldown--;
            advanceMission('gate');
            updateSector();
            updateScoreDisplay();
            sndScore();
        }
        // Frôlement : on a longé un bord du trou de très près sans le toucher
        if (!p.closeCalled && !p.scored) {
            const bx = BIRD_X + BIRD_W / 2, by = bird.y + BIRD_H / 2;
            if (bx > p.x - CLOSE_CALL_REACH && bx < p.x + PIPE_W + CLOSE_CALL_REACH) {
                // Dégagement réel entre le BORD de la hitbox et la lèvre du tuyau — même
                // référentiel que collides(), donc la bande annoncée est celle qu'on peut
                // vraiment occuper (cf. commentaire sur CLOSE_CALL_CLEARANCE).
                const clearTop = (by - BIRD_HIT_HALF_H) - p.topH;
                const clearBot = (p.topH + GAP) - (by + BIRD_HIT_HALF_H);
                // DÉTECTION BALAYÉE : on ne teste pas seulement la position à l'instant de la
                // frame, mais tout le SEGMENT parcouru depuis la précédente. La trajectoire
                // étant une parabole, l'orni ne tient jamais une altitude : il traverse la
                // bande. À 7 px/frame en piqué il pouvait la franchir ENTRE deux images sans
                // jamais y être échantillonné — le geste était réussi mais non crédité, ce qui
                // donnait l'impression d'un bonus capricieux. On mesure donc le dégagement
                // MINIMAL atteint pendant la frame, tout en exigeant que la position finale
                // soit dégagée (sinon c'est une collision, gérée plus bas).
                const byPrev = (bird.prevY !== undefined ? bird.prevY : bird.y) + BIRD_H / 2;
                const clearTopPrev = (byPrev - BIRD_HIT_HALF_H) - p.topH;
                const clearBotPrev = (p.topH + GAP) - (byPrev + BIRD_HIT_HALF_H);
                const grazeTop = clearTop >= 0 && Math.min(clearTop, clearTopPrev) < CLOSE_CALL_CLEARANCE;
                const grazeBot = clearBot >= 0 && Math.min(clearBot, clearBotPrev) < CLOSE_CALL_CLEARANCE;
                if (grazeTop || grazeBot) {
                    p.closeCalled = true;
                    combo++; comboTimer = 90;
                    const gain = 2 * Math.min(combo, 5);
                    score += gain;
                    advanceMission('close');
                    updateScoreDisplay();
                    sndCloseCall();
                    // FEEDBACK DU FRÔLEMENT — c'est la mécanique signature du jeu (jusqu'à +10 pts)
                    // et elle n'avait qu'un bip. On la rend lisible et gratifiante :
                    //  · texte flottant au point exact du passage, taille et couleur selon le combo
                    //  · trauma qui monte avec la série → les gros combos font vibrer l'écran
                    //  · étincelles éjectées le long du bord frôlé, dans le sens du frottement
                    const edgeY = grazeTop ? p.topH : p.topH + GAP;
                    const hot = Math.min(combo, 5) / 5;                    // 0 → 1 selon l'intensité de la série
                    addFloater(bx + 6, edgeY + (edgeY < by ? -14 : 20),
                        '+' + gain, hot > .6 ? '#ff9d3c' : '#ffd257', 14 + hot * 6);
                    // AUCUNE secousse ici : on est en plein passage du pilier, l'image doit
                    // rester parfaitement lisible. À la place, la lèvre frôlée s'illumine —
                    // ça pointe exactement l'endroit où l'exploit a eu lieu, ça récompense
                    // à la hauteur du combo, et ça ne déplace pas un seul pixel.
                    p.grazeGlow = 16;
                    p.grazeTop  = grazeTop;
                    p.grazeHot  = hot;
                    comboFlash = 12;
                    for (let k = 0; k < 6 + Math.round(hot * 8); k++) {
                        particles.push({
                            x: bx + Math.random() * 14, y: edgeY + (Math.random() - .5) * 5,
                            vx: -2.4 - Math.random() * 2.6, vy: (Math.random() - .5) * 1.6,
                            life: 16 + Math.random() * 14, maxLife: 30,
                            size: .9 + Math.random() * 1.7, hue: 34 + hot * 14,
                        });
                    }
                }
            }
        }
        if (p.x < -PIPE_W - 20) pipes.splice(i, 1);
    }

    // Épice & bouclier
    const bcx = BIRD_X + BIRD_W / 2, bcy = bird.y + BIRD_H / 2;
    for (let i = spiceItems.length - 1; i >= 0; i--) {
        const sp = spiceItems[i];
        sp.x -= speed;
        if (!sp.collected) {
            const dx = sp.x - bcx, dy = sp.y - bcy;
            const pickup=(dx*dx)/(COLLECTIBLE_PICKUP_X*COLLECTIBLE_PICKUP_X)+(dy*dy)/(COLLECTIBLE_PICKUP_Y*COLLECTIBLE_PICKUP_Y);
            if (pickup < 1) {
                sp.collected = true; score += 3; emitBurst(sp.x, sp.y, 14, 40);
                advanceMission('spice'); sndSpice(); updateScoreDisplay();
                // Dosage volontairement faible : un ramassage se produit souvent, s'il
                // secouait autant qu'un crash le jeu deviendrait épuisant. 2 frames de gel
                // suffisent à « accrocher » la collecte.
                addHitstop(2);                    // gel seul : pas de déplacement en plein vol
                addFloater(sp.x, sp.y - 12, '+3', '#ffc14d', 13);
            }
        }
        if (sp.x < -20) spiceItems.splice(i, 1);
    }
    for (let i = powerups.length - 1; i >= 0; i--) {
        const pu = powerups[i];
        pu.x -= speed;
        if (!pu.collected) {
            const dx = pu.x - bcx, dy = pu.y - bcy;
            const pickup=(dx*dx)/(COLLECTIBLE_PICKUP_X*COLLECTIBLE_PICKUP_X)+(dy*dy)/(COLLECTIBLE_PICKUP_Y*COLLECTIBLE_PICKUP_Y);
            if (pickup < 1) {
                pu.collected = true; shielded = true; emitBurst(pu.x, pu.y, 18, 195); sndShield();
                addHitstop(3); addFlash(0.28, 200);
                addFloater(pu.x, pu.y - 14, 'BOUCLIER', '#7fd4ff', 14);
            }
        }
        if (pu.x < -20) powerups.splice(i, 1);
    }
    for (let i = challengeItems.length - 1; i >= 0; i--) {
        const item = challengeItems[i];
        item.x -= speed;
        const dx = item.x - bcx, dy = item.y - bcy;
        if ((dx * dx) / (24 * 24) + (dy * dy) / (22 * 22) < 1) {
            challengeItems.splice(i, 1);
            chooseMission();
            emitBurst(item.x, item.y, 26, 24);
            sndContract();
            addHitstop(3);
            addFloater(item.x, item.y - 16, 'CONTRAT', '#e4c16d', 14);
            continue;
        }
        if (item.x < -28) {
            challengeItems.splice(i, 1);
            challengeCooldown = 1;
        }
    }

    maybeSpawnWorm();

    if (shieldGrace <= 0 && (collides() || collidesWorm())) {
        if (shielded) {
            // Le bouclier absorbe le choc : on rebondit et on repart, une seule fois.
            // Feedback dédié : le joueur doit COMPRENDRE qu'il vient de consommer sa vie
            // gratuite, pas juste entendre un son au milieu de l'action.
            shielded = false;
            shieldGrace = 25;
            bird.vy = FLAP_FORCE;
            sndShield();
            emitSand(bcx, bcy, 10);
            addHitstop(5);                    // ~83 ms : on sent le choc encaissé
            addTrauma(SHAKE.degat);
            addFlash(0.5, 200);               // flash bleu = couleur du bouclier
            addSquash(-1);                    // l'appareil s'écrase puis se retend
            addFloater(bcx, bcy - 30, 'BOUCLIER PERDU', '#7fd4ff', 13);
            emitBurst(bcx, bcy, 22, 195);
        } else {
            gameState = 'dead';
            frameCount = 0;
            sndCrash();
            if (score > 0) {
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('orni_best', String(score));
                }
                submitScore(score);
            }
            // CRASH — l'événement le plus important du jeu méritait mieux qu'un nuage de sable.
            addHitstop(9);                    // ~150 ms : plus long que les autres, c'est terminal
            addTrauma(SHAKE.crash);           // plafond : 13 px de secousse
            addFlash(1);
            addSquash(-1);
            emitSand(bcx, bcy, 25);
            emitBurst(bcx, bcy, 30, 26);
            // Débris projetés DANS LE SENS de l'impact (vers l'arrière + selon la vitesse
            // verticale au moment du choc) plutôt qu'en étoile symétrique : une explosion
            // radiale ne dit rien de la trajectoire, une gerbe orientée raconte le crash.
            const dirY = Math.max(-1, Math.min(1, bird.vy / 9));
            for (let k = 0; k < 14; k++) {
                debris.push({
                    x: bcx + (Math.random() - .5) * 16,
                    y: bcy + (Math.random() - .5) * 12,
                    vx: -1.5 - Math.random() * 4.5,
                    vy: dirY * 3.5 + (Math.random() - .65) * 5.5,
                    vr: (Math.random() - .5) * .34,
                    rot: Math.random() * Math.PI,
                    w: 2.5 + Math.random() * 5,
                    h: 1.5 + Math.random() * 3.5,
                    color: ['#8a6030', '#5a3a20', '#3d2410', '#b8a670'][Math.floor(Math.random() * 4)],
                    rested: false,
                });
            }
        }
    }
}

function draw() {
    drawSky();
    ctx.save();
    if (weather && weather.phase === 'active' && weather.type === 'gust') {
        ctx.translate(Math.sin(frameCount * .83) * 1.4, Math.cos(frameCount * .61) * 1.1);
    }
    // Screenshake : amplitude = trauma² (petits chocs discrets, gros chocs francs), appliqué
    // ICI pour ne secouer QUE le monde — le score et les panneaux d'UI restent stables, sinon
    // le HUD devient illisible au pire moment.
    if (trauma > 0) {
        const s = trauma * trauma;
        ctx.translate(
            (Math.random() * 2 - 1) * TRAUMA_MAX_OFFSET * s,
            (Math.random() * 2 - 1) * TRAUMA_MAX_OFFSET * s
        );
        ctx.rotate((Math.random() * 2 - 1) * TRAUMA_MAX_ROT * s);
    }
    drawDunes();
    drawDebris();
    drawParticles();
    for (const p of pipes) drawPipe(p);
    for (const sp of spiceItems) drawSpiceItem(sp);
    for (const pu of powerups) drawPowerup(pu);
    for (const item of challengeItems) drawChallengeItem(item);
    drawWorm();
    drawBird();
    drawShieldRing();
    drawFloaters();   // dans la couche monde : le texte suit le point exact du frôlement
    ctx.restore();
    drawWeather();
    drawSectorTransition();
    if (gameState === 'playing') drawScore();
    if (gameState === 'menu') drawMenu();
    if (gameState === 'dead') drawDead();

    // Vignette subtile
    const vignette = ctx.createRadialGradient(W / 2, H / 2, W * 0.3, W / 2, H / 2, W * 0.7);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(6,3,1,0.4)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    // Flash d'impact — tout en dernier, par-dessus la vignette, pour qu'il domine vraiment
    // l'image l'instant où il tape. Courbe au carré = extinction franche, pas de traîne molle.
    if (flashT > 0) {
        const a = flashT * flashT * 0.62;
        ctx.fillStyle = flashHue
            ? `hsla(${flashHue}, 90%, 72%, ${a})`
            : `rgba(255,244,214,${a})`;
        ctx.fillRect(0, 0, W, H);
    }
}

// Timers de jus : tournent TOUJOURS, y compris pendant un hitstop. C'est volontaire —
// le screenshake et le flash doivent jouer PENDANT le gel, sinon le gel ressemble à un
// freeze technique au lieu d'un impact.
function decayJuice() {
    if (trauma  > 0) trauma  = Math.max(0, trauma  - TRAUMA_DECAY);
    if (squashT > 0) squashT = Math.max(0, squashT - 0.085);
    if (flashT  > 0) flashT  = Math.max(0, flashT  - 0.12);
    if (comboFlash > 0) comboFlash--;
    for (let i = floaters.length - 1; i >= 0; i--) {
        const f = floaters[i];
        f.y += f.vy; f.vy *= 0.94; f.life--;
        if (f.life <= 0) floaters.splice(i, 1);
    }
}

function loop(now) {
    requestAnimationFrame(loop);
    if (!lastTime) { lastTime = now; return; }
    const dt = Math.min(now - lastTime, 100);
    lastTime = now;
    accumulator += dt;
    while (accumulator >= FRAME_DUR) {
        // Hitstop : on saute la simulation du monde, mais le jus continue de vivre.
        if (hitstop > 0) hitstop--;
        else tick();
        decayJuice();
        accumulator -= FRAME_DUR;
    }
    draw();
}

// ──────────────────────────────────────────────
//  INITIALISATION
// ──────────────────────────────────────────────
bestScore = parseInt(localStorage.getItem('orni_best') || '0', 10);
gameState = 'menu';
reset();
loadLeaderboard();
requestAnimationFrame(loop);
})();
</script>
