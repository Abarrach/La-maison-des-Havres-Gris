; ============================================================
;  Configuration PHP par dossier (.user.ini, lue par PHP-FPM)
;  S'applique à /srv/dune-map/ et ses sous-dossiers (dont /v2/).
;
;  Sessions "rester connecté" : 30 jours. Évite de devoir repasser
;  par Discord à chaque retour / après fermeture du navigateur.
;  (Changements pris en compte sous ~5 min — cache user_ini.)
; ============================================================

; Dossier de sessions DÉDIÉ (hors /var/lib/php/sessions) : indispensable, sinon
; le cron système "sessionclean" de Debian/Ubuntu purge nos sessions au bout de
; ~24 min (il ignore le gc_maxlifetime ci-dessous). Le dossier doit exister et
; être accessible en écriture par www-data : chmod 700, chown www-data:www-data.
session.save_path       = "/var/lib/dune-map-sessions"

session.gc_maxlifetime  = 2592000   ; durée de vie serveur (30 j)
session.cookie_lifetime = 2592000   ; cookie persistant (30 j, survit à la fermeture du navigateur)
session.cookie_secure   = 1         ; cookie envoyé uniquement en HTTPS
session.cookie_httponly = 1         ; cookie inaccessible au JavaScript (anti-XSS)
session.cookie_samesite = "Lax"     ; compatible avec le retour OAuth (navigation top-level)
